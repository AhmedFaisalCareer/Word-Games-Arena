<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Games Arena</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #0b1220;
    --bg-soft: #111b2e;
    --panel: #162238;
    --panel2: #1d2b44;
    --panel3: #243553;
    --text: #f8fafc;
    --muted: #a9b7ca;
    --primary: #7c6cff;
    --primary-hover: #9184ff;
    --secondary: #39c6e8;
    --success: #38d996;
    --danger: #ff667f;
    --warning: #f6c85f;
    --border: rgba(255,255,255,.14);
    --shadow: rgba(0,0,0,.28);
}

body.light {
    --bg: #f3f6fb;
    --bg-soft: #e9eef7;
    --panel: #ffffff;
    --panel2: #eef2f8;
    --panel3: #e3e9f3;
    --text: #172033;
    --muted: #59677d;
    --primary: #6256d9;
    --primary-hover: #5146c8;
    --secondary: #138da9;
    --success: #168c62;
    --danger: #d9435e;
    --warning: #a66b00;
    --border: rgba(23,32,51,.13);
    --shadow: rgba(27,39,60,.14);
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 0%, rgba(124,108,255,.10), transparent 30%),
        radial-gradient(circle at 90% 100%, rgba(57,198,232,.07), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    transition: background .25s, color .25s;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid rgba(57,198,232,.45);
    outline-offset: 2px;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none !important;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-card {
    width: min(430px, 100%);
    background: rgba(13,27,45,.95);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 25px 80px var(--shadow);
    text-align: center;
}

body.light .login-card {
    background: var(--panel);
}

.logo {
    width: 85px;
    height: 85px;
    margin: auto auto 18px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    font-size: 45px;
    box-shadow: 0 15px 35px rgba(108,99,255,.3);
}

.login-card h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.login-card p {
    color: var(--muted);
    margin-bottom: 25px;
}

.login-input {
    width: 100%;
    padding: 15px;
    margin: 7px 0;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.primary-btn {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    color: white;
    font-weight: bold;
    background: linear-gradient(135deg, var(--primary), #8f6cff);
    margin-top: 12px;
    transition: .2s;
}

.primary-btn:hover {
    transform: translateY(-2px);
}

.login-hint {
    font-size: 12px;
    margin-top: 18px;
    color: var(--muted);
}

/* APP */

#app {
    min-height: 100vh;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: rgba(11,18,32,.94);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
}

body.light .topbar {
    background: rgba(255,255,255,.94);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: bold;
}

.brand-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.top-stats {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.stat-pill {
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--panel2);
    color: var(--text);
    font-size: 13px;
}

.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: 0 4px 12px var(--shadow);
    font-size: 18px;
}

.layout {
    display: flex;
    min-height: calc(100vh - 71px);
}

.sidebar {
    width: 245px;
    flex-shrink: 0;
    padding: 18px;
    border-right: 1px solid var(--border);
    background: color-mix(in srgb, var(--panel) 72%, var(--bg) 28%);
}

.nav-title {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 17px 10px 7px;
}

.nav-btn {
    width: 100%;
    padding: 12px;
    margin: 3px 0;
    border-radius: 11px;
    text-align: left;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    font-weight: 600;
    transition: background .18s, border-color .18s, color .18s, transform .18s;
}

.nav-btn:hover {
    background: var(--panel2);
    color: var(--text);
    border-color: var(--border);
    transform: translateX(2px);
}

.nav-btn.active {
    background: linear-gradient(90deg, rgba(124,108,255,.18), var(--panel2));
    color: var(--text);
    border-color: rgba(124,108,255,.35);
    box-shadow: inset 3px 0 0 var(--primary);
}

.main {
    flex: 1;
    padding: 28px;
    max-width: 1500px;
    margin: auto;
    width: 100%;
}

.page-title {
    font-size: clamp(26px,4vw,42px);
    margin-bottom: 8px;
}

.page-subtitle {
    color: var(--muted);
    margin-bottom: 25px;
}

/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 16px;
}

.game-card {
    padding: 23px;
    min-height: 175px;
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    transition: .2s;
}

.game-card:hover {
    transform: translateY(-4px);
    border-color: rgba(108,99,255,.5);
}

.game-icon {
    font-size: 36px;
    margin-bottom: 14px;
}

.game-card h3 {
    margin-bottom: 7px;
}

.game-card p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 17px;
}

.play-btn {
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--primary);
    color: #ffffff;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 5px 16px rgba(98,86,217,.20);
}

/* GAME */

.game-container {
    max-width: 850px;
    margin: auto;
}

.game-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 25px;
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.timer {
    padding: 10px 15px;
    border-radius: 12px;
    background: var(--panel2);
    font-weight: bold;
}

.word-display {
    text-align: center;
    font-size: clamp(30px,7vw,65px);
    letter-spacing: 8px;
    font-weight: bold;
    margin: 30px 0;
}

.game-input {
    display: block;
    width: 100%;
    padding: 17px;
    border: 2px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 14px;
    outline: none;
    text-align: center;
    font-size: 20px;
}

.game-input:focus {
    border-color: var(--primary);
}

.game-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.action-btn {
    padding: 12px 18px;
    border-radius: 11px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 700;
    box-shadow: 0 3px 10px var(--shadow);
}

.action-btn:hover, .play-btn:hover, .primary-btn:hover, .icon-btn:hover {
    filter: brightness(1.06);
    transform: translateY(-1px);
}

.action-btn.primary {
    background: var(--primary);
    color: #ffffff;
    border-color: transparent;
}

.action-btn.danger {
    background: var(--danger);
    color: #ffffff;
    border-color: transparent;
}

.action-btn.success {
    background: var(--success);
    color: #062218;
    border-color: transparent;
}

.score-row {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
    margin: 20px 0;
}

.score-box {
    text-align: center;
    padding: 14px;
    background: var(--panel2);
    border-radius: 13px;
}

.score-box strong {
    display: block;
    font-size: 22px;
    margin-top: 5px;
}

/* HANGMAN KEYBOARD & HINT STYLING */
.hint-box {
    text-align: center;
    background: var(--panel2);
    border: 1px dashed var(--secondary);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 16px;
    color: var(--secondary);
    margin-bottom: 15px;
    font-weight: bold;
}

.qwerty-keyboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 25px;
    user-select: none;
}

.qwerty-row {
    display: flex;
    justify-content: center;
    gap: 6px;
}

.key-btn {
    flex: 1;
    max-width: 45px;
    height: 50px;
    border-radius: 8px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s, opacity 0.15s;
}

.key-btn:hover:not(:disabled) {
    background: var(--primary);
    color: #fff;
    transform: translateY(-2px);
}

.key-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
    border-color: transparent;
}

/* CRYPTO CIPHER STYLING */
.cipher-encoded {
    font-family: 'Courier New', Courier, monospace;
    letter-spacing: 4px;
    word-break: break-all;
    background: var(--panel2);
    padding: 20px;
    border-radius: 14px;
    border: 1px solid var(--primary);
    color: var(--secondary);
    margin: 20px 0;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

/* TRIVIA */

.question-box {
    padding: 20px;
    border-radius: 15px;
    background: var(--panel2);
    margin-bottom: 18px;
}

.question-number {
    color: var(--secondary);
    font-weight: bold;
    margin-bottom: 10px;
}

.question-text {
    font-size: 21px;
    line-height: 1.45;
}

.trivia-option {
    width: 100%;
    padding: 15px;
    text-align: left;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    margin: 6px 0;
}

.trivia-option:hover {
    border-color: var(--primary);
}

.trivia-option.correct {
    background: rgba(35,209,139,.2);
    border-color: var(--success);
}

.trivia-option.wrong {
    background: rgba(255,85,119,.2);
    border-color: var(--danger);
}

/* CHESS */

.chess-layout {
    display: grid;
    grid-template-columns: minmax(300px,620px) 250px;
    gap: 20px;
    justify-content: center;
    align-items: start;
}

.chess-board {
    width: min(92vw,620px);
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(8,1fr);
    grid-template-rows: repeat(8,1fr);
    border: 5px solid #151c29;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
}

.chess-square {
    min-width: 0;
    min-height: 0;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
}

.chess-square.light-square {
    background: #e9d5ad;
}

.chess-square.dark-square {
    background: #8b5e3c;
}

.chess-square.selected {
    box-shadow: inset 0 0 0 5px #ffd43b;
}

.chess-square.last-move {
    box-shadow: inset 0 0 0 5px rgba(0,212,255,.55);
}

.chess-square.legal::after {
    content: "";
    width: 24%;
    height: 24%;
    border-radius: 50%;
    background: rgba(30,30,30,.4);
    position: absolute;
}

.chess-square.capture::after {
    content: "";
    width: 78%;
    height: 78%;
    border: 5px solid rgba(255,80,100,.65);
    border-radius: 50%;
    position: absolute;
}

.chess-piece {
    position: relative;
    z-index: 2;
    font-family:
        "Noto Sans Symbols 2",
        "Segoe UI Symbol",
        "Arial Unicode MS",
        sans-serif;
    font-size: clamp(28px,6.5vw,58px);
    line-height: 1;
    user-select: none;
    filter: drop-shadow(1px 3px 2px rgba(0,0,0,.5));
}

.white-piece {
    color: #ffffff;
    text-shadow:
        0 0 1px #111,
        1px 1px 2px #111,
        -1px -1px 1px #111;
}

.black-piece {
    color: #111827;
    text-shadow: 0 1px 1px rgba(255,255,255,.3);
}

.chess-side {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
}

.turn-box {
    padding: 13px;
    border-radius: 11px;
    background: var(--panel2);
    margin-bottom: 15px;
    text-align: center;
    font-weight: bold;
}

.captured {
    min-height: 40px;
    padding: 8px;
    background: var(--panel2);
    border-radius: 10px;
    margin: 8px 0 15px;
    font-size: 22px;
    word-break: break-word;
}

.move-history {
    height: 250px;
    overflow-y: auto;
    background: var(--panel2);
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
}

.move-item {
    padding: 5px;
    border-bottom: 1px solid var(--border);
}

/* ONLINE */

.online-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    max-width: 700px;
    margin: auto;
}

.room-code {
    font-size: 32px;
    letter-spacing: 5px;
    font-weight: bold;
    text-align: center;
    padding: 20px;
    background: var(--panel2);
    border-radius: 15px;
    margin: 20px 0;
}

.share-link {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
}

/* PROFILE */

.profile-card {
    max-width: 650px;
    margin: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 30px;
}

.avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;
    margin: auto auto 15px;
}

.profile-name {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
}

.progress {
    height: 10px;
    border-radius: 10px;
    background: var(--panel2);
    overflow: hidden;
    margin: 10px 0 20px;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg,var(--primary),var(--secondary));
}

/* SHOP */

.shop-item {
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 17px;
}

.shop-item p {
    color: var(--muted);
    margin: 7px 0 15px;
}

/* TOAST */

#toast {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 9999;
    max-width: 350px;
    padding: 14px 18px;
    background: #111827;
    color: white;
    border-radius: 13px;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
    transform: translateY(120px);
    opacity: 0;
    transition: .25s;
}

#toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* MOBILE */

@media(max-width:850px) {
    .sidebar {
        width: 75px;
        padding: 10px;
    }

    .nav-btn {
        text-align: center;
        font-size: 0;
        min-height: 46px;
        padding: 10px 6px;
    }

    .nav-btn::first-letter {
        font-size: 21px;
    }

    .nav-title {
        display: none;
    }

    .main {
        padding: 18px;
    }

    .chess-layout {
        grid-template-columns: 1fr;
    }

    .chess-side {
        width: min(92vw,620px);
        margin: auto;
    }
}

@media(max-width:550px) {
    .topbar {
        padding: 10px;
    }

    .brand span {
        display: none;
    }

    .top-stats .stat-pill {
        display: none;
    }

    .score-row {
        grid-template-columns: repeat(2,1fr);
    }

    .game-panel {
        padding: 15px;
    }
    
    .key-btn {
        height: 42px;
        font-size: 14px;
    }
}

/* THEME / CONTROL VISIBILITY */
.theme-option, .theme-btn, .settings-btn {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-weight: 700;
}

.theme-option:hover, .theme-btn:hover, .settings-btn:hover {
    background: var(--panel3);
    border-color: rgba(124,108,255,.45);
}

@media(max-width:850px) {
    .sidebar {
        box-shadow: 8px 0 25px var(--shadow);
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">
    <div class="login-card">
        <div class="logo">🎮</div>

        <h1>Word Games Arena</h1>
        <p>Play. Think. Compete. Improve.</p>

        <input
            id="usernameInput"
            class="login-input"
            type="text"
            placeholder="Username"
            autocomplete="off"
        >

        <input
            id="pinInput"
            class="login-input"
            type="password"
            placeholder="PIN"
            autocomplete="off"
        >

        <button class="primary-btn" onclick="login()">
            Enter Arena
        </button>

        <div class="login-hint">
            Login ID: Ahmed &nbsp; | &nbsp; PIN: 123456
        </div>
    </div>
</section>

<!-- APP -->

<section id="app" class="hidden">

    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">🎮</div>
            <span>Word Games Arena</span>
        </div>

        <div class="top-stats">
            <div class="stat-pill">⭐ XP: <b id="xpTop">0</b></div>
            <div class="stat-pill">🪙 <b id="coinsTop">100</b></div>
            <div class="stat-pill">🏆 <b id="winsTop">0</b></div>
            <button class="icon-btn" onclick="toggleTheme()">🌙</button>
        </div>

    </header>

    <div class="layout">

        <aside class="sidebar">

            <div class="nav-title">Navigation</div>

            <button class="nav-btn active" onclick="showPage('home',this)">
                🏠 Home
            </button>

            <button class="nav-btn" onclick="showPage('games',this)">
                🎮 Games
            </button>

            <div class="nav-title">Single Player</div>

            <button class="nav-btn" onclick="startGame('hangman',this)">
                🎯 Hangman
            </button>

            <button class="nav-btn" onclick="startGame('cipher',this)">
                🔐 Crypto Cipher
            </button>

            <button class="nav-btn" onclick="startGame('rush',this)">
                ⌨️ Letter Rush
            </button>

            <button class="nav-btn" onclick="startGame('scramble',this)">
                🔀 Scramble
            </button>

            <button class="nav-btn" onclick="startGame('master',this)">
                🧠 Word Master
            </button>

            <button class="nav-btn" onclick="startGame('trivia',this)">
                ❓ Trivia Blitz
            </button>

            <button class="nav-btn" onclick="startGame('chess',this)">
                ♟️ Chess
            </button>

            <div class="nav-title">Multiplayer</div>

            <button class="nav-btn" onclick="startGame('duel',this)">
                ⚔️ Local Duel
            </button>

            <div class="nav-title">Online</div>

            <button class="nav-btn" onclick="startGame('onlineWord',this)">
                🌐 Word Battle
            </button>

            <button class="nav-btn" onclick="startGame('onlineChess',this)">
                ♟️ Online Chess
            </button>

            <div class="nav-title">User Area</div>

            <button class="nav-btn" onclick="showPage('shop',this)">
                🛒 Shop
            </button>

            <button class="nav-btn" onclick="showPage('achievements',this)">
                🏅 Achievements
            </button>

            <button class="nav-btn" onclick="showPage('profile',this)">
                👤 Profile
            </button>

            <button class="nav-btn" onclick="logout()">
                🚪 Logout
            </button>

        </aside>

        <main id="main" class="main"></main>

    </div>

const LOGIN_ID = "Ahmed";
const LOGIN_PASSWORD = "123456";
const STORAGE_KEY = "wordGamesArenaProfile";

function defaultProfile() {
    return {

        pin: LOGIN_PASSWORD,
        avatar: "😎",
        xp: 0,
        coins: 100,
        wins: 0,
        losses: 0,

        level: 1,
        achievements: [],
        theme: "dark"
    };

function saveProfile() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
}

function login() {

    const username =
        document.getElementById("usernameInput").value.trim();

    const pin =
        document.getElementById("pinInput").value.trim();

    if (
        username.toLowerCase() !== LOGIN_ID.toLowerCase() ||
        pin !== LOGIN_PASSWORD
    ) {
        toast("❌ Incorrect ID or password.");
        return;

    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
        try {
            profile = JSON.parse(saved);

            profile = defaultProfile();

        profile = defaultProfile();
        saveProfile();

function logout() {
    stopAllTimers();
    document.getElementById("app").classList.add("hidden");

    if (!profile) return;

    document.getElementById("xpTop").textContent = profile.xp;
    document.getElementById("coinsTop").textContent = profile.coins;
    document.getElementById("winsTop").textContent = profile.wins;
}

function addXP(amount) {

    profile.xp += amount;

    const newLevel =
        Math.floor(profile.xp / 500) + 1;

    if (newLevel > profile.level) {
        profile.level = newLevel;
        toast("🎉 Level Up! Level " + profile.level);
    }

    saveProfile();
    updateTop();
}

function addCoins(amount) {

    profile.coins = Math.max(
        0,
        profile.coins + amount
    );

    saveProfile();
    updateTop();
}

    document.body.classList.toggle("light");

/* =========================================================
   NAVIGATION + TIMER SYSTEM
========================================================= */

let gameSession = 0;
const timers = new Set();

function newSession() {

    gameSession++;

    stopAllTimers();

    return gameSession;
}

function safeTimeout(callback, delay, session) {

    const id = setTimeout(() => {

        timers.delete(id);

        if (session !== gameSession) return;

        callback();

    }, delay);

    timers.add(id);

    return id;
}

function safeInterval(callback, delay, session) {

    const id = setInterval(() => {

        if (session !== gameSession) {

            clearInterval(id);
            timers.delete(id);
            return;
        }

        callback();

    }, delay);

    timers.add(id);

    return id;
}

function stopAllTimers() {

    timers.forEach(id => {

        clearTimeout(id);
        clearInterval(id);

    });

    timers.clear();
}

/* =========================================================
   HANGMAN (UPDATED WITH SPECIFIC HINTS & QWERTY KEYBOARD)
========================================================= */

let hangObj = {};
let hangGuessed = [];
let hangLives = 6;

const qwertyRows = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["Z","X","C","V","B","N","M"]
];

function renderHangman() {

    hangObj = hangmanData[Math.floor(Math.random() * hangmanData.length)];
    hangGuessed = [];
    hangLives = 6;

    drawHangman();
}

function drawHangman() {

    const word = hangObj.word;
    const display = word
        .split("")
        .map(letter => hangGuessed.includes(letter) ? letter : "_")
        .join(" ");

    let keyboardHTML = `<div class="qwerty-keyboard">`;
    qwertyRows.forEach(row => {
        keyboardHTML += `<div class="qwerty-row">`;
        row.forEach(char => {
            const isUsed = hangGuessed.includes(char);
            keyboardHTML += `
                <button 
                    class="key-btn" 
                    ${isUsed ? 'disabled' : ''} 
                    onclick="hangGuess('${char}')">
                    ${char}
                </button>
            `;
        });
        keyboardHTML += `</div>`;
    });
    keyboardHTML += `</div>`;

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-panel">

                <div class="game-header">
                    <div>
                        <h2>🎯 Hangman</h2>
                        <p class="page-subtitle">
                            Guess the word before running out of lives.
                        </p>
                    </div>

                    <div class="timer">
                        ❤️ Lives: ${hangLives}
                    </div>
                </div>

                <div class="hint-box">
                    💡 Hint: ${hangObj.hint}
                </div>

                <div class="word-display">
                    ${display}
                </div>

                ${keyboardHTML}

                <div class="game-actions" style="margin-top: 20px; justify-content: center;">
                    <button class="action-btn" onclick="renderHangman()">
                        New Word
                    </button>
                </div>

            </div>

        </div>
    `;
}

function hangGuess(letter) {

    if (hangGuessed.includes(letter) || hangLives <= 0) return;

    hangGuessed.push(letter);

    if (!hangObj.word.includes(letter)) {
        hangLives--;
    }

    const won = hangObj.word.split("").every(l => hangGuessed.includes(l));

    if (won) {
        profile.wins++;
        addXP(50);
        addCoins(20);

        toast("🎉 You won!");

        safeTimeout(() => renderHangman(), 1500, gameSession);
        drawHangman();
        return;
    }

    if (hangLives <= 0) {
        toast("💀 Word was: " + hangObj.word);

        profile.losses++;
        saveProfile();

        safeTimeout(() => renderHangman(), 2000, gameSession);
        drawHangman();
        return;
    }

    drawHangman();
}

/* =========================================================
   NEW GAME: CRYPTO CIPHER
========================================================= */

let cipherOriginal = "";
let cipherEncoded = "";
let cipherShift = 0;
let cipherScore = 0;

const cipherPhrases = [
    "KNOWLEDGE IS POWER",
    "SECRET CODE BROKEN",
    "DECODE THE MESSAGE",
    "CYBER SECURITY HERO",
    "ALGORITHM MASTER",
    "CRYPTOGRAPHY ROCKS",
    "PUZZLE SOLVER ELITE"
];

function renderCipher() {
    cipherOriginal = cipherPhrases[Math.floor(Math.random() * cipherPhrases.length)];
    cipherShift = Math.floor(Math.random() * 5) + 1; // Shift between 1 and 5
    cipherEncoded = caesarShift(cipherOriginal, cipherShift);

    document.getElementById("main").innerHTML = `
        <div class="game-container">
            <div class="game-panel">
                <div class="game-header">
                    <div>
                        <h2>🔐 Crypto Cipher</h2>
                        <p class="page-subtitle">
                            Decode the message encrypted with a Caesar Shift (+${cipherShift}).
                        </p>
                    </div>
                    <div class="timer">
                        ⭐ XP: ${cipherScore}
                    </div>
                </div>

                <div class="hint-box">
                    💡 Shift each letter backward by ${cipherShift} position(s) in the alphabet!
                </div>

                <div class="cipher-encoded">
                    ${cipherEncoded}
                </div>

                <input
                    id="cipherInput"
                    class="game-input"
                    type="text"
                    placeholder="Type decoded message..."
                    autocomplete="off"
                    style="text-transform: uppercase;"
                >

                <div class="game-actions">
                    <button class="action-btn primary" onclick="checkCipher()">
                        Decrypt
                    </button>
                    <button class="action-btn" onclick="renderCipher()">
                        Skip Phrase
                    </button>
                </div>
            </div>
        </div>
    `;

    const input = document.getElementById("cipherInput");
    if (input) {
        input.focus();
        input.addEventListener("keydown", e => {
            if (e.key === "Enter") checkCipher();
        });
    }
}

function caesarShift(str, amount) {
    if (amount < 0) return caesarShift(str, amount + 26);
    let output = "";
    for (let i = 0; i < str.length; i++) {
        let c = str[i];
        if (c.match(/[a-z]/i)) {
            let code = str.charCodeAt(i);
            if (code >= 65 && code <= 90) {
                c = String.fromCharCode(((code - 65 + amount) % 26) + 65);
            }
        }
        output += c;
    }
    return output;
}

function checkCipher() {
    const input = document.getElementById("cipherInput");
    if (!input) return;

    const val = input.value.trim().toUpperCase();
    if (val === cipherOriginal) {
        toast("🎉 Correctly Decoded!");
        cipherScore += 20;
        addXP(30);
        addCoins(10);
        profile.wins++;
        saveProfile();
        renderCipher();
    } else {
        toast("❌ Incorrect decoding. Try again!");
    }
}

function newRushWord() {

    rushWord =
        rushWords[
            Math.floor(Math.random()*rushWords.length)
        ];
}

function rushInputHandler(event) {

    const value =
        event.target.value
        .trim()
        .toUpperCase();

    if (value === rushWord) {

        rushScore += 10;

        const score =
            document.getElementById("rushScore");

        const words =
            document.getElementById("rushWordsDone");

        if (score) score.textContent = rushScore;

        if (words) {
            words.textContent =
                Number(words.textContent) + 1;
        }

        event.target.value = "";

        newRushWord();

        const word =
            document.getElementById("rushWord");

        if (word) word.textContent = rushWord;

        addCoins(1);
    }
}

function endRush() {

    stopAllTimers();

    addXP(rushScore);

    if (rushScore > profile.best) {
        profile.best = rushScore;
    }

    saveProfile();

/* =========================================================
   WORD SCRAMBLE
========================================================= */

let scrambleWord = "";
let scrambleAnswer = "";
let scrambleScore = 0;
let scrambleTime = 45;
let scrambleSession = 0;

function shuffleWord(word) {

    const arr = word.split("");

    for (let i = arr.length-1; i>0; i--) {

        const j =
            Math.floor(Math.random()*(i+1));

        [arr[i],arr[j]] =
            [arr[j],arr[i]];
    }

    return arr.join("");
}

function renderScramble() {

    scrambleSession = newSession();

    scrambleScore = 0;
    scrambleTime = 45;

    newScrambleWord();

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-panel">

                <div class="game-header">

                    <div>
                        <h2>🔀 Word Scramble</h2>
                        <p class="page-subtitle">
                            Unscramble the letters.
                        </p>
                    </div>

                    <div class="timer">
                        ⏱ <span id="scrambleTimer">45</span>s
                    </div>

                </div>

                <div class="score-row">

                    <div class="score-box">
                        Score
                        <strong id="scrambleScore">0</strong>
                    </div>

                    <div class="score-box">
                        Time
                        <strong id="scrambleTime">45</strong>
                    </div>

                    <div class="score-box">
                        Solved
                        <strong id="scrambleSolved">0</strong>
                    </div>

                    <div class="score-box">
                        Bonus
                        <strong>+10</strong>
                    </div>

                </div>

                <div
                    id="scrambleDisplay"
                    class="word-display">
                    ${scrambleWord}
                </div>

                <input
                    id="scrambleInput"
                    class="game-input"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Type the original word..."
                >

                <div class="game-actions">

                    <button
                        class="action-btn primary"
                        onclick="checkScramble()">
                        Submit
                    </button>

                    <button
                        class="action-btn"
                        onclick="startScrambleAgain()">
                        Restart
                    </button>

                </div>

            </div>

        </div>
    `;

    const input =
        document.getElementById("scrambleInput");

    input.focus();

    input.addEventListener("keydown", e => {

        if (e.key === "Enter") {
            checkScramble();
        }

    });

    safeInterval(() => {

        scrambleTime--;

        const timer =
            document.getElementById("scrambleTimer");

        const time =
            document.getElementById("scrambleTime");

        if (timer) timer.textContent = scrambleTime;
        if (time) time.textContent = scrambleTime;

        if (scrambleTime <= 0) {
            endScramble();
        }

    },1000,scrambleSession);
}

function newScrambleWord() {

    scrambleAnswer =
        scrambleWords[
            Math.floor(Math.random()*scrambleWords.length)
        ];

    scrambleWord =
        shuffleWord(scrambleAnswer);

    if (scrambleWord === scrambleAnswer) {
        scrambleWord =
            shuffleWord(scrambleAnswer);
    }
}

function checkScramble() {

    const input =
        document.getElementById("scrambleInput");

    if (!input) return;

    const value =
        input.value.trim().toUpperCase();

    if (value === scrambleAnswer) {

        scrambleScore += 10;

        const score =
            document.getElementById("scrambleScore");

        const solved =
            document.getElementById("scrambleSolved");

        if (score) score.textContent = scrambleScore;

        if (solved) {
            solved.textContent =
                Number(solved.textContent) + 1;
        }

        input.value = "";

        newScrambleWord();

        const display =
            document.getElementById("scrambleDisplay");

        if (display) {
            display.textContent = scrambleWord;
        }

        addCoins(2);

        toast("✅ Correct!");

    } else {

        toast("❌ Try again!");
    }
}

function endScramble() {

    stopAllTimers();

    addXP(scrambleScore);

    toast(
        "⏱ Time up! Score: " +
        scrambleScore
    );

    const input =
        document.getElementById("scrambleInput");

    if (input) input.disabled = true;
}

function startScrambleAgain() {

    newSession();
    renderScramble();
}

let masterTarget = "";

function newMasterWord() {

    masterTarget =
        masterWords[
            Math.floor(Math.random()*masterWords.length)
        ];
}

function drawMaster() {

    let rows = "";

    for (let i=0;i<6;i++) {

        const word =
            masterBoard[i] || "";

        let cells = "";

        for (let j=0;j<5;j++) {

            const letter =
                word[j] || "";

            let cls = "";

            if (letter) {

                if (letter === masterTarget[j]) {
                    cls = "correct";
                } else if (masterTarget.includes(letter)) {
                    cls = "present";
                } else {
                    cls = "absent";
                }
            }

            cells += `
                <span style="
                    display:flex;
                    width:55px;
                    height:55px;
                    align-items:center;
                    justify-content:center;
                    border:2px solid var(--border);
                    border-radius:9px;
                    background:
                        ${
                            cls==="correct"
                            ? "rgba(35,209,139,.35)"
                            : cls==="present"
                            ? "rgba(255,202,58,.35)"
                            : cls==="absent"
                            ? "rgba(255,85,119,.25)"
                            : "var(--panel2)"
                        };
                    font-size:24px;
                    font-weight:bold;
                ">
                    ${letter}
                </span>
            `;
        }

        rows += `
            <div style="
                display:flex;
                justify-content:center;
                gap:7px;
                margin:7px;
            ">
                ${cells}
            </div>
        `;
    }

    document.getElementById("main").innerHTML = `

            <div class="game-panel">

                <div class="game-header">

                    <div>
                        <h2>🧠 Word Master</h2>
                        <p class="page-subtitle">
                            Find the hidden five-letter word.
                        </p>
                    </div>

                    <div class="timer">
                        Attempts: ${masterAttempts}/6
                    </div>

                </div>

                ${rows}

                <input
                    id="masterInput"
                    class="game-input"
                    maxlength="5"
                    placeholder="Enter 5 letters"
                    autocomplete="off"
                    style="margin-top:20px"
                >

                <div class="game-actions">

                    <button
                        class="action-btn primary"
                        onclick="submitMaster()">
                        Guess
                    </button>

                    <button
                        class="action-btn"
                        onclick="renderMaster()">
                        New Word
                    </button>

                </div>

            </div>

        </div>
    `;

    document
        .getElementById("masterInput")
        .focus();
}

function submitMaster() {

    const input =
        document.getElementById("masterInput");

    const word =
        input.value.trim().toUpperCase();

    if (word.length !== 5) {
        toast("Enter exactly 5 letters.");
        return;
    }

    masterBoard.push(word);
    masterAttempts++;

    if (word === masterTarget) {

        addXP(80);
        addCoins(25);
        profile.wins++;
        saveProfile();

        drawMaster();

        toast("🏆 Word Master solved!");

        safeTimeout(
            () => renderMaster(),
            1400,
            gameSession
        );

        return;
    }

    if (masterAttempts >= 6) {

        drawMaster();

        toast("The word was " + masterTarget);

        safeTimeout(
            () => renderMaster(),
            1800,
            gameSession
        );

        return;
    }

    input.value = "";

    drawMaster();
}

/* =========================================================
   CHESS
========================================================= */

const chessSymbols = {
    wK:"♔", wQ:"♕", wR:"♖", wB:"♗", wN:"♘", wP:"♙",
    bK:"♚", bQ:"♛", bR:"♜", bB:"♝", bN:"♞", bP:"♟"
};

let chessBoard = [];
let chessTurn = "w";
let chessSelected = null;
let chessLastMove = null;
let chessHistory = [];
let chessCaptured = { w:[], b:[] };

function createChessBoard() {
    return [
        ["bR","bN","bB","bQ","bK","bB","bN","bR"],
        ["bP","bP","bP","bP","bP","bP","bP","bP"],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        ["wP","wP","wP","wP","wP","wP","wP","wP"],
        ["wR","wN","wB","wQ","wK","wB","wN","wR"]
    ];
}

function renderChess() {
    chessBoard = createChessBoard();
    chessTurn = "w";
    chessSelected = null;
    chessLastMove = null;
    chessHistory = [];
    chessCaptured = {w:[],b:[]};

    drawChess();
}

function drawChess() {

    let boardHTML = "";

    const legal =
        chessSelected
            ? getLegalMoves(
                chessSelected.r,
                chessSelected.c
            )
            : [];

    for (let r=0;r<8;r++) {

        for (let c=0;c<8;c++) {

            const piece =
                chessBoard[r][c];

            const isSelected =
                chessSelected &&
                chessSelected.r === r &&
                chessSelected.c === c;

            const isLegal =
                legal.some(
                    x => x.r === r && x.c === c
                );

            const isCapture =
                isLegal && piece !== null;

            const isLast =
                chessLastMove &&
                (
                    (
                        chessLastMove.from.r === r &&
                        chessLastMove.from.c === c
                    ) ||
                    (
                        chessLastMove.to.r === r &&
                        chessLastMove.to.c === c
                    )
                );

            const squareClass =
                ((r+c)%2===0
                    ? "light-square"
                    : "dark-square");

            boardHTML += `

                <div
                    class="
                        chess-square
                        ${squareClass}
                        ${isSelected ? "selected":""}
                        ${isLast ? "last-move":""}
                        ${isCapture ? "capture":""}
                        ${isLegal && !isCapture ? "legal":""}
                    "
                    onclick="clickChessSquare(${r},${c})"
                >

                    ${
                        piece
                        ? `
                            <span class="
                                chess-piece
                                ${
                                    piece[0] === "w"
                                    ? "white-piece"
                                    : "black-piece"
                                }
                            ">
                                ${chessSymbols[piece]}
                            </span>
                        `
                        : ""
                    }

                </div>
            `;
        }
    }

    const turnText =
        chessTurn === "w"
            ? "White's turn"
            : "Black's turn";

    const capturedWhite =
        chessCaptured.w
        .map(p => chessSymbols["b"+p])
        .join("");

    const capturedBlack =
        chessCaptured.b
        .map(p => chessSymbols["w"+p])
        .join("");

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <h2 style="margin-bottom:15px">
                ♟️ Chess Arena
            </h2>

            <div class="chess-layout">

                <div>

                    <div class="chess-board">
                        ${boardHTML}
                    </div>

                </div>

                <div class="chess-side">

                    <div class="turn-box">
                        ${turnText}
                    </div>

                    <b>Captured White</b>

                    <div class="captured">
                        ${capturedWhite || "—"}
                    </div>

                    <b>Captured Black</b>

                    <div class="captured">
                        ${capturedBlack || "—"}
                    </div>

                    <h3 style="margin:15px 0 8px">
                        Move History
                    </h3>

                    <div class="move-history">

                        ${
                            chessHistory.length
                            ? chessHistory
                                .map(
                                    (m,i) =>
                                    `<div class="move-item">
                                        ${i+1}. ${m}
                                    </div>`
                                )
                                .join("")
                            : "No moves yet."
                        }

                    </div>

                    <div class="game-actions">

                        <button
                            class="action-btn primary"
                            onclick="renderChess()">
                            New Game
                        </button>

                        <button
                            class="action-btn danger"
                            onclick="resignChess()">
                            Resign
                        </button>

                    </div>

                </div>

            </div>

        </div>
    `;
}

function inside(r,c) {
    return r>=0 && r<8 && c>=0 && c<8;
}

function getPseudoMoves(r,c,board=chessBoard) {

    const piece = board[r][c];

    if (!piece) return [];

    const color = piece[0];
    const type = piece[1];

    const moves = [];

    const add = (nr,nc) => {

        if (!inside(nr,nc)) return;

        const target = board[nr][nc];

        if (!target || target[0] !== color) {
            moves.push({r:nr,c:nc});
        }
    };

    if (type === "P") {

        const dir =
            color === "w" ? -1 : 1;

        const start =
            color === "w" ? 6 : 1;

        if (
            inside(r+dir,c) &&
            !board[r+dir][c]
        ) {

            moves.push({
                r:r+dir,
                c:c
            });

            if (
                r === start &&
                !board[r+2*dir][c]
            ) {
                moves.push({
                    r:r+2*dir,
                    c:c
                });
            }
        }

        for (const dc of [-1,1]) {

            const nr = r+dir;
            const nc = c+dc;

            if (
                inside(nr,nc) &&
                board[nr][nc] &&
                board[nr][nc][0] !== color
            ) {
                moves.push({r:nr,c:nc});
            }
        }
    }

    if (type === "N") {

        [
            [-2,-1],[-2,1],
            [-1,-2],[-1,2],
            [1,-2],[1,2],
            [2,-1],[2,1]
        ].forEach(([dr,dc]) => {
            add(r+dr,c+dc);
        });
    }

    if (type === "K") {

        for(let dr=-1;dr<=1;dr++) {
            for(let dc=-1;dc<=1;dc++) {

                if(dr || dc) {
                    add(r+dr,c+dc);
                }
            }
        }
    }

    const slide = directions => {

        for (const [dr,dc] of directions) {

            let nr = r+dr;
            let nc = c+dc;

            while(inside(nr,nc)) {

                const target = board[nr][nc];

                if (!target) {

                    moves.push({
                        r:nr,
                        c:nc
                    });

                } else {

                    if(target[0] !== color) {
                        moves.push({
                            r:nr,
                            c:nc
                        });
                    }

                    break;
                }

                nr += dr;
                nc += dc;
            }
        }
    };

    if(type==="B" || type==="Q") {

        slide([
            [-1,-1],[-1,1],
            [1,-1],[1,1]
        ]);
    }

    if(type==="R" || type==="Q") {

        slide([
            [-1,0],[1,0],
            [0,-1],[0,1]
        ]);
    }

    return moves;
}

function cloneBoard(board) {
    return board.map(row => [...row]);
}

function findKing(board,color) {

    for(let r=0;r<8;r++) {

        for(let c=0;c<8;c++) {

            if(board[r][c] === color+"K") {
                return {r,c};
            }
        }
    }

    return null;
}

function squareAttacked(board,r,c,byColor) {

    for(let rr=0;rr<8;rr++) {

        for(let cc=0;cc<8;cc++) {

            const piece =
                board[rr][cc];

            if(!piece || piece[0] !== byColor) {
                continue;
            }

            const type = piece[1];

            if(type === "P") {

                const dir =
                    byColor==="w" ? -1 : 1;

                if(
                    rr+dir === r &&
                    Math.abs(cc-c) === 1
                ) {
                    return true;
                }

            } else {

                const moves =
                    getPseudoMoves(
                        rr,
                        cc,
                        board
                    );

                if(
                    moves.some(
                        m => m.r===r && m.c===c
                    )
                ) {
                    return true;
                }
            }
        }
    }

    return false;
}

function isInCheck(board,color) {

    const king =
        findKing(board,color);

    if(!king) return true;

    return squareAttacked(
        board,
        king.r,
        king.c,
        color==="w" ? "b" : "w"
    );
}

function getLegalMoves(r,c) {

    const piece =
        chessBoard[r][c];

    if(!piece || piece[0] !== chessTurn) {
        return [];
    }

    const pseudo =
        getPseudoMoves(r,c);

    return pseudo.filter(move => {

        const copy =
            cloneBoard(chessBoard);

        copy[move.r][move.c] =
            copy[r][c];

        copy[r][c] = null;

        if(
            copy[move.r][move.c][1] === "P" &&
            (move.r===0 || move.r===7)
        ) {
            copy[move.r][move.c] =
                chessTurn+"Q";
        }

        return !isInCheck(
            copy,
            chessTurn
        );
    });
}

function hasAnyLegalMove(color) {

    for(let r=0;r<8;r++) {

        for(let c=0;c<8;c++) {

            if(
                chessBoard[r][c] &&
                chessBoard[r][c][0] === color
            ) {

                if(
                    getLegalMovesForColor(
                        r,c,color
                    ).length
                ) {
                    return true;
                }
            }
        }
    }

    return false;
}

function getLegalMovesForColor(r,c,color) {

    const oldTurn = chessTurn;

    chessTurn = color;

    const result =
        getLegalMoves(r,c);

    chessTurn = oldTurn;

    return result;
}

function clickChessSquare(r,c) {

    const piece =
        chessBoard[r][c];

    if(chessSelected) {

        const moves =
            getLegalMoves(
                chessSelected.r,
                chessSelected.c
            );

        const valid =
            moves.find(
                m => m.r===r && m.c===c
            );

        if(valid) {

            makeChessMove(
                chessSelected.r,
                chessSelected.c,
                r,
                c
            );

            return;
        }

        if(
            piece &&
            piece[0] === chessTurn
        ) {

            chessSelected = {r,c};
            drawChess();
            return;
        }

        chessSelected = null;
        drawChess();
        return;
    }

    if(
        piece &&
        piece[0] === chessTurn
    ) {

        chessSelected = {r,c};
        drawChess();
    }
}

function makeChessMove(fr,fc,tr,tc) {

    const moving =
        chessBoard[fr][fc];

    const captured =
        chessBoard[tr][tc];

    if(captured) {

        chessCaptured[
            moving[0]
        ].push(captured[1]);
    }

    chessBoard[tr][tc] = moving;
    chessBoard[fr][fc] = null;

    if(
        moving[1] === "P" &&
        (tr===0 || tr===7)
    ) {

        chessBoard[tr][tc] =
            moving[0] + "Q";

        toast("👑 Pawn promoted to Queen!");
    }

    const from =
        String.fromCharCode(97+fc)+(8-fr);

    const to =
        String.fromCharCode(97+tc)+(8-tr);

    chessHistory.push(
        from + " → " + to
    );

    chessLastMove = {
        from:{r:fr,c:fc},
        to:{r:tr,c:tc}
    };

    chessTurn =
        chessTurn === "w" ? "b" : "w";

    chessSelected = null;

    if(
        isInCheck(
            chessBoard,
            chessTurn
        )
    ) {

        if(
            !hasAnyLegalMove(chessTurn)
        ) {

            drawChess();

            const winner =
                chessTurn==="w"
                    ? "Black"
                    : "White";

            toast(
                "♚ Checkmate! " +
                winner +
                " wins!"
            );

            if(winner==="White") {
                profile.wins++;
            } else {
                profile.losses++;
            }

            addXP(100);
            saveProfile();

            return;
        }

        toast("⚠️ Check!");
    } else if(
        !hasAnyLegalMove(chessTurn)
    ) {

        drawChess();
        toast("🤝 Stalemate!");
        return;
    }

    drawChess();
}

function resignChess() {

    const winner =
        chessTurn==="w"
            ? "Black"
            : "White";

    toast(
        "🏳️ " +
        winner +
        " wins by resignation."
    );

    profile.losses++;
    addXP(20);
    saveProfile();
}

/* =========================================================
   LOCAL DUEL
========================================================= */

let duelTarget = "";
let duelScores = {
    p1:0,
    p2:0
};

function renderDuel() {

    duelTarget =
        rushWords[
            Math.floor(Math.random()*rushWords.length)
        ];

    duelScores = {
        p1:0,
        p2:0
    };

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-panel">

                <h2>⚔️ Local Duel</h2>

                <p class="page-subtitle">
                    Two players use the same keyboard.
                </p>

                <div class="score-row">

                    <div class="score-box">
                        Player 1
                        <strong id="duelP1">0</strong>
                    </div>

                    <div class="score-box">
                        Player 2
                        <strong id="duelP2">0</strong>
                    </div>

                </div>

                <div
                    id="duelWord"
                    class="word-display">
                    ${duelTarget}
                </div>

                <input
                    id="duelInput"
                    class="game-input"
                    placeholder="Type the word..."
                    autocomplete="off"
                >

                <div class="game-actions">

                    <button
                        class="action-btn primary"
                        onclick="duelPoint(1)">
                        Player 1
                    </button>

                    <button
                        class="action-btn success"
                        onclick="duelPoint(2)">
                        Player 2
                    </button>

                    <button
                        class="action-btn"
                        onclick="renderDuel()">
                        Reset
                    </button>

                </div>

            </div>

        </div>
    `;
}

function duelPoint(player=1) {

    const input =
        document.getElementById("duelInput");

    const value =
        input.value.trim().toUpperCase();

    if(value !== duelTarget) {
        toast("Wrong word!");
        return;
    }

    duelScores[
        player===2 ? "p2":"p1"
    ]++;

    document.getElementById(
        player===2 ? "duelP2":"duelP1"
    ).textContent =
        duelScores[
            player===2 ? "p2":"p1"
        ];

    input.value = "";

    duelTarget =
        rushWords[
            Math.floor(Math.random()*rushWords.length)
        ];

    document.getElementById(
        "duelWord"
    ).textContent = duelTarget;
}

/* =========================================================
   ONLINE ROOM SYSTEM
========================================================= */

let peer = null;
let onlineConn = null;
let onlineRole = null;
let onlineRoom = "";
let onlineGame = "";
let onlineHostPeer = "";
let onlineReady = false;

function randomRoomCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
}

function getURLParams() {
    return new URLSearchParams(location.hash.replace(/^#/, ""));
}

function resetOnlineConnection() {
    onlineReady = false;
    onlineRole = null;
    onlineRoom = "";
    onlineGame = "";
    onlineHostPeer = "";

    if (onlineConn) {
        try { onlineConn.close(); } catch {}
    }
    onlineConn = null;

    if (peer) {
        try { peer.destroy(); } catch {}
    }
    peer = null;
}

function createPeer() {
    if (typeof Peer === "undefined") {
        toast("❌ PeerJS could not load. Check your internet connection.");
        return null;
    }

    return new Peer(undefined, {
        debug: 1,
        config: {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" }
            ]
        }
    });
}

function renderOnlineLobby(game) {
    newSession();
    resetOnlineConnection();

    document.getElementById("main").innerHTML = `
        <div class="online-box">
            <h2>${game === "word" ? "🌐 Online Word Battle" : "♟️ Online Chess"}</h2>

            <p class="page-subtitle">
                ${game === "word"
                    ? "Create a room and send the link to your friend."
                    : "Create a room and play real chess with correct turn rules."}
            </p>

            <div class="game-actions">
                <button class="action-btn primary"
                    onclick="createOnlineRoom('${game}')">
                    Create Room
                </button>

                <button class="action-btn"
                    onclick="joinOnlineRoom('${game}')">
                    Join Room
                </button>
            </div>

            <div id="onlineStatus"
                style="margin-top:20px;color:var(--muted)">
                No room connected.
            </div>

            <div id="onlineRoomArea"></div>
        </div>
    `;

    const params = getURLParams();
    const room = params.get("room");
    const host = params.get("host");
    const urlGame = params.get("game");

    if (room && host) {
        onlineRoom = room;
        onlineHostPeer = host;

        const session = gameSession;
        safeTimeout(() => {
            if (session === gameSession) {
                joinOnlineRoom(urlGame || game);
            }
        }, 350, session);
    }
}

function renderOnlineWord() {
    renderOnlineLobby("word");
}

function renderOnlineChess() {
    renderOnlineLobby("chess");
}

function createOnlineRoom(game) {
    if (typeof Peer === "undefined") {
        toast("❌ Online service unavailable.");
        return;
    }

    resetOnlineConnection();

    onlineGame = game;
    onlineRole = "host";
    onlineRoom = randomRoomCode();

    const status = document.getElementById("onlineStatus");
    if (status) status.textContent = "Creating secure room...";

    peer = createPeer();
    if (!peer) return;

    peer.on("open", id => {
        onlineHostPeer = id;

        const link =
            location.origin +
            location.pathname +
            "#room=" + encodeURIComponent(onlineRoom) +
            "&game=" + encodeURIComponent(game) +
            "&host=" + encodeURIComponent(id);

        const area = document.getElementById("onlineRoomArea");

        if (area) {
            area.innerHTML = `
                <div class="room-code">${onlineRoom}</div>

                <p style="text-align:center;color:var(--muted)">
                    Send this link to your friend:
                </p>

                <input
                    class="share-link"
                    value="${link.replace(/"/g, "&quot;")}"
                    readonly
                    onclick="this.select()"
                >

                <div class="game-actions">
                    <button class="action-btn primary"
                        onclick="copyRoomLink(${JSON.stringify(link)})">
                        Copy Link
                    </button>
                </div>

                <div id="hostWaiting"
                    style="text-align:center;margin-top:20px;color:var(--muted)">
                    ⏳ Waiting for your friend...
                </div>
            `;
        }

        if (status) {
            status.textContent = "🟢 Room ready. Keep this page open while your friend joins.";
        }
    });

    peer.on("connection", connection => {
        if (onlineConn && onlineConn.open) {
            try { connection.close(); } catch {}
            return;
        }

        onlineConn = connection;
        setupOnlineConnection(connection);
    });

    peer.on("error", handlePeerError);
}

function copyRoomLink(link) {
    navigator.clipboard.writeText(link).then(() => {
        toast("📋 Room link copied to clipboard!");
    }).catch(() => {
        toast("Failed to copy link automatically.");
    });
}

function joinOnlineRoom(game) {
    if (typeof Peer === "undefined") {
        toast("❌ Online service unavailable.");
        return;
    }

    const params = getURLParams();

    const room = onlineRoom || params.get("room");
    const host = onlineHostPeer || params.get("host");

    if (!room || !host) {
        toast("❌ Invalid room link. Ask the host to create a new link.");
        return;
    }

    resetOnlineConnection();

    onlineGame = game;
    onlineRole = "guest";
    onlineRoom = room;
    onlineHostPeer = host;

    const status = document.getElementById("onlineStatus");
    if (status) status.textContent = "🔄 Connecting to host...";

    peer = createPeer();
    if (!peer) return;

    let connectedOnce = false;

    peer.on("open", () => {
        if (connectedOnce) return;

        onlineConn = peer.connect(onlineHostPeer, {
            reliable: true,
            serialization: "json"
        });

        setupOnlineConnection(onlineConn);
    });

    peer.on("error", handlePeerError);
}

function setupOnlineConnection(connection) {
    if (!connection) return;

    connection.on("open", () => {
        onlineReady = true;

        const status = document.getElementById("onlineStatus");
        if (status) status.textContent = "🟢 Connected!";

        if (onlineRole === "guest") {
            sendOnline({
                type: "join",
                game: onlineGame,
                room: onlineRoom
            });
        }
    });

    connection.on("data", handleOnlineData);
    connection.on("close", () => {
        toast("❌ Connection lost.");
        onlineReady = false;
    });
}

function sendOnline(data) {
    if (onlineConn && onlineConn.open) {
        onlineConn.send(data);
    }
}

function handleOnlineData(data) {
    if (!data || !data.type) return;

    if (data.type === "join") {
        toast("👤 Player joined!");
    }
}

function handlePeerError(err) {
    toast("⚠️ Online error: " + (err.type || "Disconnected"));
}

   EXTRAS (SHOP, ACHIEVEMENTS, PROFILE)
========================================================= */

        <h1 class="page-title">🛒 Shop</h1>
        <p class="page-subtitle">Spend your hard-earned coins on cosmetics.</p>
        <div class="cards">
            <div class="shop-item">
                <h3>😎 Cool Avatar</h3>
                <p>Equip the sleek sunglasses avatar.</p>
                <button class="play-btn" onclick="buyAvatar('😎', 50)">Buy for 50 🪙</button>
            </div>
            <div class="shop-item">
                <h3>👑 Crown Avatar</h3>
                <p>Show everyone you're the king of games.</p>
                <button class="play-btn" onclick="buyAvatar('👑', 150)">Buy for 150 🪙</button>
            </div>
            <div class="shop-item">
                <h3>🚀 Rocket Avatar</h3>
                <p>Blast past your opponents!</p>
                <button class="play-btn" onclick="buyAvatar('🚀', 100)">Buy for 100 🪙</button>
            </div>
        </div>
    `;
}

function buyAvatar(icon, cost) {
    if (profile.coins < cost) {
        toast("❌ Not enough coins!");
        return;
    }
    addCoins(-cost);
    profile.avatar = icon;
    saveProfile();
    toast("🎉 Avatar updated!");
}

function renderAchievements() {
    document.getElementById("main").innerHTML = `
        <h1 class="page-title">🏅 Achievements</h1>
        <p class="page-subtitle">Track your milestones and feats.</p>
        <div class="cards">
            <div class="shop-item">
                <h3>🎯 First Win</h3>
                <p>${profile.wins > 0 ? "✅ Unlocked!" : "🔒 Win 1 game in any mode."}</p>
            </div>
            <div class="shop-item">
                <h3>💰 Coin Collector</h3>
                <p>${profile.coins >= 200 ? "✅ Unlocked!" : "🔒 Accumulate 200 total coins."}</p>
            </div>
            <div class="shop-item">
                <h3>⭐ Master Level</h3>
                <p>${profile.level >= 5 ? "✅ Unlocked!" : "🔒 Reach Level 5."}</p>
            </div>
        </div>
    `;
}

function renderProfile() {
    document.getElementById("main").innerHTML = `
        <div class="profile-card">
            <div class="avatar">${profile.avatar}</div>
            <div class="profile-name">${profile.username}</div>
            <p style="text-align:center;color:var(--muted);margin-bottom:20px;">Level ${profile.level} Challenger</p>

            <div style="margin-bottom:8px;font-size:14px;font-weight:bold;">
                Level Progress (${profile.xp % 500} / 500 XP)
            </div>
            <div class="progress">
                <div class="progress-fill" style="width: ${(profile.xp % 500) / 5}%"></div>
            </div>

            <div class="score-row">
                <div class="score-box">Wins<strong>${profile.wins}</strong></div>
                <div class="score-box">Losses<strong>${profile.losses}</strong></div>
                <div class="score-box">Coins<strong>${profile.coins}</strong></div>
                <div class="score-box">Total XP<strong>${profile.xp}</strong></div>
            </div>
        </div>
    `;
}
