<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Word Games Arena — Online</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070b16;
    --panel:#10182b;
    --panel2:#151f36;
    --panel3:#1c2742;
    --text:#f5f7ff;
    --muted:#8d99b5;
    --primary:#6c63ff;
    --primary2:#8b5cf6;
    --secondary:#00d4ff;
    --success:#20e38b;
    --danger:#ff4d6d;
    --warning:#ffc857;
    --border:rgba(255,255,255,.09);
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

body.light{
    --bg:#eef2ff;
    --panel:#fff;
    --panel2:#f4f6ff;
    --panel3:#e9edff;
    --text:#171a2b;
    --muted:#667085;
    --border:rgba(20,30,60,.1);
    --shadow:0 20px 50px rgba(30,40,80,.15);
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 10%,rgba(108,99,255,.18),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(0,212,255,.12),transparent 25%),
        var(--bg);
    color:var(--text);
    font-family:Inter,Segoe UI,Arial,sans-serif;
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

.hidden{
    display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-box{
    width:min(500px,100%);
    padding:40px;
    border-radius:30px;
    background:rgba(16,24,43,.92);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    backdrop-filter:blur(20px);
    text-align:center;
    animation:rise .6s ease;
}

body.light .login-box{
    background:rgba(255,255,255,.94);
}

.logo{
    font-size:70px;
    line-height:1;
    font-weight:1000;
    letter-spacing:-5px;
    background:linear-gradient(90deg,#6c63ff,#00d4ff,#ff4fa3);
    background-clip:text;
    color:transparent;
}

.login-box h1{
    margin-top:12px;
}

.login-subtitle{
    color:var(--muted);
    margin:10px 0 25px;
}

.input{
    width:100%;
    padding:14px 16px;
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--panel2);
    color:var(--text);
    outline:none;
}

.input:focus{
    border-color:var(--primary);
}

.avatar-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin:12px 0 22px;
}

.avatar{
    height:52px;
    border:2px solid transparent;
    border-radius:13px;
    background:var(--panel2);
    font-size:25px;
}

.avatar.selected{
    border-color:var(--secondary);
    box-shadow:0 0 18px rgba(0,212,255,.3);
}

.primary-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
    font-weight:900;
    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.login-note{
    margin-top:14px;
    color:var(--muted);
    font-size:12px;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    height:74px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(7,11,22,.75);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

body.light .topbar{
    background:rgba(255,255,255,.8);
}

.brand{
    font-size:21px;
    font-weight:1000;
}

.brand span{
    color:var(--secondary);
}

.top-actions{
    display:flex;
    align-items:center;
    gap:9px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    color:var(--text);
}

.user-mini{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:13px;
}

.mini-avatar{
    font-size:21px;
}

/* =========================
   MAIN
========================= */

.main{
    width:min(1250px,94%);
    margin:30px auto 70px;
}

.page{
    animation:fade .25s ease;
}

/* =========================
   HERO
========================= */

.hero{
    padding:35px;
    border:1px solid var(--border);
    border-radius:28px;
    background:
        radial-gradient(circle at 90% 10%,rgba(0,212,255,.15),transparent 25%),
        radial-gradient(circle at 10% 90%,rgba(108,99,255,.18),transparent 25%),
        var(--panel);
}

.hero h1{
    font-size:clamp(30px,5vw,55px);
}

.hero p{
    color:var(--muted);
    margin-top:7px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-top:25px;
}

.stat{
    padding:18px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:17px;
}

.stat-icon{
    font-size:24px;
}

.stat-label{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

.stat-value{
    font-size:21px;
    font-weight:900;
    margin-top:3px;
}

/* =========================
   GAME CARDS
========================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:30px 0 15px;
}

.section-title h2{
    font-size:25px;
}

.game-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.game-card{
    min-height:205px;
    padding:25px;
    position:relative;
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:22px;
    transition:.25s;
}

.game-card:hover{
    transform:translateY(-6px);
    border-color:rgba(108,99,255,.55);
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.game-icon{
    font-size:45px;
    margin-bottom:14px;
}

.game-card h3{
    font-size:21px;
    margin-bottom:7px;
}

.game-card p{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
}

.play-btn{
    margin-top:15px;
    padding:10px 16px;
    border:0;
    border-radius:10px;
    background:var(--primary);
    color:white;
    font-weight:900;
}

.online-btn{
    background:linear-gradient(135deg,#00a8ff,#00d4ff);
}

/* =========================
   GAME PANEL
========================= */

.game-panel{
    max-width:900px;
    margin:auto;
    padding:28px;
    border:1px solid var(--border);
    border-radius:28px;
    background:var(--panel);
    box-shadow:var(--shadow);
}

.back-btn{
    padding:10px 15px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--panel2);
    color:var(--text);
}

.game-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin:20px 0;
}

.game-header h1{
    font-size:30px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.badge{
    padding:8px 12px;
    border-radius:10px;
    background:var(--panel2);
    color:var(--muted);
    font-size:13px;
}

.hint-box{
    padding:14px;
    margin:15px 0;
    border-radius:13px;
    background:rgba(255,200,87,.08);
    color:var(--warning);
}

/* =========================
   HANGMAN
========================= */

.hangman-art{
    min-height:170px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:90px;
}

.word{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:25px 0;
}

.letter{
    width:43px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:4px solid var(--primary);
    font-size:28px;
    font-weight:900;
}

.keyboard{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    gap:7px;
}

.key{
    min-height:43px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:var(--text);
    font-weight:800;
}

.key:hover:not(:disabled){
    background:var(--primary);
    color:white;
}

.key:disabled{
    opacity:.35;
}

/* =========================
   SCRAMBLE
========================= */

.scramble-word{
    padding:35px 10px;
    text-align:center;
    font-size:clamp(35px,8vw,65px);
    letter-spacing:8px;
    font-weight:1000;
}

.answer-row{
    display:flex;
    gap:10px;
}

.answer-row .input{
    margin:0;
}

/* =========================
   TRIVIA
========================= */

.question{
    font-size:23px;
    font-weight:800;
    line-height:1.4;
    margin:25px 0;
}

.answers{
    display:grid;
    gap:10px;
}

.answer{
    padding:16px;
    text-align:left;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--panel2);
    color:var(--text);
}

.answer.correct{
    border-color:var(--success);
    background:rgba(32,227,139,.12);
}

.answer.wrong{
    border-color:var(--danger);
    background:rgba(255,77,109,.12);
}

/* =========================
   WORD MASTER
========================= */

.master-grid{
    display:grid;
    grid-template-columns:repeat(5,55px);
    gap:7px;
    justify-content:center;
    margin:25px 0;
}

.tile{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--border);
    border-radius:8px;
    font-size:25px;
    font-weight:900;
}

.tile.correct{
    background:#159447;
    border-color:#159447;
}

.tile.present{
    background:#a27610;
    border-color:#a27610;
}

.tile.absent{
    background:#394052;
    border-color:#394052;
}

/* =========================
   CHESS
========================= */

.chess-wrap{
    max-width:620px;
    margin:auto;
}

.chess-board{
    width:min(620px,100%);
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    border:6px solid var(--panel3);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.square{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(27px,7vw,52px);
    user-select:none;
}

.square.light-square{
    background:#f0d9b5;
}

.square.dark-square{
    background:#b58863;
}

.square.selected-square{
    box-shadow:inset 0 0 0 5px #00d4ff;
}

.square.legal-square::after{
    content:"";
    width:24%;
    height:24%;
    border-radius:50%;
    background:rgba(0,0,0,.28);
    position:absolute;
}

.square.capture-square{
    box-shadow:inset 0 0 0 5px rgba(255,70,100,.75);
}

.chess-status{
    text-align:center;
    margin:15px 0;
    font-weight:800;
}

.chess-controls{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:15px;
    flex-wrap:wrap;
}

.chess-controls button{
    padding:10px 15px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:10px;
}

/* =========================
   ONLINE
========================= */

.online-box{
    padding:20px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--panel2);
    margin-top:15px;
}

.online-code{
    padding:15px;
    margin:12px 0;
    border-radius:12px;
    background:var(--panel3);
    font-size:22px;
    font-weight:1000;
    text-align:center;
    letter-spacing:2px;
}

.connection{
    display:flex;
    align-items:center;
    gap:8px;
    margin:10px 0;
    font-size:13px;
    color:var(--muted);
}

.online-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--danger);
}

.online-dot.connected{
    background:var(--success);
    box-shadow:0 0 12px var(--success);
}

.share-link{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    margin-top:8px;
}

/* =========================
   PROFILE
========================= */

.profile-card{
    max-width:750px;
    margin:auto;
    padding:30px;
    border-radius:25px;
    background:var(--panel);
    border:1px solid var(--border);
}

.profile-head{
    display:flex;
    align-items:center;
    gap:20px;
}

.big-avatar{
    width:90px;
    height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:25px;
    background:var(--panel2);
    font-size:50px;
}

.rank{
    color:var(--secondary);
    font-weight:900;
    margin-top:4px;
}

.xp-bar{
    height:12px;
    margin-top:20px;
    border-radius:20px;
    overflow:hidden;
    background:var(--panel2);
}

.xp-fill{
    height:100%;
    background:linear-gradient(90deg,var(--primary),var(--secondary));
    transition:.5s;
}

.profile-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:25px;
}

/* =========================
   SHOP
========================= */

.shop-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:20px;
}

.shop-item{
    padding:20px;
    text-align:center;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--panel);
}

.shop-icon{
    font-size:42px;
}

.shop-item button{
    margin-top:12px;
    padding:9px 13px;
    border:0;
    border-radius:9px;
    background:var(--primary);
    color:white;
}

/* =========================
   ACHIEVEMENTS
========================= */

.achievement-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.achievement{
    padding:20px;
    border:1px solid var(--border);
    border-radius:17px;
    background:var(--panel);
}

.achievement.locked{
    opacity:.4;
}

.achievement-icon{
    font-size:35px;
}

/* =========================
   TOAST
========================= */

#toastContainer{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:1000;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.toast{
    max-width:350px;
    padding:14px 18px;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--panel);
    box-shadow:var(--shadow);
    animation:slideIn .3s ease;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .game-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .shop-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .topbar{
        padding:0 12px;
    }

    .brand{
        font-size:16px;
    }

    .user-mini{
        display:none;
    }

    .main{
        width:94%;
    }

    .hero{
        padding:23px;
    }

    .game-grid,
    .achievement-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .keyboard{
        grid-template-columns:repeat(7,1fr);
    }

    .answer-row{
        flex-direction:column;
    }

    .master-grid{
        grid-template-columns:repeat(5,48px);
    }

    .tile{
        width:48px;
        height:48px;
    }

    .profile-grid{
        grid-template-columns:1fr;
    }

    .login-box{
        padding:25px;
    }
}

@keyframes rise{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fade{
    from{opacity:0}
    to{opacity:1}
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateX(30px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

<div class="login-box">

<div class="logo">WGA</div>

<h1>Word Games Arena</h1>

<p class="login-subtitle">
Create your player profile and enter the arena.
</p>

<input
id="usernameInput"
class="input"
maxlength="18"
placeholder="Enter your username"
autocomplete="off">

<input
id="pinInput"
class="input"
type="password"
maxlength="8"
placeholder="Create a PIN"
autocomplete="off">

<p style="text-align:left;color:var(--muted);font-size:13px">
Choose your avatar
</p>

<div id="avatarGrid" class="avatar-grid"></div>

<button class="primary-btn" onclick="login()">
🚀 ENTER THE ARENA
</button>

<p class="login-note">
Your profile is saved locally on this browser.
</p>

</div>

</section>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

<header class="topbar">

<div class="brand">
WORD <span>GAMES</span> ARENA
</div>

<b id="miniName">Player</b>
</div>

</div>

</header>

<main id="main" class="main"></main>

</div>

<div id="toastContainer"></div>

},

let profile=null;

/*
   Every time a new game starts this number changes.
   Old timers become invalid.
*/
let gameSession=0;

const timers=new Set();

function newSession(){

    gameSession++;

    stopAllTimers();

    return gameSession;
}

function safeTimer(callback,delay,session){

    const id=setTimeout(()=>{

        timers.delete(id);

        if(session!==gameSession)return;

        callback();

    },delay);

    timers.add(id);

    return id;
}

function safeInterval(callback,delay,session){

    const id=setInterval(()=>{

        if(session!==gameSession){

            clearInterval(id);
            timers.delete(id);
            return;
        }

        callback();

    },delay);

    timers.add(id);

    return id;
}

function stopAllTimers(){

    timers.forEach(id=>{
        clearTimeout(id);
        clearInterval(id);
    });

    timers.clear();
}

hangman.score+=20;

hangman.lives--;

hangman.word
.split("")
.every(x=>hangman.guessed.includes(x));

profile.wins++;
profile.totalGames++;
profile.streak++;

profile.bestStreak=
Math.max(profile.bestStreak,profile.streak);

profile.hangmanBest=
Math.max(profile.hangmanBest,hangman.score);

toast("🏆 YOU WON! +60 XP");

safeTimer(()=>{

},900,s);

profile.losses++;
profile.totalGames++;
profile.streak=0;

save();

toast(`💥 The word was ${hangman.word}`);

const s=gameSession;

safeTimer(()=>{
renderHangman();
},1200,s);

return;

}

drawHangman();

}

   WORD MASTER
========================================================= */

let master={};

function renderMaster(){

master={
word:
masterWords[
Math.floor(Math.random()*masterWords.length)
],
guesses:[],
max:6,
session:gameSession
};

drawMaster();

}

function drawMaster(){

if(master.session!==gameSession)return;

const rows=[];

for(let r=0;r<master.max;r++){

const guess=master.guesses[r]||"";

let row="";

for(let i=0;i<5;i++){

const letter=guess[i]||"";

let cls="";

if(letter){

if(master.word[i]===letter){
cls="correct";
}else if(master.word.includes(letter)){
cls="present";
}else{
cls="absent";
}

}

row+=`

<div class="tile ${cls}">
${letter}
</div>

`;

}

rows.push(row);

}

gameShell("🟩 Word Master",`

<div class="game-info">

<span class="badge">
Attempts: ${master.guesses.length}/${master.max}
</span>

</div>

<div class="master-grid">
${rows.join("")}
</div>

<input
id="masterInput"
class="input"
maxlength="5"
placeholder="5-letter word"
onkeydown="if(event.key==='Enter')submitMaster()">

class="play-btn"
onclick="submitMaster()">

</button>

</div>

<p style="text-align:center;color:var(--muted);margin-top:15px">

🟨 Wrong position &nbsp;
⬛ Not included
</p>

`);

const input=document.getElementById("masterInput");

if(input)input.focus();

}

function submitMaster(){

if(master.session!==gameSession)return;

const input=document.getElementById("masterInput");

if(!input)return;

const guess=input.value
.trim()
.toUpperCase();

if(guess.length!==5){

toast("⚠️ Enter exactly 5 letters.");

return;

}

master.guesses.push(guess);

if(guess===master.word){

profile.wins++;
profile.totalGames++;
profile.streak++;

const score=
Math.max(
100,
600-master.guesses.length*80
);

profile.masterBest=
Math.max(
profile.masterBest,
score
);

reward(80,40);

achievement("master");

toast(`🟩 PERFECT! +${score}`);

const s=gameSession;

safeTimer(()=>{
renderMaster();
},1300,s);

return;

}

if(master.guesses.length>=master.max){

profile.losses++;
profile.totalGames++;
profile.streak=0;

save();

toast(`The word was ${master.word}`);

const s=gameSession;

safeTimer(()=>{
renderMaster();
},1300,s);

return;

}

drawMaster();

}

const chessPieces={

function initialChessBoard(){

return[

],
[
{c:"b",t:"p"},

{c:"b",t:"p"},

],

],

],
[

],
[

],

{c:"w",t:"p"},

{c:"w",t:"p"},
{c:"w",t:"p"},
{c:"w",t:"p"},
{c:"w",t:"p"}
],
[
{c:"w",t:"r"},
{c:"w",t:"n"},
{c:"w",t:"b"},
{c:"w",t:"q"},
{c:"w",t:"k"},
{c:"w",t:"b"},
{c:"w",t:"n"},
{c:"w",t:"r"}
]
];

}

function renderChess(){

chess={

};

}

function drawChess(){

if(chess.session!==gameSession)return;

let html="";

for(let r=0;r<8;r++){

for(let c=0;c<8;c++){

const piece=chess.board[r][c];

const selected=
chess.selected &&
chess.selected.r===r &&
chess.selected.c===c;

const legal=
chess.selected &&
isChessLegal(
chess.selected.r,
chess.selected.c,
r,
c
);

const cls=[
(r+c)%2===0?"light-square":"dark-square",
selected?"selected-square":"",
legal?"legal-square":"",
piece &&
chess.selected &&
legal &&
piece.c!==chess.board[chess.selected.r][chess.selected.c]?.c
?"capture-square":""
].join(" ");

html+=`

}

function clickChessSquare(r,c){

if(chess.over)return;

const piece=chess.board[r][c];

if(!chess.selected){

if(piece && piece.c===chess.turn){

chess.selected={r,c};

drawChess();

}

return;

}

const sr=chess.selected.r;
const sc=chess.selected.c;

if(sr===r&&sc===c){

chess.selected=null;

drawChess();

return;

}

if(piece && piece.c===chess.turn){

chess.selected={r,c};

drawChess();

return;

}

if(
isChessLegal(sr,sc,r,c)
){

moveChess(sr,sc,r,c);

}

}

function insideBoard(r,c){

return r>=0&&r<8&&c>=0&&c<8;

}

function clearPath(sr,sc,tr,tc){

const dr=Math.sign(tr-sr);
const dc=Math.sign(tc-sc);

let r=sr+dr;
let c=sc+dc;

while(r!==tr||c!==tc){

if(chess.board[r][c])return false;

r+=dr;
c+=dc;

}

return true;

}

function isChessLegal(sr,sc,tr,tc){

if(!insideBoard(sr,sc)||!insideBoard(tr,tc)){
return false;
}

const piece=chess.board[sr][sc];

if(!piece)return false;

if(piece.c!==chess.turn)return false;

const target=chess.board[tr][tc];

if(target&&target.c===piece.c)return false;

const dr=tr-sr;
const dc=tc-sc;

const adr=Math.abs(dr);
const adc=Math.abs(dc);

if(piece.t==="p"){

const direction=piece.c==="w"?-1:1;

const start=piece.c==="w"?6:1;

if(
dc===0 &&
dr===direction &&
!target
)return true;

if(
dc===0 &&
sr===start &&
dr===direction*2 &&
!target &&
!chess.board[sr+direction][sc]
)return true;

if(
adc===1 &&
dr===direction &&
target &&
target.c!==piece.c
)return true;

return false;

}

if(piece.t==="n"){

return(
adr===2&&adc===1
||
adr===1&&adc===2
);

}

if(piece.t==="k"){

return adr<=1&&adc<=1;

}

if(piece.t==="r"){

if(dr!==0&&dc!==0)return false;

return clearPath(sr,sc,tr,tc);

}

if(piece.t==="b"){

if(adr!==adc)return false;

return clearPath(sr,sc,tr,tc);

}

if(piece.t==="q"){

if(
dr!==0&&
dc!==0&&
adr!==adc
)return false;

return clearPath(sr,sc,tr,tc);

}

return false;

}

function moveChess(sr,sc,tr,tc){

const piece=chess.board[sr][sc];

const captured=chess.board[tr][tc];

chess.board[tr][tc]=piece;

chess.board[sr][sc]=null;

/*
   Automatic pawn promotion to queen.
*/

if(
piece.t==="p" &&
(tr===0||tr===7)
){

piece.t="q";

toast("👑 Pawn promoted to Queen!");

}

chess.turn=
chess.turn==="w"?"b":"w";

chess.selected=null;

sound(captured?350:550,70);

drawChess();

}

function isChessLegalOnline(board,sr,sc,tr,tc){

if(
!insideBoard(sr,sc)||
!insideBoard(tr,tc)
)return false;

const piece=board[sr][sc];

if(!piece)return false;

const myColor=
online.role==="host"?"w":"b";

if(piece.c!==myColor)return false;

const target=board[tr][tc];

if(target&&target.c===piece.c)return false;

const dr=tr-sr;
const dc=tc-sc;

const adr=Math.abs(dr);
const adc=Math.abs(dc);

if(piece.t==="p"){

const direction=
piece.c==="w"?-1:1;

const start=
piece.c==="w"?6:1;

if(
dc===0&&
dr===direction&&
!target
)return true;

if(
dc===0&&
sr===start&&
dr===direction*2&&
!target&&
!board[sr+direction][sc]
)return true;

if(
adc===1&&
dr===direction&&
target&&
target.c!==piece.c
)return true;

return false;

}

if(piece.t==="n"){

return(
adr===2&&adc===1||
adr===1&&adc===2
);

}

if(piece.t==="k"){

return adr<=1&&adc<=1;

}

function path(){

const stepR=Math.sign(dr);
const stepC=Math.sign(dc);

let r=sr+stepR;
let c=sc+stepC;

while(r!==tr||c!==tc){

if(board[r][c])return false;

r+=stepR;
c+=stepC;

}

return true;

}

if(piece.t==="r"){

if(dr!==0&&dc!==0)return false;

return path();

}

if(piece.t==="b"){

if(adr!==adc)return false;

return path();

}

if(piece.t==="q"){

if(
dr!==0&&
dc!==0&&
adr!==adc
)return false;

return path();

}

return false;

}

</span>

const input=
document.getElementById("onlineWordInput");

if(input)input.focus();

}

function submitOnlineWord(){

if(!online.word)return;

const input=
document.getElementById("onlineWordInput");

if(!input)return;

const answer=
input.value.trim().toUpperCase();

if(answer!==online.word.word){

toast("❌ Wrong!");

input.value="";

return;

}

sendOnline({
type:"onlineWordCorrect",
player:online.role
});

input.value="";

toast("⚡ Correct!");

}

function startOnlineWordTimer(){

const session=gameSession;

safeInterval(()=>{

if(!online.word)return;

online.word.time--;

const time=online.word.time;

if(time<=0){

finishOnlineWordRound();

}

drawOnlineWord();

},1000,session);

}

function finishOnlineWordRound(){

if(!online.word)return;

if(online.word.round>=5){

finishOnlineWord();

return;

}

const next=
scrambleWords[
Math.floor(Math.random()*scrambleWords.length)
];

online.word.word=next;
online.word.round++;
online.word.time=30;

sendOnline({
type:"onlineWordNext",
word:next,
round:online.word.round,
time:30
});

}

function handleOnlineWordCorrect(player){

if(!online.word)return;

if(player==="host"){

online.word.hostScore++;

}else{

online.word.guestScore++;

}

const score=
online.role==="host"
?online.word.hostScore
:online.word.guestScore;

if(score>=5){

sendOnline({
type:"onlineWordWinner",
winner:player
});

finishOnlineWord(player);

return;

}

const next=
scrambleWords[
Math.floor(Math.random()*scrambleWords.length)
];

online.word.word=next;
online.word.round++;
online.word.time=30;

sendOnline({
type:"onlineWordNext",
word:next,
round:online.word.round,
time:30
});

drawOnlineWord();

}

function finishOnlineWord(winner){

stopAllTimers();

const myColor=
online.role==="host"
?"host"
:"guest";

let message="🏁 Battle finished!";

if(winner){

if(winner===myColor){

message="🏆 YOU WIN!";

profile.wins++;

reward(100,50);

}else{

message="💥 YOU LOST!";

profile.losses++;

profile.streak=0;

save();

}

}

gameShell("⚔️ Online Battle Complete",`

<div style="text-align:center;padding:40px">

<div style="font-size:70px">
${winner===myColor?"🏆":"⚔️"}
</div>

<h2 style="font-size:32px">
${message}
</h2>

<p style="color:var(--muted);margin-top:10px">
Final score:
${online.word?.hostScore||0}
-
${online.word?.guestScore||0}
</p>

<button
class="primary-btn"
style="max-width:280px;margin-top:25px"
onclick="renderHome()">
🏠 RETURN TO ARENA
</button>

</div>

`);

}


/* =========================================================
   ONLINE MESSAGE ROUTER
========================================================= */

function handleOnlineData(data){

if(!data||!data.type)return;

if(data.type==="hello"){

toast(
`👋 ${data.username} joined!`
);

return;

}

if(data.type==="onlineChessStart"){

online.gameStarted=true;

online.chess={
board:data.board,
turn:data.turn,
myColor:"b",
selected:null,
over:false
};

drawOnlineChess();

return;

}

if(data.type==="onlineChessMove"){

handleOnlineChessMove(data);

return;

}

if(data.type==="onlineWordStart"){

startOnlineWordGuest(data);

return;

}

if(data.type==="onlineWordCorrect"){

handleOnlineWordCorrect(data.player);

return;

}

if(data.type==="onlineWordNext"){

if(!online.word)return;

online.word.word=data.word;
online.word.round=data.round;
online.word.time=data.time;

drawOnlineWord();

return;

}

if(data.type==="onlineWordWinner"){

finishOnlineWord(data.winner);

return;

}

if(data.type==="rematch"){

if(online.mode==="chess"){

online.chess={
board:initialChessBoard(),
turn:"w",
selected:null,
over:false
};

if(online.role==="host"){

sendOnline({
type:"onlineChessStart",
board:online.chess.board,
turn:"w",
yourColor:"b"
});

}

drawOnlineChess();

}else{

if(online.role==="host"){
startOnlineWordHost();
}

}

return;

}

}

function sendRematchRequest(){

if(!connection||!connection.open){

toast("❌ Not connected.");

return;

}

sendOnline({
type:"rematch"
});

if(online.mode==="chess"){

online.chess={
board:initialChessBoard(),
turn:"w",
selected:null,
over:false
};

if(online.role==="host"){

sendOnline({
type:"onlineChessStart",
board:online.chess.board,
turn:"w",
yourColor:"b"
});

}

drawOnlineChess();

}else{

if(online.role==="host"){

startOnlineWordHost();

}else{

toast("🔄 Rematch requested.");

}

}

}

function playDaily(){

const today=
new Date().toISOString().slice(0,10);

const index=
[...today].reduce(
(sum,char)=>sum+char.charCodeAt(0),
0
)%words.length;

const challenge=words[index];

const answer=prompt(
`🎯 DAILY CHALLENGE\n\nHint: ${challenge.hint}\n\nEnter the word:`
);

if(!answer)return;

if(
answer.trim().toUpperCase()===
challenge.word
){

profile.dailyDate=today;
profile.dailyCompleted=true;

profile.wins++;
profile.totalGames++;
profile.streak++;

reward(150,100);

achievement("daily");

toast("🌟 Daily Challenge Complete!");

}else{

profile.dailyDate=today;
profile.dailyCompleted=false;

profile.losses++;
profile.streak=0;

save();

toast(
`❌ Answer was ${challenge.word}`
);

}

renderDaily();

}

profile.unlockedAvatars

function toggleTheme(){

document.body.classList.toggle("light");

localStorage.setItem(
"WGA_THEME",

?"light"
:"dark"
);

){

}

}


/* =========================================================
   SOUND
========================================================= */

let audioContext=null;

function sound(freq=500,duration=80){

if(!soundEnabled)return;

try{

if(!audioContext){

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.frequency.value=freq;
oscillator.type="sine";

gain.gain.setValueAtTime(
.05,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
audioContext.currentTime+
duration/1000
);

oscillator.connect(gain);
gain.connect(audioContext.destination);

oscillator.start();

oscillator.stop(
audioContext.currentTime+
duration/1000
);

}catch(e){}

}

function toggleSound(){

soundEnabled=!soundEnabled;

toast(
soundEnabled
?"🔊 Sound ON"
:"🔇 Sound OFF"
);

}

)

cleanupPeer();

localStorage.removeItem(STORAGE_KEY);

location.reload();

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

const container=
document.getElementById("toastContainer");

if(!container)return;

const element=
document.createElement("div");

element.className="toast";

element.textContent=message;

container.appendChild(element);

setTimeout(()=>{
element.remove();
},2500);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================================
   CLONE CHESS BOARD
========================================================= */

function cloneBoard(board){

return board.map(row=>
row.map(piece=>
piece
?{c:piece.c,t:piece.t}
:null
)
);

}
