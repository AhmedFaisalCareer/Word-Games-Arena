<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Games Arena</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #07111f;
    --panel: #0d1b2d;
    --panel2: #12243a;
    --text: #f4f7fb;
    --muted: #91a4bb;
    --primary: #6c63ff;
    --secondary: #00d4ff;
    --success: #23d18b;
    --danger: #ff5577;
    --warning: #ffca3a;
    --border: rgba(255,255,255,.1);
}

body.light {
    --bg: #edf2f7;
    --panel: #ffffff;
    --panel2: #e9eef5;
    --text: #152033;
    --muted: #64748b;
    --border: rgba(0,0,0,.1);
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(108,99,255,.2), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,212,255,.12), transparent 35%),
        var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    transition: .25s;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-card {
    width: min(430px, 100%);
    background: rgba(13,27,45,.95);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 25px 80px rgba(0,0,0,.35);
    text-align: center;
}

body.light .login-card {
    background: white;
}

.logo {
    width: 85px;
    height: 85px;
    margin: auto auto 18px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    font-size: 45px;
    box-shadow: 0 15px 35px rgba(108,99,255,.3);
}

.login-card h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.login-card p {
    color: var(--muted);
    margin-bottom: 25px;
}

.login-input {
    width: 100%;
    padding: 15px;
    margin: 7px 0;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.primary-btn {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    color: white;
    font-weight: bold;
    background: linear-gradient(135deg, var(--primary), #8f6cff);
    margin-top: 12px;
    transition: .2s;
}

.primary-btn:hover {
    transform: translateY(-2px);
}

.login-hint {
    font-size: 12px;
    margin-top: 18px;
    color: var(--muted);
}

/* APP */

#app {
    min-height: 100vh;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: rgba(7,17,31,.88);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
}

body.light .topbar {
    background: rgba(255,255,255,.88);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: bold;
}

.brand-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.top-stats {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.stat-pill {
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--panel2);
    color: var(--text);
    font-size: 13px;
}

.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: var(--panel2);
    color: var(--text);
}

.layout {
    display: flex;
    min-height: calc(100vh - 71px);
}

.sidebar {
    width: 245px;
    flex-shrink: 0;
    padding: 18px;
    border-right: 1px solid var(--border);
    background: rgba(0,0,0,.08);
}

.nav-title {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 17px 10px 7px;
}

.nav-btn {
    width: 100%;
    padding: 12px;
    margin: 3px 0;
    border-radius: 11px;
    text-align: left;
    color: var(--muted);
    background: transparent;
}

.nav-btn:hover,
.nav-btn.active {
    background: var(--panel2);
    color: var(--text);
}

.main {
    flex: 1;
    padding: 28px;
    max-width: 1500px;
    margin: auto;
    width: 100%;
}

.page-title {
    font-size: clamp(26px,4vw,42px);
    margin-bottom: 8px;
}

.page-subtitle {
    color: var(--muted);
    margin-bottom: 25px;
}

/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 16px;
}

.game-card {
    padding: 23px;
    min-height: 175px;
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    transition: .2s;
}

.game-card:hover {
    transform: translateY(-4px);
    border-color: rgba(108,99,255,.5);
}

.game-icon {
    font-size: 36px;
    margin-bottom: 14px;
}

.game-card h3 {
    margin-bottom: 7px;
}

.game-card p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 17px;
}

.play-btn {
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    font-weight: bold;
}

/* GAME */

.game-container {
    max-width: 850px;
    margin: auto;
}

.game-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 25px;
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.timer {
    padding: 10px 15px;
    border-radius: 12px;
    background: var(--panel2);
    font-weight: bold;
}

.word-display {
    text-align: center;
    font-size: clamp(30px,7vw,65px);
    letter-spacing: 8px;
    font-weight: bold;
    margin: 30px 0;
}

.game-input {
    display: block;
    width: 100%;
    padding: 17px;
    border: 2px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 14px;
    outline: none;
    text-align: center;
    font-size: 20px;
}

.game-input:focus {
    border-color: var(--primary);
}

.game-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.action-btn {
    padding: 12px 18px;
    border-radius: 11px;
    background: var(--panel2);
    color: var(--text);
}

.action-btn.primary {
    background: var(--primary);
    color: white;
}

.action-btn.danger {
    background: var(--danger);
    color: white;
}

.action-btn.success {
    background: var(--success);
    color: #03140e;
}

.score-row {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
    margin: 20px 0;
}

.score-box {
    text-align: center;
    padding: 14px;
    background: var(--panel2);
    border-radius: 13px;
}

.score-box strong {
    display: block;
    font-size: 22px;
    margin-top: 5px;
}

/* TRIVIA */

.question-box {
    padding: 20px;
    border-radius: 15px;
    background: var(--panel2);
    margin-bottom: 18px;
}

.question-number {
    color: var(--secondary);
    font-weight: bold;
    margin-bottom: 10px;
}

.question-text {
    font-size: 21px;
    line-height: 1.45;
}

.trivia-option {
    width: 100%;
    padding: 15px;
    text-align: left;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    margin: 6px 0;
}

.trivia-option:hover {
    border-color: var(--primary);
}

.trivia-option.correct {
    background: rgba(35,209,139,.2);
    border-color: var(--success);
}

.trivia-option.wrong {
    background: rgba(255,85,119,.2);
    border-color: var(--danger);
}

/* CHESS */

.chess-layout {
    display: grid;
    grid-template-columns: minmax(300px,620px) 250px;
    gap: 20px;
    justify-content: center;
    align-items: start;
}

.chess-board {
    width: min(92vw,620px);
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(8,1fr);
    grid-template-rows: repeat(8,1fr);
    border: 5px solid #151c29;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
}

.chess-square {
    min-width: 0;
    min-height: 0;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
}

.chess-square.light-square {
    background: #e9d5ad;
}

.chess-square.dark-square {
    background: #8b5e3c;
}

.chess-square.selected {
    box-shadow: inset 0 0 0 5px #ffd43b;
}

.chess-square.last-move {
    box-shadow: inset 0 0 0 5px rgba(0,212,255,.55);
}

.chess-square.legal::after {
    content: "";
    width: 24%;
    height: 24%;
    border-radius: 50%;
    background: rgba(30,30,30,.4);
    position: absolute;
}

.chess-square.capture::after {
    content: "";
    width: 78%;
    height: 78%;
    border: 5px solid rgba(255,80,100,.65);
    border-radius: 50%;
    position: absolute;
}

.chess-piece {
    position: relative;
    z-index: 2;
    font-family:
        "Noto Sans Symbols 2",
        "Segoe UI Symbol",
        "Arial Unicode MS",
        sans-serif;
    font-size: clamp(28px,6.5vw,58px);
    line-height: 1;
    user-select: none;
    filter: drop-shadow(1px 3px 2px rgba(0,0,0,.5));
}

.white-piece {
    color: #ffffff;
    text-shadow:
        0 0 1px #111,
        1px 1px 2px #111,
        -1px -1px 1px #111;
}

.black-piece {
    color: #111827;
    text-shadow: 0 1px 1px rgba(255,255,255,.3);
}

.chess-side {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
}

.turn-box {
    padding: 13px;
    border-radius: 11px;
    background: var(--panel2);
    margin-bottom: 15px;
    text-align: center;
    font-weight: bold;
}

.captured {
    min-height: 40px;
    padding: 8px;
    background: var(--panel2);
    border-radius: 10px;
    margin: 8px 0 15px;
    font-size: 22px;
    word-break: break-word;
}

.move-history {
    height: 250px;
    overflow-y: auto;
    background: var(--panel2);
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
}

.move-item {
    padding: 5px;
    border-bottom: 1px solid var(--border);
}

/* ONLINE */

.online-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    max-width: 700px;
    margin: auto;
}

.room-code {
    font-size: 32px;
    letter-spacing: 5px;
    font-weight: bold;
    text-align: center;
    padding: 20px;
    background: var(--panel2);
    border-radius: 15px;
    margin: 20px 0;
}

.share-link {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
}

/* PROFILE */

.profile-card {
    max-width: 650px;
    margin: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 30px;
}

.avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;
    margin: auto auto 15px;
}

.profile-name {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
}

.progress {
    height: 10px;
    border-radius: 10px;
    background: var(--panel2);
    overflow: hidden;
    margin: 10px 0 20px;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg,var(--primary),var(--secondary));
}

/* SHOP */

.shop-item {
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 17px;
}

.shop-item p {
    color: var(--muted);
    margin: 7px 0 15px;
}

/* TOAST */

#toast {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 9999;
    max-width: 350px;
    padding: 14px 18px;
    background: #111827;
    color: white;
    border-radius: 13px;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
    transform: translateY(120px);
    opacity: 0;
    transition: .25s;
}

#toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* MOBILE */

@media(max-width:850px) {
    .sidebar {
        width: 75px;
        padding: 10px;
    }

    .nav-btn {
        text-align: center;
        font-size: 0;
    }

    .nav-btn:first-letter {
        font-size: 20px;
    }

    .nav-title {
        display: none;
    }

    .main {
        padding: 18px;
    }

    .chess-layout {
        grid-template-columns: 1fr;
    }

    .chess-side {
        width: min(92vw,620px);
        margin: auto;
    }
}

@media(max-width:550px) {
    .topbar {
        padding: 10px;
    }

    .brand span {
        display: none;
    }

    .top-stats .stat-pill {
        display: none;
    }

    .score-row {
        grid-template-columns: repeat(2,1fr);
    }

    .game-panel {
        padding: 15px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">
    <div class="login-card">
        <div class="logo">🎮</div>

        <h1>Word Games Arena</h1>
        <p>Play. Think. Compete. Improve.</p>

        <input
            id="usernameInput"
            class="login-input"
            type="text"
            placeholder="Username"
            autocomplete="off"
        >

        <input
            id="pinInput"
            class="login-input"
            type="password"
            placeholder="PIN"
            autocomplete="off"
        >

        <button class="primary-btn" onclick="login()">
            Enter Arena
        </button>

        <div class="login-hint">
            Login ID: Ahmed &nbsp; | &nbsp; PIN: 123456
        </div>
    </div>
</section>

<!-- APP -->

<section id="app" class="hidden">

    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">🎮</div>
            <span>Word Games Arena</span>
        </div>

        <div class="top-stats">
            <div class="stat-pill">⭐ XP: <b id="xpTop">0</b></div>
            <div class="stat-pill">🪙 <b id="coinsTop">100</b></div>
            <div class="stat-pill">🏆 <b id="winsTop">0</b></div>
            <button class="icon-btn" onclick="toggleTheme()">🌙</button>
        </div>

    </header>

    <div class="layout">

        <aside class="sidebar">

            <div class="nav-title">Main</div>

            <button class="nav-btn active" onclick="showPage('home',this)">
                🏠 Home
            </button>

            <button class="nav-btn" onclick="showPage('games',this)">
                🎮 Games
            </button>

            <div class="nav-title">Offline Games</div>

            <button class="nav-btn" onclick="startGame('hangman',this)">
                🎯 Hangman
            </button>

            <button class="nav-btn" onclick="startGame('rush',this)">
                ⌨️ Letter Rush
            </button>

            <button class="nav-btn" onclick="startGame('scramble',this)">
                🔀 Scramble
            </button>

            <button class="nav-btn" onclick="startGame('master',this)">
                🧠 Word Master
            </button>

            <button class="nav-btn" onclick="startGame('trivia',this)">
                ❓ Trivia Blitz
            </button>

            <button class="nav-btn" onclick="startGame('chess',this)">
                ♟️ Chess
            </button>

            <div class="nav-title">Multiplayer</div>

            <button class="nav-btn" onclick="startGame('duel',this)">
                ⚔️ Local Duel
            </button>

            <div class="nav-title">Online</div>

            <button class="nav-btn" onclick="startGame('onlineWord',this)">
                🌐 Word Battle
            </button>

            <button class="nav-btn" onclick="startGame('onlineChess',this)">
                ♟️ Online Chess
            </button>

            <div class="nav-title">Extras</div>

            <button class="nav-btn" onclick="showPage('shop',this)">
                🛒 Shop
            </button>

            <button class="nav-btn" onclick="showPage('achievements',this)">
                🏅 Achievements
            </button>

            <button class="nav-btn" onclick="showPage('profile',this)">
                👤 Profile
            </button>

            <button class="nav-btn" onclick="logout()">
                🚪 Logout
            </button>

        </aside>

        <main id="main" class="main"></main>

    </div>
</section>

<div id="toast"></div>

<script>

/* =========================================================
   PROFILE / LOGIN
========================================================= */

const LOGIN_ID = "Ahmed";
const LOGIN_PASSWORD = "123456";
const STORAGE_KEY = "wordGamesArenaProfile";

let profile = null;

function defaultProfile() {
    return {
        username: LOGIN_ID,
        pin: LOGIN_PASSWORD,
        avatar: "😎",
        xp: 0,
        coins: 100,
        wins: 0,
        losses: 0,
        streak: 0,
        best: 0,
        level: 1,
        achievements: [],
        theme: "dark"
    };
}

function saveProfile() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
}

function login() {

    const username =
        document.getElementById("usernameInput").value.trim();

    const pin =
        document.getElementById("pinInput").value.trim();

    if (
        username.toLowerCase() !== LOGIN_ID.toLowerCase() ||
        pin !== LOGIN_PASSWORD
    ) {
        toast("❌ Incorrect ID or password.");
        return;
    }

    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
        try {
            profile = JSON.parse(saved);
        } catch {
            profile = defaultProfile();
        }
    } else {
        profile = defaultProfile();
        saveProfile();
    }

    profile.username = LOGIN_ID;
    profile.pin = LOGIN_PASSWORD;

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    if (profile.theme === "light") {
        document.body.classList.add("light");
    }

    updateTop();
    renderHome();
}

function logout() {
    stopAllTimers();
    document.getElementById("app").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
}

function updateTop() {

    if (!profile) return;

    document.getElementById("xpTop").textContent = profile.xp;
    document.getElementById("coinsTop").textContent = profile.coins;
    document.getElementById("winsTop").textContent = profile.wins;
}

function addXP(amount) {

    profile.xp += amount;

    const newLevel =
        Math.floor(profile.xp / 500) + 1;

    if (newLevel > profile.level) {
        profile.level = newLevel;
        toast("🎉 Level Up! Level " + profile.level);
    }

    saveProfile();
    updateTop();
}

function addCoins(amount) {

    profile.coins = Math.max(
        0,
        profile.coins + amount
    );

    saveProfile();
    updateTop();
}

function toggleTheme() {

    document.body.classList.toggle("light");

    profile.theme =
        document.body.classList.contains("light")
            ? "light"
            : "dark";

    saveProfile();
}

/* =========================================================
   NAVIGATION + TIMER SYSTEM
========================================================= */

let gameSession = 0;
const timers = new Set();

function newSession() {

    gameSession++;

    stopAllTimers();

    return gameSession;
}

function safeTimeout(callback, delay, session) {

    const id = setTimeout(() => {

        timers.delete(id);

        if (session !== gameSession) return;

        callback();

    }, delay);

    timers.add(id);

    return id;
}

function safeInterval(callback, delay, session) {

    const id = setInterval(() => {

        if (session !== gameSession) {

            clearInterval(id);
            timers.delete(id);
            return;
        }

        callback();

    }, delay);

    timers.add(id);

    return id;
}

function stopAllTimers() {

    timers.forEach(id => {

        clearTimeout(id);
        clearInterval(id);

    });

    timers.clear();
}

function showPage(page, button) {

    newSession();

    document
        .querySelectorAll(".nav-btn")
        .forEach(b => b.classList.remove("active"));

    if (button) button.classList.add("active");

    if (page === "home") renderHome();
    if (page === "games") renderGames();
    if (page === "shop") renderShop();
    if (page === "achievements") renderAchievements();
    if (page === "profile") renderProfile();
}

function startGame(game, button) {

    newSession();

    document
        .querySelectorAll(".nav-btn")
        .forEach(b => b.classList.remove("active"));

    if (button) button.classList.add("active");

    if (game === "hangman") renderHangman();
    if (game === "rush") renderRush();
    if (game === "scramble") renderScramble();
    if (game === "master") renderMaster();
    if (game === "trivia") renderTrivia();
    if (game === "chess") renderChess();
    if (game === "duel") renderDuel();
    if (game === "onlineWord") renderOnlineWord();
    if (game === "onlineChess") renderOnlineChess();
}

/* =========================================================
   HANGMAN
========================================================= */

let hangWord = "";
let hangGuessed = [];
let hangLives = 6;

function renderHangman() {

    hangWord =
        scrambleWords[
            Math.floor(Math.random()*scrambleWords.length)
        ];

    hangGuessed = [];
    hangLives = 6;

    drawHangman();
}

function drawHangman() {

    const display =
        hangWord
        .split("")
        .map(letter =>
            hangGuessed.includes(letter)
                ? letter
                : "_"
        )
        .join(" ");

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-panel">

                <div class="game-header">
                    <div>
                        <h2>🎯 Hangman</h2>
                        <p class="page-subtitle">
                            Guess the hidden word.
                        </p>
                    </div>

                    <div class="timer">
                        ❤️ ${hangLives}
                    </div>
                </div>

                <div class="word-display">
                    ${display}
                </div>

                <input
                    id="hangInput"
                    class="game-input"
                    maxlength="1"
                    placeholder="Type one letter"
                    autocomplete="off"
                >

                <div class="game-actions">

                    <button
                        class="action-btn primary"
                        onclick="hangGuess()">
                        Guess
                    </button>

                    <button
                        class="action-btn"
                        onclick="renderHangman()">
                        New Word
                    </button>

                </div>

            </div>

        </div>
    `;

    document
        .getElementById("hangInput")
        .focus();
}

function hangGuess() {

    const input =
        document.getElementById("hangInput");

    const letter =
        input.value.toUpperCase();

    input.value = "";

    if (!/^[A-Z]$/.test(letter)) return;

    if (hangGuessed.includes(letter)) {
        toast("Already guessed!");
        return;
    }

    hangGuessed.push(letter);

    if (!hangWord.includes(letter)) {
        hangLives--;
    }

    const won =
        hangWord
        .split("")
        .every(l => hangGuessed.includes(l));

    if (won) {

        profile.wins++;
        addXP(50);
        addCoins(20);

        toast("🎉 You won!");

        safeTimeout(
            () => renderHangman(),
            1200,
            gameSession
        );

        drawHangman();
        return;
    }

    if (hangLives <= 0) {

        toast("💀 Word was " + hangWord);

        profile.losses++;
        saveProfile();

        safeTimeout(
            () => renderHangman(),
            1600,
            gameSession
        );

        drawHangman();
        return;
    }

    drawHangman();
}

   LETTER RUSH

========================================================= */

let rushWord = "";
let rushScore = 0;
let rushTime = 30;
let rushSession = 0;

function renderRush() {

    rushSession = newSession();

    rushScore = 0;
    rushTime = 30;

    newRushWord();

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-panel">

                <div class="game-header">

                    <div>
                        <h2>⌨️ Letter Rush</h2>
                        <p class="page-subtitle">
                            Type the words as quickly as possible.
                        </p>
                    </div>

                    <div class="timer">
                        ⏱ <span id="rushTimer">30</span>s
                    </div>

                </div>

                <div class="score-row">

                    <div class="score-box">
                        Score
                        <strong id="rushScore">0</strong>
                    </div>

                    <div class="score-box">
                        Time
                        <strong id="rushTimeBox">30</strong>
                    </div>

                    <div class="score-box">
                        Words
                        <strong id="rushWordsDone">0</strong>
                    </div>

                    <div class="score-box">
                        XP
                        <strong>+</strong>
                    </div>

                </div>

                <div
                    id="rushWord"
                    class="word-display">
                    ${rushWord}
                </div>

                <input
                    id="rushInput"
                    class="game-input"
                    type="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    placeholder="Type the word here..."
                >

                <div class="game-actions">

                    <button
                        class="action-btn primary"
                        onclick="startRushAgain()">
                        Restart
                    </button>

                </div>

            </div>

        </div>
    `;

    const input =
        document.getElementById("rushInput");

    input.focus();

    input.addEventListener("input", rushInputHandler);

    safeInterval(() => {

        rushTime--;

        const timer =
            document.getElementById("rushTimer");

        const timeBox =
            document.getElementById("rushTimeBox");

        if (timer) timer.textContent = rushTime;
        if (timeBox) timeBox.textContent = rushTime;

        if (rushTime <= 0) {
            endRush();
        }

    },1000,rushSession);
}

function newRushWord() {

    rushWord =
        rushWords[
            Math.floor(Math.random()*rushWords.length)
        ];
}

function rushInputHandler(event) {

    const value =
        event.target.value
        .trim()
        .toUpperCase();

    if (value === rushWord) {

        rushScore += 10;

        const score =
            document.getElementById("rushScore");

        const words =
            document.getElementById("rushWordsDone");

        if (score) score.textContent = rushScore;

        if (words) {
            words.textContent =
                Number(words.textContent) + 1;
        }

        event.target.value = "";

        newRushWord();

        const word =
            document.getElementById("rushWord");

        if (word) word.textContent = rushWord;

        addCoins(1);
    }
}

function endRush() {

    stopAllTimers();

    addXP(rushScore);

    if (rushScore > profile.best) {
        profile.best = rushScore;
    }

    saveProfile();

    toast("⏱ Time up! Score: " + rushScore);

    const input =
        document.getElementById("rushInput");

    if (input) input.disabled = true;
}

function startRushAgain() {

    newSession();
    renderRush();
}

/* =========================================================
   WORD SCRAMBLE
   IMPORTANT: TIMER DOES NOT RECREATE INPUT
========================================================= */

let scrambleWord = "";
let scrambleAnswer = "";
let scrambleScore = 0;
let scrambleTime = 45;
let scrambleSession = 0;

function shuffleWord(word) {

    const arr = word.split("");

    for (let i = arr.length-1; i>0; i--) {

        const j =
            Math.floor(Math.random()*(i+1));

        [arr[i],arr[j]] =
            [arr[j],arr[i]];
    }

    return arr.join("");
}

function renderScramble() {

    scrambleSession = newSession();

    scrambleScore = 0;
    scrambleTime = 45;

    newScrambleWord();

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-panel">

                <div class="game-header">

                    <div>
                        <h2>🔀 Word Scramble</h2>
                        <p class="page-subtitle">
                            Unscramble the letters.
                        </p>
                    </div>

                    <div class="timer">
                        ⏱ <span id="scrambleTimer">45</span>s
                    </div>

                </div>

                <div class="score-row">

                    <div class="score-box">
                        Score
                        <strong id="scrambleScore">0</strong>
                    </div>

                    <div class="score-box">
                        Time
                        <strong id="scrambleTime">45</strong>
                    </div>

                    <div class="score-box">
                        Solved
                        <strong id="scrambleSolved">0</strong>
                    </div>

                    <div class="score-box">
                        Bonus
                        <strong>+10</strong>
                    </div>

                </div>

                <div
                    id="scrambleDisplay"
                    class="word-display">
                    ${scrambleWord}
                </div>

                <input
                    id="scrambleInput"
                    class="game-input"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Type the original word..."
                >

                <div class="game-actions">

                    <button
                        class="action-btn primary"
                        onclick="checkScramble()">
                        Submit
                    </button>

                    <button
                        class="action-btn"
                        onclick="startScrambleAgain()">
                        Restart
                    </button>

                </div>

            </div>

        </div>
    `;

    const input =
        document.getElementById("scrambleInput");

    input.focus();

    input.addEventListener("keydown", e => {

        if (e.key === "Enter") {
            checkScramble();
        }

    });

    safeInterval(() => {

        scrambleTime--;

        const timer =
            document.getElementById("scrambleTimer");

        const time =
            document.getElementById("scrambleTime");

        if (timer) timer.textContent = scrambleTime;
        if (time) time.textContent = scrambleTime;

        if (scrambleTime <= 0) {
            endScramble();
        }

    },1000,scrambleSession);
}

function newScrambleWord() {

    scrambleAnswer =
        scrambleWords[
            Math.floor(Math.random()*scrambleWords.length)
        ];

    scrambleWord =
        shuffleWord(scrambleAnswer);

    if (scrambleWord === scrambleAnswer) {
        scrambleWord =
            shuffleWord(scrambleAnswer);
    }
}

function checkScramble() {

    const input =
        document.getElementById("scrambleInput");

    if (!input) return;

    const value =
        input.value.trim().toUpperCase();

    if (value === scrambleAnswer) {

        scrambleScore += 10;

        const score =
            document.getElementById("scrambleScore");

        const solved =
            document.getElementById("scrambleSolved");

        if (score) score.textContent = scrambleScore;

        if (solved) {
            solved.textContent =
                Number(solved.textContent) + 1;
        }

        input.value = "";

        newScrambleWord();

        const display =
            document.getElementById("scrambleDisplay");

        if (display) {
            display.textContent = scrambleWord;
        }

        addCoins(2);

        toast("✅ Correct!");

    } else {

        toast("❌ Try again!");
    }
}

function endScramble() {

    stopAllTimers();

/* =========================================================
   WORD MASTER
========================================================= */

let masterTarget = "";
let masterAttempts = 0;
let masterBoard = [];

function renderMaster() {

    newMasterWord();

    masterAttempts = 0;
    masterBoard = [];

    drawMaster();
}

function newMasterWord() {

    masterTarget =
        masterWords[
            Math.floor(Math.random()*masterWords.length)
        ];
}

function drawMaster() {

    let rows = "";

    for (let i=0;i<6;i++) {

        const word =
            masterBoard[i] || "";

        let cells = "";

        for (let j=0;j<5;j++) {

            const letter =
                word[j] || "";

            let cls = "";

            if (letter) {

                if (letter === masterTarget[j]) {
                    cls = "correct";
                } else if (masterTarget.includes(letter)) {
                    cls = "present";
                } else {
                    cls = "absent";
                }
            }

            cells += `
                <span style="
                    display:flex;
                    width:55px;
                    height:55px;
                    align-items:center;
                    justify-content:center;
                    border:2px solid var(--border);
                    border-radius:9px;
                    background:
                        ${
                            cls==="correct"
                            ? "rgba(35,209,139,.35)"
                            : cls==="present"
                            ? "rgba(255,202,58,.35)"
                            : cls==="absent"
                            ? "rgba(255,85,119,.25)"
                            : "var(--panel2)"
                        };
                    font-size:24px;
                    font-weight:bold;
                ">
                    ${letter}
                </span>
            `;
        }

        rows += `
            <div style="
                display:flex;
                justify-content:center;
                gap:7px;
                margin:7px;
            ">
                ${cells}
            </div>
        `;
    }

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-panel">

                <div class="game-header">

                    <div>
                        <h2>🧠 Word Master</h2>
                        <p class="page-subtitle">
                            Find the hidden five-letter word.
                        </p>
                    </div>

                    <div class="timer">
                        Attempts: ${masterAttempts}/6
                    </div>

                </div>

                ${rows}

                <input
                    id="masterInput"
                    class="game-input"
                    maxlength="5"
                    placeholder="Enter 5 letters"
                    autocomplete="off"
                    style="margin-top:20px"
                >

                <div class="game-actions">

                    <button
                        class="action-btn primary"
                        onclick="submitMaster()">
                        Guess
                    </button>

                    <button
                        class="action-btn"
                        onclick="renderMaster()">
                        New Word
                    </button>

                </div>

            </div>

        </div>
    `;

    document
        .getElementById("masterInput")
        .focus();
}

function submitMaster() {

    const input =
        document.getElementById("masterInput");

    const word =
        input.value.trim().toUpperCase();

    if (word.length !== 5) {
        toast("Enter exactly 5 letters.");
        return;
    }

    masterBoard.push(word);
    masterAttempts++;

    if (word === masterTarget) {

        addXP(80);
        addCoins(25);
        profile.wins++;
        saveProfile();

        drawMaster();

        toast("🏆 Word Master solved!");

        safeTimeout(
            () => renderMaster(),
            1400,
            gameSession
        );

        return;
    }

    if (masterAttempts >= 6) {

        drawMaster();

        toast("The word was " + masterTarget);

        safeTimeout(
            () => renderMaster(),
            1800,
            gameSession
        );

        return;
    }

    input.value = "";

    drawMaster();
}

let triviaIndex = 0;
let triviaScore = 0;
let triviaOrder = [];

function renderTrivia() {

    triviaIndex = 0;
    triviaScore = 0;

    triviaOrder =
        [...trivia]
        .sort(() => Math.random()-.5)
        .slice(0,20);

    drawTrivia();
}

function drawTrivia() {

    if (triviaIndex >= triviaOrder.length) {

        addXP(triviaScore * 5);
        addCoins(Math.floor(triviaScore/2));

        document.getElementById("main").innerHTML = `

            <div class="game-container">

                <div class="game-panel" style="text-align:center">

                    <div style="font-size:60px">
                        🏆
                    </div>

                    <h2>Trivia Complete!</h2>

                    <p class="page-subtitle">
                        You scored ${triviaScore}/${triviaOrder.length}
                    </p>

                    <button
                        class="action-btn primary"
                        onclick="renderTrivia()">
                        Play Again
                    </button>

                </div>

            </div>
        `;

        return;
    }

    const item =
        triviaOrder[triviaIndex];

    const shuffled =
        [...item.c]
        .sort(() => Math.random()-.5);

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-panel">

                <div class="game-header">

                    <div>
                        <h2>❓ Trivia Blitz</h2>
                        <p class="page-subtitle">
                            Question ${triviaIndex+1}
                            of ${triviaOrder.length}
                        </p>
                    </div>

                    <div class="timer">
                        Score: ${triviaScore}
                    </div>

                </div>

                <div class="question-box">

                    <div class="question-number">
                        QUESTION ${triviaIndex+1}
                    </div>

                    <div class="question-text">
                        ${item.q}
                    </div>

                </div>

                <div id="triviaOptions">

                    ${shuffled.map(option => `

                        <button
                            class="trivia-option"
                            onclick="answerTrivia(this, '${escapeJS(option)}')">
                            ${option}
                        </button>

                    `).join("")}

                </div>

            </div>

        </div>
    `;
}

function escapeJS(text) {

    return text
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

function answerTrivia(button, answer) {

    const item =
        triviaOrder[triviaIndex];

    document
        .querySelectorAll(".trivia-option")
        .forEach(b => b.disabled = true);

    if (answer === item.a) {

        button.classList.add("correct");

        triviaScore++;

        addCoins(1);

        toast("✅ Correct!");

    } else {

        button.classList.add("wrong");

        document
            .querySelectorAll(".trivia-option")
            .forEach(b => {

                if (b.textContent.trim() === item.a) {
                    b.classList.add("correct");
                }

            });

        toast("❌ Correct answer: " + item.a);
    }

    safeTimeout(() => {

        triviaIndex++;
        drawTrivia();

    },900,gameSession);
}

/* =========================================================
   CHESS
========================================================= */

const chessSymbols = {

    wK:"♔",
    wQ:"♕",
    wR:"♖",
    wB:"♗",
    wN:"♘",
    wP:"♙",

    bK:"♚",
    bQ:"♛",
    bR:"♜",
    bB:"♝",
    bN:"♞",
    bP:"♟"
};

let chessBoard = [];
let chessTurn = "w";
let chessSelected = null;
let chessLastMove = null;
let chessHistory = [];
let chessCaptured = {
    w:[],
    b:[]
};

function createChessBoard() {

    return [

        ["bR","bN","bB","bQ","bK","bB","bN","bR"],
        ["bP","bP","bP","bP","bP","bP","bP","bP"],

        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],

        ["wP","wP","wP","wP","wP","wP","wP","wP"],
        ["wR","wN","wB","wQ","wK","wB","wN","wR"]
    ];
}

function renderChess() {

    chessBoard = createChessBoard();
    chessTurn = "w";
    chessSelected = null;
    chessLastMove = null;
    chessHistory = [];
    chessCaptured = {w:[],b:[]};

    drawChess();
}

function drawChess() {

    let boardHTML = "";

    const legal =
        chessSelected
            ? getLegalMoves(
                chessSelected.r,
                chessSelected.c
            )
            : [];

    for (let r=0;r<8;r++) {

        for (let c=0;c<8;c++) {

            const piece =
                chessBoard[r][c];

            const isSelected =
                chessSelected &&
                chessSelected.r === r &&
                chessSelected.c === c;

            const isLegal =
                legal.some(
                    x => x.r === r && x.c === c
                );

            const isCapture =
                isLegal && piece !== null;

            const isLast =
                chessLastMove &&
                (
                    (
                        chessLastMove.from.r === r &&
                        chessLastMove.from.c === c
                    ) ||
                    (
                        chessLastMove.to.r === r &&
                        chessLastMove.to.c === c
                    )
                );

            const squareClass =
                ((r+c)%2===0
                    ? "light-square"
                    : "dark-square");

            boardHTML += `

                <div
                    class="
                        chess-square
                        ${squareClass}
                        ${isSelected ? "selected":""}
                        ${isLast ? "last-move":""}
                        ${isCapture ? "capture":""}
                        ${isLegal && !isCapture ? "legal":""}
                    "
                    onclick="clickChessSquare(${r},${c})"
                >

                    ${
                        piece
                        ? `
                            <span class="
                                chess-piece
                                ${
                                    piece[0] === "w"
                                    ? "white-piece"
                                    : "black-piece"
                                }
                            ">
                                ${chessSymbols[piece]}
                            </span>
                        `
                        : ""
                    }

                </div>
            `;
        }
    }

    const turnText =
        chessTurn === "w"
            ? "White's turn"
            : "Black's turn";

    const capturedWhite =
        chessCaptured.w
        .map(p => chessSymbols["b"+p])
        .join("");

    const capturedBlack =
        chessCaptured.b
        .map(p => chessSymbols["w"+p])
        .join("");

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <h2 style="margin-bottom:15px">
                ♟️ Chess Arena
            </h2>

            <div class="chess-layout">

                <div>

                    <div class="chess-board">
                        ${boardHTML}
                    </div>

                </div>

                <div class="chess-side">

                    <div class="turn-box">
                        ${turnText}
                    </div>

                    <b>Captured White</b>

                    <div class="captured">
                        ${capturedWhite || "—"}
                    </div>

                    <b>Captured Black</b>

                    <div class="captured">
                        ${capturedBlack || "—"}
                    </div>

                    <h3 style="margin:15px 0 8px">
                        Move History
                    </h3>

                    <div class="move-history">

                        ${
                            chessHistory.length
                            ? chessHistory
                                .map(
                                    (m,i) =>
                                    `<div class="move-item">
                                        ${i+1}. ${m}
                                    </div>`
                                )
                                .join("")
                            : "No moves yet."
                        }

                    </div>

                    <div class="game-actions">

                        <button
                            class="action-btn primary"
                            onclick="renderChess()">
                            New Game
                        </button>

                        <button
                            class="action-btn danger"
                            onclick="resignChess()">
                            Resign
                        </button>

                    </div>

                </div>

            </div>

        </div>
    `;
}

function inside(r,c) {
    return r>=0 && r<8 && c>=0 && c<8;
}

function pieceColor(piece) {
    return piece ? piece[0] : null;
}

function getPseudoMoves(r,c,board=chessBoard) {

    const piece = board[r][c];

    if (!piece) return [];

    const color = piece[0];
    const type = piece[1];

    const moves = [];

    const add = (nr,nc) => {

        if (!inside(nr,nc)) return;

        const target = board[nr][nc];

        if (!target || target[0] !== color) {
            moves.push({r:nr,c:nc});
        }
    };

    if (type === "P") {

        const dir =
            color === "w" ? -1 : 1;

        const start =
            color === "w" ? 6 : 1;

        if (
            inside(r+dir,c) &&
            !board[r+dir][c]
        ) {

            moves.push({
                r:r+dir,
                c:c
            });

            if (
                r === start &&
                !board[r+2*dir][c]
            ) {
                moves.push({
                    r:r+2*dir,
                    c:c
                });
            }
        }

        for (const dc of [-1,1]) {

            const nr = r+dir;
            const nc = c+dc;

            if (
                inside(nr,nc) &&
                board[nr][nc] &&
                board[nr][nc][0] !== color
            ) {
                moves.push({r:nr,c:nc});
            }
        }
    }

    if (type === "N") {

        [
            [-2,-1],[-2,1],
            [-1,-2],[-1,2],
            [1,-2],[1,2],
            [2,-1],[2,1]
        ].forEach(([dr,dc]) => {
            add(r+dr,c+dc);
        });
    }

    if (type === "K") {

        for(let dr=-1;dr<=1;dr++) {
            for(let dc=-1;dc<=1;dc++) {

                if(dr || dc) {
                    add(r+dr,c+dc);
                }
            }
        }
    }

    const slide = directions => {

        for (const [dr,dc] of directions) {

            let nr = r+dr;
            let nc = c+dc;

            while(inside(nr,nc)) {

                const target = board[nr][nc];

                if (!target) {

                    moves.push({
                        r:nr,
                        c:nc
                    });

                } else {

                    if(target[0] !== color) {
                        moves.push({
                            r:nr,
                            c:nc
                        });
                    }

                    break;
                }

                nr += dr;
                nc += dc;
            }
        }
    };

    if(type==="B" || type==="Q") {

        slide([
            [-1,-1],[-1,1],
            [1,-1],[1,1]
        ]);
    }

    if(type==="R" || type==="Q") {

        slide([
            [-1,0],[1,0],
            [0,-1],[0,1]
        ]);
    }

    return moves;
}

function cloneBoard(board) {
    return board.map(row => [...row]);
}

function findKing(board,color) {

    for(let r=0;r<8;r++) {

        for(let c=0;c<8;c++) {

            if(board[r][c] === color+"K") {
                return {r,c};
            }
        }
    }

    return null;
}

function squareAttacked(board,r,c,byColor) {

    for(let rr=0;rr<8;rr++) {

        for(let cc=0;cc<8;cc++) {

            const piece =
                board[rr][cc];

            if(!piece || piece[0] !== byColor) {
                continue;
            }

            const type = piece[1];

            if(type === "P") {

                const dir =
                    byColor==="w" ? -1 : 1;

                if(
                    rr+dir === r &&
                    Math.abs(cc-c) === 1
                ) {
                    return true;
                }

            } else {

                const moves =
                    getPseudoMoves(
                        rr,
                        cc,
                        board
                    );

                if(
                    moves.some(
                        m => m.r===r && m.c===c
                    )
                ) {
                    return true;
                }
            }
        }
    }

    return false;
}

function isInCheck(board,color) {

    const king =
        findKing(board,color);

    if(!king) return true;

    return squareAttacked(
        board,
        king.r,
        king.c,
        color==="w" ? "b" : "w"
    );
}

function getLegalMoves(r,c) {

    const piece =
        chessBoard[r][c];

    if(!piece || piece[0] !== chessTurn) {
        return [];
    }

    const pseudo =
        getPseudoMoves(r,c);

    return pseudo.filter(move => {

        const copy =
            cloneBoard(chessBoard);

        copy[move.r][move.c] =
            copy[r][c];

        copy[r][c] = null;

        /* Promotion for legality testing */

        if(
            copy[move.r][move.c][1] === "P" &&
            (move.r===0 || move.r===7)
        ) {
            copy[move.r][move.c] =
                chessTurn+"Q";
        }

        return !isInCheck(
            copy,
            chessTurn
        );
    });
}

function hasAnyLegalMove(color) {

    for(let r=0;r<8;r++) {

        for(let c=0;c<8;c++) {

            if(
                chessBoard[r][c] &&
                chessBoard[r][c][0] === color
            ) {

                if(
                    getLegalMovesForColor(
                        r,c,color
                    ).length
                ) {
                    return true;
                }
            }
        }
    }

    return false;
}

function getLegalMovesForColor(r,c,color) {

    const oldTurn = chessTurn;

    chessTurn = color;

    const result =
        getLegalMoves(r,c);

    chessTurn = oldTurn;

    return result;
}

function clickChessSquare(r,c) {

    const piece =
        chessBoard[r][c];

    if(chessSelected) {

        const moves =
            getLegalMoves(
                chessSelected.r,
                chessSelected.c
            );

        const valid =
            moves.find(
                m => m.r===r && m.c===c
            );

        if(valid) {

            makeChessMove(
                chessSelected.r,
                chessSelected.c,
                r,
                c
            );

            return;
        }

        if(
            piece &&
            piece[0] === chessTurn
        ) {

            chessSelected = {r,c};
            drawChess();
            return;
        }

        chessSelected = null;
        drawChess();
        return;
    }

    if(
        piece &&
        piece[0] === chessTurn
    ) {

        chessSelected = {r,c};
        drawChess();
    }
}

function makeChessMove(fr,fc,tr,tc) {

    const moving =
        chessBoard[fr][fc];

    const captured =
        chessBoard[tr][tc];

    if(captured) {

        chessCaptured[
            moving[0]
        ].push(captured[1]);
    }

    chessBoard[tr][tc] = moving;
    chessBoard[fr][fc] = null;

    /* Pawn promotion */

    if(
        moving[1] === "P" &&
        (tr===0 || tr===7)
    ) {

        chessBoard[tr][tc] =
            moving[0] + "Q";

        toast("👑 Pawn promoted to Queen!");
    }

    const from =
        String.fromCharCode(97+fc)+(8-fr);

    const to =
        String.fromCharCode(97+tc)+(8-tr);

    chessHistory.push(
        from + " → " + to
    );

    chessLastMove = {
        from:{r:fr,c:fc},
        to:{r:tr,c:tc}
    };

    chessTurn =
        chessTurn === "w" ? "b" : "w";

    chessSelected = null;

    if(
        isInCheck(
            chessBoard,
            chessTurn
        )
    ) {

        if(
            !hasAnyLegalMove(chessTurn)
        ) {

            drawChess();

            const winner =
                chessTurn==="w"
                    ? "Black"
                    : "White";

            toast(
                "♚ Checkmate! " +
                winner +
                " wins!"
            );

            if(winner==="White") {
                profile.wins++;
            } else {
                profile.losses++;
            }

            addXP(100);
            saveProfile();

            return;
        }

        toast("⚠️ Check!");
    } else if(
        !hasAnyLegalMove(chessTurn)
    ) {

        drawChess();
        toast("🤝 Stalemate!");
        return;
    }

    drawChess();
}

function resignChess() {

    const winner =
        chessTurn==="w"
            ? "Black"
            : "White";

    toast(
        "🏳️ " +
        winner +
        " wins by resignation."
    );

    profile.losses++;
    addXP(20);
    saveProfile();
}

function duelPoint(player=1) {

    const input =
        document.getElementById("duelInput");

    const value =
        input.value.trim().toUpperCase();

    if(value !== duelTarget) {
        toast("Wrong word!");
        return;
    }

    duelScores[
        player===2 ? "p2":"p1"
    ]++;

    document.getElementById(
        player===2 ? "duelP2":"duelP1"
    ).textContent =
        duelScores[
            player===2 ? "p2":"p1"
        ];

    input.value = "";

    duelTarget =
        rushWords[
            Math.floor(Math.random()*rushWords.length)
        ];

    document.getElementById(
        "duelWord"
    ).textContent = duelTarget;
}

function createOnlineRoom(game) {

    if(typeof Peer === "undefined") {

        toast("❌ Online service unavailable.");
        return;
    }

    onlineGame = game;
    onlineRole = "host";
    onlineRoom = randomRoomCode();

    if(peer) {
        try {
            peer.destroy();
        } catch {}
    }

    peer = createPeer();

    if(!peer) return;

    const status =
        document.getElementById("onlineStatus");

    if(status) {
        status.textContent =
            "Creating room...";
    }

    peer.on("open", id => {

        onlineHostPeer = id;

        const link =
            location.origin +
            location.pathname +
            "#room=" +
            encodeURIComponent(onlineRoom) +
            "&game=" +
            encodeURIComponent(game) +
            "&host=" +
            encodeURIComponent(id);

        const area =
            document.getElementById("onlineRoomArea");

        if(area) {

            area.innerHTML = `

                <div class="room-code">
                    ${onlineRoom}
                </div>

                <p style="text-align:center;color:var(--muted)">
                    Send this link to your friend:
                </p>

                <input
                    class="share-link"
                    value="${link}"
                    readonly
                    onclick="this.select()"
                >

                <div class="game-actions">

                    <button
                        class="action-btn primary"
                        onclick="copyRoomLink('${escapeJS(link)}')">
                        Copy Link
                    </button>

                </div>

                <div id="hostWaiting"
                    style="
                        text-align:center;
                        margin-top:20px;
                        color:var(--muted)
                    ">
                    Waiting for your friend...
                </div>
            `;
        }

        if(status) {
            status.textContent =
                "🟢 Room created. Waiting for player...";
        }
    });

    peer.on("connection", connection => {

        onlineConn = connection;

        setupOnlineConnection(connection);

    });

    peer.on("error", handlePeerError);

    peer.on("disconnected", () => {

        const status =
            document.getElementById("onlineStatus");

        if(status) {
            status.textContent =
                "⚠️ Reconnecting to online service...";
        }

        if(peer && !peer.destroyed) {
            peer.reconnect();
        }
    });
}

function joinOnlineRoom(game) {

    if(typeof Peer === "undefined") {

        toast("❌ Online service unavailable.");
        return;
    }

    const params =
        getURLParams();

    onlineGame = game;
    onlineRole = "guest";

    if(!onlineRoom) {
        onlineRoom = params.get("room");
    }

    if(!onlineHostPeer) {
        onlineHostPeer = params.get("host");
    }

    if(!onlineRoom || !onlineHostPeer) {

        toast(
            "❌ Invalid room link. Ask the host for a new link."
        );

        return;
    }

    if(peer) {
        try {
            peer.destroy();
        } catch {}
    }

    peer = createPeer();

    if(!peer) return;

    const status =
        document.getElementById("onlineStatus");

    if(status) {
        status.textContent =
            "Connecting to room...";
    }

    peer.on("open", () => {

        try {

            onlineConn =
                peer.connect(
                    onlineHostPeer,
                    {
                        reliable:true,
                        serialization:"json"
                    }
                );

            setupOnlineConnection(
                onlineConn
            );

        } catch(error) {

            toast(
                "❌ Could not connect to host."
            );
        }

    });

    peer.on("error", handlePeerError);

    peer.on("disconnected", () => {

        if(peer && !peer.destroyed) {
            peer.reconnect();
        }
    });
}

function setupOnlineConnection(connection) {

    if(!connection) return;

    connection.on("open", () => {

        onlineReady = true;

        const status =
            document.getElementById("onlineStatus");

        if(status) {
            status.textContent =
                "🟢 Connected!";
        }

        if(onlineRole === "guest") {

            sendOnline({
                type:"join",
                game:onlineGame,
                room:onlineRoom
            });

        } else {

            if(onlineGame === "word") {
                startOnlineWordHost();
            }

            if(onlineGame === "chess") {
                startOnlineChessHost();
            }
        }
    });

    connection.on("data", handleOnlineData);

    connection.on("close", () => {

        onlineReady = false;

        const status =
            document.getElementById("onlineStatus");

        if(status) {
            status.textContent =
                "🔴 Opponent disconnected.";
        }

        toast("🔴 Opponent disconnected.");
    });

    connection.on("error", () => {

        toast(
            "❌ Online connection error."
        );
    });
}

function sendOnline(data) {

    if(
        onlineConn &&
        onlineConn.open
    ) {

        onlineConn.send(data);

    } else {

        toast(
            "⚠️ Connection is not ready yet."
        );
    }
}

function handlePeerError(error) {

    console.error(error);

    if(error.type === "peer-unavailable") {

        toast(
            "❌ Host is unavailable. Ask them to create a new room."
        );
        return;
    }

    if(error.type === "network") {

        toast(
            "❌ Network problem. Check your internet."
        );
        return;
    }

    if(error.type === "disconnected") {

        toast(
            "⚠️ Disconnected. Reconnecting..."
        );
        return;
    }

    toast(
        "❌ Online error: " +
        (error.type || "unknown")
    );
}

function copyRoomLink(link) {

    navigator.clipboard
        .writeText(link)
        .then(() => {
            toast("🔗 Room link copied!");
        })
        .catch(() => {
            toast(
                "Copy the link manually."
            );
        });
}

/* =========================================================

========================================================= */

function startOnlineChessHost() {

    renderOnlineChessBoard();

    sendOnline({
        type:"chessState",
        board:createChessBoard(),
        turn:"w",
        history:[]
    });
}

let onlineChessBoard = [];
let onlineChessTurn = "w";
let onlineChessHistory = [];
let onlineChessSelected = null;

function renderOnlineChessBoard() {

    onlineChessBoard =
        createChessBoard();

    onlineChessTurn = "w";
    onlineChessHistory = [];
    onlineChessSelected = null;

    drawOnlineChess();
}

function drawOnlineChess() {

    let html = "";

    for(let r=0;r<8;r++) {

        for(let c=0;c<8;c++) {

            const piece =
                onlineChessBoard[r][c];

            html += `

                <div
                    class="
                        chess-square
                        ${
                            (r+c)%2===0
                            ? "light-square"
                            : "dark-square"
                        }
                    "
                    onclick="
                        onlineChessClick(${r},${c})
                    "
                >

                    ${
                        piece
                        ? `
                            <span class="
                                chess-piece
                                ${
                                    piece[0]==="w"
                                    ? "white-piece"
                                    : "black-piece"
                                }
                            ">
                                ${chessSymbols[piece]}
                            </span>
                        `
                        : ""
                    }

                </div>
            `;
        }
    }

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <h2 style="margin-bottom:15px">
                🌐 Online Chess
            </h2>

            <div class="chess-layout">

                <div class="chess-board">
                    ${html}
                </div>

                <div class="chess-side">

                    <div class="turn-box">
                        ${
                            onlineChessTurn==="w"
                            ? "White's turn"
                            : "Black's turn"
                        }
                    </div>

                    <div class="move-history">
                        ${
                            onlineChessHistory
                            .map((m,i)=>
                                `<div class="move-item">
                                    ${i+1}. ${m}
                                </div>`
                            )
                            .join("")
                        }
                    </div>

                </div>

            </div>

        </div>
    `;
}

function onlineChessClick(r,c) {

    const piece =
        onlineChessBoard[r][c];

    if(!onlineChessSelected) {

        if(piece) {

            onlineChessSelected = {
                r,c
            };

            toast(
                "Selected " +
                chessSymbols[piece]
            );
        }

        return;
    }

    const from =
        onlineChessSelected;

    const moving =
        onlineChessBoard[from.r][from.c];

    if(!moving) {

        onlineChessSelected = null;
        return;
    }

    if(piece && piece[0] === moving[0]) {

        onlineChessSelected = {r,c};
        drawOnlineChess();
        return;
    }

    onlineChessBoard[r][c] = moving;
    onlineChessBoard[from.r][from.c] = null;

    onlineChessHistory.push(
        `${from.r},${from.c} → ${r},${c}`
    );

    onlineChessTurn =
        onlineChessTurn==="w"
            ? "b"
            : "w";

    onlineChessSelected = null;

    sendOnline({
        type:"chessState",
        board:onlineChessBoard,
        turn:onlineChessTurn,
        history:onlineChessHistory
    });

    drawOnlineChess();
}

/* =========================================================
   ONLINE DATA HANDLER
========================================================= */

function handleOnlineData(data) {

    if(!data) return;

    if(data.type === "join") {

        if(
            onlineRole === "host" &&
            onlineGame === "word"
        ) {

            startOnlineWordHost();
        }

        if(
            onlineRole === "host" &&
            onlineGame === "chess"
        ) {

            startOnlineChessHost();
        }

        return;
    }

    if(data.type === "wordRound") {

        if(onlineRole === "guest") {
            handleOnlineWordGuestStart(data);
        }

        return;
    }

    if(data.type === "wordPoint") {

        const enemy =
            document.getElementById(
                "onlineEnemyScore"
            );

        if(enemy) {
            enemy.textContent =
                data.score;
        }

        return;
    }

    if(data.type === "chessState") {

        onlineChessBoard =
            data.board;

        onlineChessTurn =
            data.turn;

        onlineChessHistory =
            data.history || [];

        drawOnlineChess();

        return;
    }
}

    ["first","🎮 First Game","Play your first game."],
    ["xp100","⭐ Rising Star","Earn 100 XP."],
    ["xp500","🚀 Expert","Earn 500 XP."],
    ["win5","🏆 Winner","Get 5 wins."],
    ["coins500","🪙 Rich Player","Collect 500 coins."],
    ["master","🧠 Word Master","Solve Word Master."],
    ["chess","♟️ Chess Player","Play Chess."],
    ["online","🌐 Online Player","Join an online room."]
];

function checkAchievements() {

    const unlock = id => {

        if(!profile.achievements.includes(id)) {

            profile.achievements.push(id);

            toast("🏅 Achievement unlocked!");

            saveProfile();
        }
    };

    if(profile.xp >= 100) unlock("xp100");
    if(profile.xp >= 500) unlock("xp500");
    if(profile.wins >= 5) unlock("win5");
    if(profile.coins >= 500) unlock("coins500");
}
