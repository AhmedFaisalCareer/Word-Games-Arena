<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadia Arena — Ultimate Game Hub</title>

<style>
:root{
    --bg:#f4f6fa;
    --panel:#ffffff;
    --panel2:#edf2f7;
    --text:#1f2937;
    --muted:#718096;
    --primary:#805ad5;
    --primary2:#6b46c1;
    --cyan:#319795;
    --green:#38a169;
    --red:#e53e3e;
    --yellow:#d69e2e;
    --blue:#3182ce;
    --shadow:0 12px 30px rgba(100,116,139,.16);
    --radius:18px;
}

body.dark{
    --bg:#111827;
    --panel:#1f2937;
    --panel2:#374151;
    --text:#f9fafb;
    --muted:#a0aec0;
    --shadow:0 12px 30px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    transition:.25s;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.glass{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:var(--shadow);
}

.btn{
    border:0;
    padding:11px 18px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.primary{
    background:var(--primary);
    color:white;
}

.primary:hover{
    background:var(--primary2);
}

.secondary{
    background:var(--panel2);
    color:var(--text);
}

.danger{
    background:var(--red);
    color:white;
}

.success{
    background:var(--green);
    color:white;
}

/* LOGIN */

#login{
    position:fixed;
    inset:0;
    z-index:5000;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at 20% 20%,#e9d8fd,transparent 35%),
        radial-gradient(circle at 80% 80%,#b2f5ea,transparent 35%),
        linear-gradient(135deg,#bee3f8,#fefcbf);
}

.login-box{
    width:100%;
    max-width:470px;
    padding:40px;
    border-radius:28px;
    text-align:center;
    animation:pop .5s ease;
}

@keyframes pop{
    from{opacity:0;transform:scale(.9) translateY(20px)}
    to{opacity:1;transform:scale(1) translateY(0)}
}

.logo-big{
    font-size:3.5rem;
}

.login-box h1{
    margin:8px 0;
    font-size:2.3rem;
}

.login-box p{
    color:var(--muted);
    margin-bottom:20px;
}

.avatars{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
    flex-wrap:wrap;
}

.avatar{
    width:55px;
    height:55px;
    border:3px solid transparent;
    border-radius:50%;
    background:white;
    font-size:1.8rem;
    cursor:pointer;
}

.avatar.active{
    border-color:var(--primary);
    transform:scale(1.1);
}

.login-input{
    width:100%;
    padding:15px;
    border:2px solid #e2e8f0;
    border-radius:12px;
    margin-bottom:15px;
    outline:none;
}

/* HEADER */

header{
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:1000;
    background:var(--panel);
    box-shadow:var(--shadow);
}

.logo{
    font-size:1.45rem;
    font-weight:900;
    color:var(--primary);
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon-btn{
    border:0;
    background:var(--panel2);
    color:var(--text);
    width:42px;
    height:42px;
    border-radius:50%;
}

.profile{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel2);
    padding:7px 12px;
    border-radius:30px;
    cursor:pointer;
}

.profile-avatar{
    font-size:1.5rem;
}

/* LAYOUT */

.layout{
    max-width:1600px;
    margin:auto;
    display:flex;
    gap:22px;
    padding:22px;
}

.sidebar{
    width:250px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.nav-btn{
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:13px 16px;
    border-radius:12px;
    font-weight:700;
}

.nav-btn:hover,
.nav-btn.active{
    background:var(--panel);
    color:var(--primary);
    box-shadow:var(--shadow);
}

.main{
    flex:1;
    min-width:0;
}

.hero{
    border-radius:24px;
    padding:28px;
    margin-bottom:22px;
    background:linear-gradient(135deg,#e9d8fd,#c6f6d5,#bee3f8);
    display:flex;
    justify-content:space-between;
    gap:20px;
    align-items:center;
}

.hero h1{
    font-size:2rem;
    color:#263238;
}

.hero p{
    color:#4a5568;
    margin-top:7px;
}

.stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.stat{
    min-width:100px;
    text-align:center;
    padding:12px 16px;
    background:rgba(255,255,255,.8);
    border-radius:14px;
}

.stat strong{
    display:block;
    font-size:1.4rem;
    color:var(--primary);
}

.stat span{
    font-size:.7rem;
    text-transform:uppercase;
    color:#718096;
}

/* TOOLBAR */

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:200px;
    padding:13px 16px;
    border:2px solid transparent;
    border-radius:12px;
    background:var(--panel);
    color:var(--text);
    outline:none;
    box-shadow:var(--shadow);
}

.search:focus{
    border-color:var(--primary);
}

.sort{
    border:0;
    padding:12px;
    border-radius:12px;
    background:var(--panel);
    color:var(--text);
}

/* GAMES */

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:18px;
}

.game{
    min-height:220px;
    padding:22px;
    border-radius:18px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
    display:flex;
    flex-direction:column;
}

.game:hover{
    transform:translateY(-7px);
    box-shadow:0 20px 40px rgba(0,0,0,.15);
}

.game-icon{
    font-size:3rem;
    margin-bottom:10px;
}

.game h3{
    margin-bottom:5px;
}

.game-category{
    font-size:.75rem;
    text-transform:uppercase;
    color:var(--muted);
}

.play{
    margin-top:auto;
    padding-top:14px;
}

.play span{
    background:rgba(255,255,255,.7);
    padding:7px 12px;
    border-radius:20px;
    color:var(--primary);
    font-weight:800;
}

.favorite{
    position:absolute;
    right:12px;
    top:12px;
    border:0;
    background:rgba(255,255,255,.7);
    width:35px;
    height:35px;
    border-radius:50%;
}

/* GAME ARENA */

#arena{
    position:fixed;
    inset:0;
    z-index:3000;
    display:none;
    flex-direction:column;
    background:var(--bg);
}

#arena.active{
    display:flex;
}

.arena-head{
    min-height:68px;
    background:var(--panel);
    box-shadow:var(--shadow);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 22px;
}

.arena-title{
    font-size:1.3rem;
    font-weight:900;
}

.arena-actions{
    display:flex;
    gap:8px;
}

.arena-body{
    flex:1;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

/* GENERIC GAME UI */

.game-box{
    width:min(650px,100%);
    background:var(--panel);
    border-radius:22px;
    padding:28px;
    box-shadow:var(--shadow);
    text-align:center;
}

.game-box h2{
    margin-bottom:10px;
}

.game-box p{
    color:var(--muted);
    margin-bottom:18px;
}

.game-input{
    width:100%;
    padding:13px;
    border:2px solid #e2e8f0;
    border-radius:10px;
    background:var(--panel);
    color:var(--text);
    margin-bottom:12px;
}

.game-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

/* RESULT */

#result{
    position:fixed;
    inset:0;
    z-index:4500;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
}

#result.active{
    display:flex;
}

.result-box{
    width:min(430px,100%);
    background:var(--panel);
    border-radius:25px;
    padding:35px;
    text-align:center;
    animation:pop .3s;
}

.result-icon{
    font-size:4rem;
}

.result-box h2{
    margin:10px 0;
}

.result-score{
    font-size:2rem;
    color:var(--primary);
    font-weight:900;
    margin:15px;
}

/* PROFILE */

.modal{
    position:fixed;
    inset:0;
    z-index:4000;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(500px,100%);
    background:var(--panel);
    border-radius:24px;
    padding:30px;
    max-height:90vh;
    overflow:auto;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:0;
    background:var(--panel2);
    color:var(--text);
    width:36px;
    height:36px;
    border-radius:50%;
}

/* BOARD */

.board{
    display:grid;
    gap:5px;
    justify-content:center;
}

.cell{
    background:var(--panel2);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:900;
    cursor:pointer;
    border-radius:8px;
}

.ttt-board{
    grid-template-columns:repeat(3,90px);
}

.ttt-cell{
    width:90px;
    height:90px;
    font-size:2.5rem;
}

.c4-board{
    grid-template-columns:repeat(7,48px);
    background:#2563eb;
    padding:10px;
    border-radius:15px;
}

.c4-cell{
    width:48px;
    height:48px;
    border-radius:50%;
    background:white;
}

.memory-board{
    grid-template-columns:repeat(4,75px);
}

.memory-card{
    width:75px;
    height:75px;
    font-size:2rem;
}

/* CANVAS */

canvas{
    max-width:100%;
    border-radius:16px;
    box-shadow:var(--shadow);
}

/* KEYPAD */

.keypad{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:6px;
    max-width:650px;
    margin:auto;
}

.keypad button{
    border:0;
    padding:10px 4px;
    border-radius:8px;
    background:var(--panel2);
    color:var(--text);
    font-weight:700;
}

.keypad button:hover{
    background:var(--primary);
    color:white;
}

/* ACHIEVEMENTS */

.achievement-list{
    display:grid;
    gap:10px;
}

.achievement{
    padding:14px;
    border-radius:12px;
    background:var(--panel2);
    display:flex;
    gap:12px;
    align-items:center;
}

.achievement.locked{
    opacity:.45;
}

.achievement-icon{
    font-size:1.8rem;
}

/* RESPONSIVE */

@media(max-width:900px){
    .layout{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        flex-direction:row;
        overflow:auto;
    }

    .nav-btn{
        white-space:nowrap;
    }

    .hero{
        flex-direction:column;
        text-align:center;
    }
}

@media(max-width:600px){
    header{
        padding:0 12px;
    }

    .logo{
        font-size:1rem;
    }

    .profile-name{
        display:none;
    }

    .layout{
        padding:12px;
    }

    .games{
        grid-template-columns:repeat(2,1fr);
    }

    .game{
        min-height:190px;
        padding:16px;
    }

    .game-icon{
        font-size:2.3rem;
    }

    .arena-body{
        padding:12px;
    }

    .game-box{
        padding:20px 14px;
    }

    .ttt-board{
        grid-template-columns:repeat(3,75px);
    }

    .ttt-cell{
        width:75px;
        height:75px;
    }

    .c4-board{
        grid-template-columns:repeat(7,38px);
    }

    .c4-cell{
        width:38px;
        height:38px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login">
    <div class="login-box glass">
        <div class="logo-big">🏆</div>
        <h1>Arcadia Arena</h1>
        <p>The Ultimate Browser Game Hub</p>

        <div class="avatars">
            <button class="avatar active" onclick="chooseAvatar('🚀',this)">🚀</button>
            <button class="avatar" onclick="chooseAvatar('🦊',this)">🦊</button>
            <button class="avatar" onclick="chooseAvatar('👑',this)">👑</button>
            <button class="avatar" onclick="chooseAvatar('🦄',this)">🦄</button>
            <button class="avatar" onclick="chooseAvatar('👾',this)">👾</button>
            <button class="avatar" onclick="chooseAvatar('🐉',this)">🐉</button>
            <button class="avatar" onclick="chooseAvatar('🤖',this)">🤖</button>
        </div>

        <input id="username" class="login-input" maxlength="15" placeholder="Enter player nickname">

        <button class="btn primary" style="width:100%" onclick="login()">
            🎮 Enter Game Arena
        </button>
    </div>
</section>

<!-- HEADER -->
<header>
    <div class="logo">🏆 Arcadia Arena</div>

    <div class="header-right">
        <button class="icon-btn" onclick="toggleSound()" id="soundBtn">🔊</button>
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>

        <div class="profile" onclick="openProfile()">
            <span id="navAvatar" class="profile-avatar">🚀</span>
            <span id="navName" class="profile-name">Player</span>
            <span>🏆 <b id="navScore">0</b></span>
        </div>
    </div>
</header>

<!-- MAIN -->
<div class="layout">

    <aside class="sidebar">
        <button class="nav-btn active" onclick="filterGames('all',this)">✨ All Games</button>
        <button class="nav-btn" onclick="filterGames('arcade',this)">🕹️ Arcade</button>
        <button class="nav-btn" onclick="filterGames('word',this)">🔤 Word</button>
        <button class="nav-btn" onclick="filterGames('brain',this)">🧠 Brain</button>
        <button class="nav-btn" onclick="filterGames('strategy',this)">♟️ Strategy</button>
        <button class="nav-btn" onclick="filterGames('sport',this)">🏓 Sports</button>
        <button class="nav-btn" onclick="filterGames('favorite',this)">❤️ Favorites</button>
    </aside>

    <main class="main">

        <section class="hero">
            <div>
                <h1 id="welcome">Ready to Play?</h1>
                <p>Choose a game, beat your high score and unlock achievements.</p>
            </div>

            <div class="stats">
                <div class="stat">
                    <strong id="played">0</strong>
                    <span>Played</span>
                </div>

                <div class="stat">
                    <strong id="wins">0</strong>
                    <span>Wins</span>
                </div>

                <div class="stat">
                    <strong id="score">0</strong>
                    <span>Score</span>
                </div>

                <div class="stat">
                    <strong id="level">1</strong>
                    <span>Level</span>
                </div>
            </div>
        </section>

        <div class="toolbar">
            <input id="search" class="search" placeholder="🔎 Search games..." oninput="renderGames()">

            <select id="sort" class="sort" onchange="renderGames()">
                <option value="default">Sort: Default</option>
                <option value="name">Name</option>
                <option value="score">Highest Score</option>
                <option value="favorite">Favorites</option>
            </select>
        </div>

        <section id="games" class="games"></section>

    </main>
</div>

<!-- GAME ARENA -->
<section id="arena">

    <div class="arena-head">
        <div id="arenaTitle" class="arena-title">🎮 Game</div>

        <div class="arena-actions">
            <button class="btn secondary" onclick="restartGame()">🔄 Restart</button>
            <button class="btn primary" onclick="exitGame()">⬅ Hub</button>
        </div>
    </div>

    <div id="arenaBody" class="arena-body"></div>

</section>

<!-- RESULT -->
<section id="result">
    <div class="result-box">
        <div id="resultIcon" class="result-icon">🏆</div>
        <h2 id="resultTitle">Victory!</h2>
        <p id="resultText">Great game!</p>

        <div class="result-score" id="resultScore">+50</div>

        <div class="game-buttons">
            <button class="btn secondary" onclick="closeResult()">Close</button>
            <button class="btn primary" onclick="closeResult();restartGame()">🔄 Play Again</button>
        </div>
    </div>
</section>

<!-- PROFILE -->
<section id="profileModal" class="modal">
    <div class="modal-box">

        <div class="modal-head">
            <h2>👤 Player Profile</h2>
            <button class="close" onclick="closeProfile()">✕</button>
        </div>

        <div style="text-align:center">
            <div id="profileAvatar" style="font-size:5rem">🚀</div>
            <h2 id="profileName">Player</h2>

            <div class="stats" style="justify-content:center;margin:20px 0">
                <div class="stat">
                    <strong id="profileScore">0</strong>
                    <span>Score</span>
                </div>
                <div class="stat">
                    <strong id="profileWins">0</strong>
                    <span>Wins</span>
                </div>
                <div class="stat">
                    <strong id="profilePlayed">0</strong>
                    <span>Played</span>
                </div>
            </div>
        </div>

        <h3 style="margin:20px 0 10px">🏅 Achievements</h3>

        <div id="achievements" class="achievement-list"></div>

        <button class="btn danger" style="width:100%;margin-top:20px" onclick="resetProgress()">
            Reset Progress
        </button>

    </div>
</section>

<script>

/* ============================================================
   ARCADIA ARENA
   ULTIMATE SINGLE FILE GAME ENGINE
============================================================ */

/* ---------------- PLAYER ---------------- */

let player = {
    name:"Player",

    score:0,
    wins:0,
    played:0,
    level:1,
    sound:true,
    theme:false,
    favorites:[],
    highScores:{}
};

let selectedAvatar="🚀";
let currentCategory="all";
let currentGame=null;
let cleanupGame=null;

const games=[

{id:"trivia",name:"Trivia Quiz",icon:"🏆",category:"brain",color:"#feebc8"},
{id:"hangman",name:"Hangman",icon:"🔤",category:"word",color:"#e9d8fd"},
{id:"scramble",name:"Word Scramble",icon:"🔀",category:"word",color:"#bee3f8"},

{id:"wordsearch",name:"Word Search",icon:"🔎",category:"word",color:"#fed7e2"},

{id:"tictactoe",name:"Tic-Tac-Toe",icon:"❌",category:"strategy",color:"#fbb6ce"},

{id:"sudoku",name:"Mini Sudoku",icon:"🔢",category:"strategy",color:"#bee3f8"},
{id:"memory",name:"Memory Cards",icon:"🃏",category:"brain",color:"#c6f6d5"},
{id:"2048",name:"2048",icon:"🔢",category:"brain",color:"#fefcbf"},

{id:"math",name:"Math Challenge",icon:"🧮",category:"brain",color:"#bee3f8"},
{id:"numbermemory",name:"Number Memory",icon:"🔢",category:"brain",color:"#e9d8fd"},
{id:"simon",name:"Simon Says",icon:"🎵",category:"brain",color:"#c6f6d5"},
{id:"colormatch",name:"Color Match",icon:"🌈",category:"brain",color:"#e9d8fd"},
{id:"cipher",name:"Cipher Breaker",icon:"🔐",category:"brain",color:"#bee3f8"},

{id:"snake",name:"Snake",icon:"🐍",category:"arcade",color:"#b2f5ea"},
{id:"breakout",name:"Breakout",icon:"🧱",category:"arcade",color:"#e9d8fd"},
{id:"flappy",name:"Flappy Bird",icon:"🐦",category:"arcade",color:"#bee3f8"},
{id:"space",name:"Space Shooter",icon:"🚀",category:"arcade",color:"#c4b5fd"},
{id:"dodger",name:"Space Dodger",icon:"🛸",category:"arcade",color:"#bae6fd"},
{id:"quicktap",name:"Quick Tap",icon:"⚡",category:"arcade",color:"#fefcbf"},
{id:"reaction",name:"Reaction Test",icon:"🎯",category:"arcade",color:"#fbb6ce"},

{id:"pong",name:"Pong",icon:"🏓",category:"sport",color:"#feebc8"},
{id:"penalty",name:"Penalty Shootout",icon:"⚽",category:"sport",color:"#c6f6d5"},
{id:"target",name:"Target Master",icon:"🎯",category:"sport",color:"#fed7d7"},

{id:"rps",name:"Rock Paper Scissors",icon:"✊",category:"strategy",color:"#fbb6ce"},
{id:"higher",name:"Higher or Lower",icon:"🃏",category:"strategy",color:"#c6f6d5"},
{id:"numguess",name:"Number Guess",icon:"🧩",category:"casual",color:"#b2f5ea"},
{id:"dice",name:"Dice Battle",icon:"🎲",category:"casual",color:"#fefcbf"}

];

/* ---------------- INIT ---------------- */

window.addEventListener("load",()=>{
    loadPlayer();
    renderGames();
    updateUI();
});

/* ---------------- STORAGE ---------------- */

function savePlayer(){
    localStorage.setItem("arcadia_player",JSON.stringify(player));
}

function loadPlayer(){
    const saved=localStorage.getItem("arcadia_player");

    if(saved){
        try{
            player={...player,...JSON.parse(saved)};
            if(player.theme) document.body.classList.add("dark");
            document.getElementById("login").classList.add("hidden");
        }catch(e){}
    }
}

/* ---------------- LOGIN ---------------- */

function chooseAvatar(a,el){
    selectedAvatar=a;
    document.querySelectorAll(".avatar").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");
}

function login(){
    const name=document.getElementById("username").value.trim();

    player.name=name||"Player";
    player.avatar=selectedAvatar;

    savePlayer();
    updateUI();

    document.getElementById("login").classList.add("hidden");
}

/* ---------------- UI ---------------- */

function updateUI(){

    document.getElementById("navAvatar").textContent=player.avatar;
    document.getElementById("navName").textContent=player.name;
    document.getElementById("navScore").textContent=player.score;

    document.getElementById("welcome").textContent=
        `Ready to Play, ${player.name}?`;

    document.getElementById("played").textContent=player.played;
    document.getElementById("wins").textContent=player.wins;
    document.getElementById("score").textContent=player.score;

    player.level=Math.max(1,Math.floor(player.score/500)+1);

    document.getElementById("level").textContent=player.level;

    document.getElementById("profileAvatar").textContent=player.avatar;
    document.getElementById("profileName").textContent=player.name;
    document.getElementById("profileScore").textContent=player.score;
    document.getElementById("profileWins").textContent=player.wins;
    document.getElementById("profilePlayed").textContent=player.played;

    document.getElementById("soundBtn").textContent=
        player.sound?"🔊":"🔇";

    document.getElementById("themeBtn").textContent=
        player.theme?"☀️":"🌙";

    renderAchievements();
}

/* ---------------- THEME ---------------- */

function toggleTheme(){

    player.theme=!player.theme;

    document.body.classList.toggle("dark",player.theme);

    savePlayer();
    updateUI();
}

function toggleSound(){

    player.sound=!player.sound;

    if(player.sound) beep(600,80);

    savePlayer();
    updateUI();
}

/* ---------------- SOUND ---------------- */

let audioContext=null;

function beep(freq=500,duration=80){

    if(!player.sound)return;

    try{
        audioContext ||= new (window.AudioContext||window.webkitAudioContext)();

        const oscillator=audioContext.createOscillator();
        const gain=audioContext.createGain();

        oscillator.frequency.value=freq;
        oscillator.type="sine";

        gain.gain.value=.04;

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        setTimeout(()=>{
            oscillator.stop();
        },duration);

    }catch(e){}
}

/* ---------------- FILTER ---------------- */

function filterGames(category,button){

    currentCategory=category;

    document.querySelectorAll(".nav-btn")
        .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    renderGames();
}

/* ---------------- RENDER GAMES ---------------- */

function renderGames(){

    const search=document.getElementById("search").value.toLowerCase();
    const sort=document.getElementById("sort").value;

    let list=[...games];

    if(currentCategory!=="all"){

        if(currentCategory==="favorite"){
            list=list.filter(g=>player.favorites.includes(g.id));
        }else{
            list=list.filter(g=>g.category===currentCategory);
        }
    }

    list=list.filter(g=>
        g.name.toLowerCase().includes(search) ||
        g.category.toLowerCase().includes(search)
    );

    if(sort==="name"){
        list.sort((a,b)=>a.name.localeCompare(b.name));
    }

    if(sort==="score"){
        list.sort((a,b)=>
            (player.highScores[b.id]||0)-
            (player.highScores[a.id]||0)
        );
    }

    if(sort==="favorite"){
        list.sort((a,b)=>
            Number(player.favorites.includes(b.id))-
            Number(player.favorites.includes(a.id))
        );
    }

    const box=document.getElementById("games");

    box.innerHTML="";

    list.forEach(game=>{

        const favorite=player.favorites.includes(game.id);

        const card=document.createElement("article");

        card.className="game glass";

        card.style.background=
            `linear-gradient(135deg,${game.color},rgba(255,255,255,.65))`;

        card.innerHTML=`

            <button class="favorite"
                onclick="event.stopPropagation();toggleFavorite('${game.id}')">
                ${favorite?"❤️":"🤍"}
            </button>

            <div class="game-icon">${game.icon}</div>

            <h3>${game.name}</h3>

            <div class="game-category">${game.category}</div>

            <div style="margin-top:8px;color:#718096;font-size:.8rem">
                Best: ${player.highScores[game.id]||0}
            </div>

            <div class="play">
                <span>Play ▶</span>
            </div>
        `;

        card.onclick=()=>openGame(game.id);

        box.appendChild(card);
    });

    if(!list.length){
        box.innerHTML=`
            <div class="game-box" style="grid-column:1/-1">
                <h2>🔎 No games found</h2>
                <p>Try another search or category.</p>
            </div>
        `;
    }
}

/* ---------------- FAVORITES ---------------- */

function toggleFavorite(id){

    if(player.favorites.includes(id)){
        player.favorites=
            player.favorites.filter(x=>x!==id);
    }else{
        player.favorites.push(id);
    }

    savePlayer();
    renderGames();
}

/* ---------------- GAME ENGINE ---------------- */

function openGame(id){

    const game=games.find(g=>g.id===id);

    if(!game)return;

    currentGame=id;

    player.played++;

    savePlayer();
    updateUI();

    document.getElementById("arenaTitle").textContent=
        `${game.icon} ${game.name}`;

    document.getElementById("arena").classList.add("active");

    launch(id);
}

function exitGame(){

    stopCurrentGame();

    document.getElementById("arena").classList.remove("active");
    document.getElementById("arenaBody").innerHTML="";

    currentGame=null;
}

function restartGame(){

    if(!currentGame)return;

    stopCurrentGame();

    document.getElementById("arenaBody").innerHTML="";

    launch(currentGame);
}

function stopCurrentGame(){

    if(typeof cleanupGame==="function"){
        try{
            cleanupGame();
        }catch(e){}
    }

    cleanupGame=null;

    window.onkeydown=null;
}

/* ---------------- RESULTS ---------------- */

function finishGame(title,text,points,win=true,icon="🏆"){

    points=Math.max(0,Math.floor(points));

    if(win){
        player.wins++;
    }

    player.score+=points;

    if(!player.highScores[currentGame] ||
       points>player.highScores[currentGame]){
        player.highScores[currentGame]=points;
    }

    savePlayer();
    updateUI();

    document.getElementById("resultIcon").textContent=icon;
    document.getElementById("resultTitle").textContent=title;
    document.getElementById("resultText").textContent=text;
    document.getElementById("resultScore").textContent=
        `+${points} points`;

    document.getElementById("result").classList.add("active");

    beep(win?850:220,120);
}

function closeResult(){
    document.getElementById("result").classList.remove("active");
}

/* ---------------- PROFILE ---------------- */

function openProfile(){
    document.getElementById("profileModal").classList.add("active");
}

function closeProfile(){
    document.getElementById("profileModal").classList.remove("active");
}

function resetProgress(){

    if(!confirm("Reset all Arcadia progress?"))return;

    player.score=0;
    player.wins=0;
    player.played=0;
    player.level=1;
    player.highScores={};
    player.favorites=[];

    savePlayer();
    updateUI();
    closeProfile();
    renderGames();
}

/* ---------------- ACHIEVEMENTS ---------------- */

function renderAchievements(){

    const achievements=[

        ["🎮","First Game",player.played>=1,"Play your first game"],
        ["🏆","Winner",player.wins>=1,"Win one game"],
        ["🔥","Score Hunter",player.score>=500,"Earn 500 points"],
        ["💎","High Roller",player.score>=2000,"Earn 2,000 points"],

/* ============================================================
   GAME 1 — TRIVIA
============================================================ */

function gameTrivia(box){

    const questions=[
        ["Which planet is called the Red Planet?",["Earth","Mars","Venus","Jupiter"],1],
        ["Largest ocean?",["Atlantic","Pacific","Indian","Arctic"],1],
        ["How many legs does a spider have?",["6","8","10","12"],1],
        ["Chemical symbol O?",["Gold","Oxygen","Osmium","Iron"],1],
        ["Capital of Pakistan?",["Lahore","Islamabad","Karachi","Peshawar"],1],
        ["How many continents are there?",["5","6","7","8"],2],
        ["Fastest land animal?",["Lion","Horse","Cheetah","Tiger"],2],
        ["Which gas do humans breathe in?",["Oxygen","Helium","Hydrogen","Neon"],0]
    ];

    let index=0;
    let score=0;

    function render(){

        if(index>=questions.length){

            finishGame(
                "Trivia Complete!",
                `You answered ${score}/${questions.length} correctly.`,
                score*30,
                score>=4,
                "🏆"
            );

            return;
        }

        const q=questions[index];

        box.innerHTML=`

            <div class="game-box">
                <p>Question ${index+1} / ${questions.length}</p>

                <h2>${q[0]}</h2>

                <div style="display:grid;gap:10px;margin-top:20px">
                    ${q[1].map((a,i)=>`
                        <button class="btn secondary"
                            onclick="window.triviaAnswer(${i})">
                            ${a}
                        </button>
                    `).join("")}
                </div>
            </div>
        `;
    }

    window.triviaAnswer=(choice)=>{

        if(choice===questions[index][2]){
            score++;
            beep(700);
        }else{
            beep(200);
        }

        index++;
        render();
    };

    render();

    cleanupGame=()=>{
        delete window.triviaAnswer;
    };
}

/* ============================================================
   GAME 2 — HANGMAN
============================================================ */

function gameHangman(box){

    const words=[
        "COMPUTER","PYTHON","JAVASCRIPT","ARCADE",
        "GALAXY","ROCKET","PLANET","PUZZLE",
        "SCHOOL","CODING","KEYBOARD","BROWSER"
    ];

    const word=words[Math.floor(Math.random()*words.length)];

    let guessed=new Set();
    let mistakes=0;

    function render(){

        if(word.split("").every(x=>guessed.has(x))){

            finishGame(
                "Word Solved!",
                `You discovered ${word}.`,
                100,
                true,
                "🎉"
            );

            return;
        }

        if(mistakes>=6){

            finishGame(
                "Game Over",
                `The word was ${word}.`,
                0,
                false,
                "❌"
            );

            return;
        }

        const display=word
            .split("")
            .map(x=>guessed.has(x)?x:"_")
            .join(" ");

        const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        box.innerHTML=`

            <div class="game-box">

                <p>Mistakes: ${mistakes}/6</p>

                <h1 style="letter-spacing:8px;margin:25px 0">
                    ${display}
                </h1>

                <div class="keypad">
                    ${alphabet.split("").map(letter=>`
                        <button
                            ${guessed.has(letter)?"disabled":""}
                            onclick="window.hangGuess('${letter}')">
                            ${letter}
                        </button>
                    `).join("")}
                </div>

            </div>
        `;
    }

    window.hangGuess=(letter)=>{

        if(guessed.has(letter))return;

        guessed.add(letter);

        if(!word.includes(letter)){
            mistakes++;
            beep(180);
        }else{
            beep(650);
        }

        render();
    };

    render();

    cleanupGame=()=>{
        delete window.hangGuess;
    };
}

/* ============================================================
   GAME 4 — WORD MASTER
============================================================ */

function gameWordMaster(box){

    const words=[
        "PLANT","SMART","BRAIN","POWER",
        "LIGHT","MOUSE","HOUSE","WORLD",
        "SPACE","SNAKE"
    ];

    const target=words[Math.floor(Math.random()*words.length)];

    let attempts=[];

    function render(){

        box.innerHTML=`

            <div class="game-box">

                <h2>Word Master</h2>
                <p>Find the 5-letter word in 6 attempts.</p>

                <div style="display:grid;gap:6px;
                    width:max-content;margin:20px auto">

                    ${Array.from({length:6}).map((_,r)=>{

                        const guess=attempts[r]||"";

                        return `
                        <div style="display:grid;
                            grid-template-columns:repeat(5,50px);
                            gap:5px">

                            ${Array.from({length:5}).map((_,c)=>{

                                const char=guess[c]||"";
                                let color="var(--panel2)";

                                if(guess){
                                    if(char===target[c])
                                        color="#48bb78";
                                    else if(target.includes(char))
                                        color="#ecc94b";
                                    else
                                        color="#a0aec0";
                                }

                                return `
                                <div style="
                                    width:50px;height:50px;
                                    background:${color};
                                    border-radius:7px;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    font-size:1.3rem;
                                    font-weight:bold">
                                    ${char}
                                </div>`;
                            }).join("")}

                        </div>`;
                    }).join("")}

                </div>

                <input id="wmInput"
                    maxlength="5"
                    class="game-input"
                    style="text-transform:uppercase"
                    placeholder="5-letter word">

                <button class="btn primary"
                    onclick="window.wmSubmit()">
                    Guess
                </button>

            </div>
        `;
    }

    window.wmSubmit=()=>{

        const value=document
            .getElementById("wmInput")
            .value.trim().toUpperCase();

        if(value.length!==5)return;

        attempts.push(value);

        if(value===target){

            finishGame(
                "Word Master!",
                `Solved in ${attempts.length} attempts.`,
                Math.max(40,150-attempts.length*15),
                true,
                "🧠"
            );

            return;
        }

        if(attempts.length>=6){

            finishGame(
                "Out of Attempts",
                `The word was ${target}.`,
                0,
                false,
                "❌"
            );

            return;
        }

        render();
    };

    render();

    cleanupGame=()=>{
        delete window.wmSubmit;
    };
}

/* ============================================================
   GAME 6 — TIC TAC TOE
============================================================ */

function gameTicTacToe(box){

    let board=Array(9).fill("");
    let turn="X";

    const wins=[
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    function winner(p){
        return wins.some(w=>w.every(i=>board[i]===p));
    }

    function render(){

        box.innerHTML=`

            <div class="game-box">

                <h2>Tic-Tac-Toe</h2>
                <p>Turn: ${turn}</p>

                <div class="board ttt-board"
                    style="margin:20px auto">

                    ${board.map((v,i)=>`
                        <div class="cell ttt-cell"
                            onclick="window.tttMove(${i})">
                            ${v}
                        </div>
                    `).join("")}

                </div>

            </div>
        `;
    }

    window.tttMove=(i)=>{

        if(board[i])return;

        board[i]=turn;

        if(winner(turn)){

            finishGame(
                `Player ${turn} Wins!`,
                "Three in a row!",
                70,
                true,
                "❌"
            );

            return;
        }

        if(board.every(Boolean)){

            finishGame(
                "Draw!",
                "Nobody won this round.",
                20,
                false,
                "🤝"
            );

            return;
        }

        turn=turn==="X"?"O":"X";

        render();
    };

    render();

    cleanupGame=()=>{
        delete window.tttMove;
    };
}

/* ============================================================
   GAME 7 — CONNECT FOUR
============================================================ */

function gameConnect4(box){

    let board=Array(42).fill("");
    let gameOver=false;

    function render(){

        box.innerHTML=`

            <div class="game-box">

                <h2>Connect Four</h2>
                <p>Get four red pieces in a row.</p>

                <div class="board c4-board">

                    ${board.map((v,i)=>`
                        <div class="cell c4-cell"
                            onclick="window.c4Move(${i%7})"
                            style="background:
                            ${v==="R"?"#ef4444":
                              v==="Y"?"#facc15":"white"}">
                        </div>
                    `).join("")}

                </div>

            </div>
        `;
    }

    function check(p){

        for(let r=0;r<6;r++){
            for(let c=0;c<7;c++){

                const dirs=[
                    [0,1],[1,0],[1,1],[1,-1]
                ];

                for(const [dr,dc] of dirs){

                    let ok=true;

                    for(let k=0;k<4;k++){

                        const rr=r+dr*k;
                        const cc=c+dc*k;

                        if(
                            rr<0||rr>=6||
                            cc<0||cc>=7||
                            board[rr*7+cc]!==p
                        ){
                            ok=false;
                            break;
                        }
                    }

                    if(ok)return true;
                }
            }
        }

        return false;
    }

    function drop(col,p){

        for(let r=5;r>=0;r--){

            const index=r*7+col;

            if(!board[index]){
                board[index]=p;
                return true;
            }
        }

        return false;
    }

    window.c4Move=(col)=>{

        if(gameOver)return;

        if(!drop(col,"R"))return;

        if(check("R")){

            gameOver=true;

            finishGame(
                "Connect Four!",
                "You connected four pieces.",
                100,
                true,
                "🟡"
            );

            return;
        }

        const available=[];

        for(let c=0;c<7;c++){
            if(!board[c])available.push(c);
        }

        if(available.length){

            const ai=
                available[Math.floor(Math.random()*available.length)];

            drop(ai,"Y");

            if(check("Y")){

                gameOver=true;

                finishGame(
                    "AI Wins",
                    "The computer connected four.",
                    0,
                    false,
                    "❌"
                );

                return;
            }
        }

        render();
    };

    render();

    cleanupGame=()=>{
        delete window.c4Move;
    };
}

/* ============================================================
   GAME 8 — MEMORY
============================================================ */

function gameMemory(box){

    const icons=["🐶","🐱","🦊","🐼","🐸","🐵","🐯","🐨"];

    const deck=[...icons,...icons]
        .sort(()=>Math.random()-.5);

    let open=[];
    let matched=0;
    let locked=false;

    function render(){

        box.innerHTML=`

            <div class="game-box">

                <h2>Memory Cards</h2>

                <div class="board memory-board">

                    ${deck.map((icon,i)=>`

                        <div class="cell memory-card"
                            id="memory${i}"
                            onclick="window.memoryFlip(${i})">
                            ${open.some(x=>x.i===i)||deck[i]==="MATCH"?
                            icon:"?"}
                        </div>

                    `).join("")}

                </div>

            </div>
        `;
    }

    window.memoryFlip=(i)=>{

        if(locked)return;

        if(open.some(x=>x.i===i))return;

        if(deck[i]==="MATCH")return;

        open.push({i,icon:deck[i]});

        render();

        if(open.length===2){

            locked=true;

            if(open[0].icon===open[1].icon){

                deck[open[0].i]="MATCH";
                deck[open[1].i]="MATCH";

                matched++;

                open=[];
                locked=false;

                if(matched===icons.length){

                    finishGame(
                        "Memory Master!",
                        "Every pair matched!",
                        120,
                        true,
                        "🃏"
                    );

                    return;
                }

                render();

            }else{

                setTimeout(()=>{

                    open=[];

/* ============================================================
   GAME 9 — 2048
============================================================ */

function game2048(box){

    let board=Array(16).fill(0);
    let score=0;

    function add(){

        const empty=board
            .map((v,i)=>v===0?i:-1)
            .filter(i=>i>=0);

        if(!empty.length)return;

        const i=empty[Math.floor(Math.random()*empty.length)];

        board[i]=Math.random()<.9?2:4;
    }

    add();
    add();

    function render(){

        box.innerHTML=`

            <div class="game-box">

                <h2>2048</h2>
                <p>Score: <b>${score}</b></p>

                <div style="
                    display:grid;
                    grid-template-columns:repeat(4,70px);
                    gap:7px;
                    background:#bbada0;
                    padding:8px;
                    width:max-content;
                    margin:auto">

                    ${board.map(v=>`
                        <div style="
                            width:70px;
                            height:70px;
                            background:${tileColor(v)};
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            border-radius:8px;
                            font-size:1.4rem;
                            font-weight:900">
                            ${v||""}
                        </div>
                    `).join("")}

                </div>

                <div class="game-buttons" style="margin-top:15px">
                    <button class="btn secondary" onclick="window.move2048('left')">⬅</button>
                    <button class="btn secondary" onclick="window.move2048('up')">⬆</button>
                    <button class="btn secondary" onclick="window.move2048('down')">⬇</button>
                    <button class="btn secondary" onclick="window.move2048('right')">➡</button>
                </div>

            </div>
        `;
    }

    function tileColor(v){

        const colors={
            0:"#ccc0b3",
            2:"#eee4da",
            4:"#ede0c8",
            8:"#f2b179",
            16:"#f59563",
            32:"#f67c5f",
            64:"#f65e3b",
            128:"#edcf72",
            256:"#edcc61",
            512:"#edc850",
            1024:"#edc53f",
            2048:"#edc22e"
        };

        return colors[v]||"#3c3a32";
    }

    function slide(line){

        const filtered=line.filter(Boolean);

        for(let i=0;i<filtered.length-1;i++){

            if(filtered[i]===filtered[i+1]){

                filtered[i]*=2;
                score+=filtered[i];

                filtered.splice(i+1,1);
            }
        }

        while(filtered.length<4)filtered.push(0);

        return filtered;
    }

    window.move2048=(direction)=>{

        const old=[...board];

        for(let i=0;i<4;i++){

            let line;

            if(direction==="left"||direction==="right"){
                line=board.slice(i*4,i*4+4);
            }else{
                line=[
                    board[i],
                    board[i+4],
                    board[i+8],
                    board[i+12]
                ];
            }

            if(direction==="right"||direction==="down")
                line.reverse();

            line=slide(line);

            if(direction==="right"||direction==="down")
                line.reverse();

            for(let j=0;j<4;j++){

                if(direction==="left"||direction==="right"){
                    board[i*4+j]=line[j];
                }else{
                    board[i+j*4]=line[j];
                }
            }
        }

        if(JSON.stringify(old)!==JSON.stringify(board)){

            add();
            render();

            if(board.includes(2048)){

                finishGame(
                    "2048!",
                    "You reached the legendary tile!",
                    score,
                    true,
                    "🔢"
                );

            }else if(!board.includes(0)){

                let possible=false;

                for(let i=0;i<16;i++){

                    if(
                        i%4<3&&board[i]===board[i+1] ||
                        i<12&&board[i]===board[i+4]
                    ){
                        possible=true;
                    }
                }

                if(!possible){

                    finishGame(
                        "Game Over",
                        `Final score: ${score}`,
                        score,
                        false,
                        "❌"
                    );
                }
            }
        }
    };

    window.onkeydown=(e)=>{

        const map={
            ArrowLeft:"left",
            ArrowRight:"right",
            ArrowUp:"up",
            ArrowDown:"down"
        };

        if(map[e.key]){
            e.preventDefault();
            window.move2048(map[e.key]);
        }
    };

    render();

    cleanupGame=()=>{
        window.onkeydown=null;
        delete window.move2048;
    };
}

   GAME 10 — SNAKE
============================================================ */

function gameSnake(box){

    box.innerHTML=`

        <div class="game-box">

            <h2>🐍 Snake</h2>
            <p>Use arrow keys or buttons.</p>

            <canvas id="snakeCanvas"
                width="360"
                height="360"></canvas>

            <div class="game-buttons" style="margin-top:15px">
                <button class="btn secondary" onclick="window.snakeDir('up')">⬆</button>
                <button class="btn secondary" onclick="window.snakeDir('left')">⬅</button>
                <button class="btn secondary" onclick="window.snakeDir('down')">⬇</button>
                <button class="btn secondary" onclick="window.snakeDir('right')">➡</button>
            </div>

        </div>
    `;

    const canvas=document.getElementById("snakeCanvas");
    const ctx=canvas.getContext("2d");

    const size=18;
    const cells=20;

    let snake=[
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];

    let food=randomFood();

    let dx=1;
    let dy=0;
    let score=0;
    let timer;

    function randomFood(){

        return {
            x:Math.floor(Math.random()*cells),
            y:Math.floor(Math.random()*cells)
        };
    }

    function draw(){

        ctx.fillStyle="#111827";
        ctx.fillRect(0,0,360,360);

        ctx.fillStyle="#ef4444";
        ctx.fillRect(food.x*size,food.y*size,size-2,size-2);

        ctx.fillStyle="#48bb78";

        snake.forEach(s=>{
            ctx.fillRect(
                s.x*size,
                s.y*size,
                size-2,
                size-2
            );
        });
    }

    function tick(){

        const head={
            x:snake[0].x+dx,
            y:snake[0].y+dy
        };

        if(
            head.x<0||head.x>=cells||
            head.y<0||head.y>=cells||
            snake.some(s=>s.x===head.x&&s.y===head.y)
        ){

            clearInterval(timer);

            finishGame(
                "Snake Over!",
                `You collected ${score} food.`,
                score*10,
                score>=3,
                "🐍"
            );

            return;
        }

        snake.unshift(head);

        if(head.x===food.x&&head.y===food.y){

            score++;
            food=randomFood();
            beep(700);

        }else{
            snake.pop();
        }

        draw();
    }

    window.snakeDir=(direction)=>{

        if(direction==="up"&&dy!==1){
            dx=0;dy=-1;
        }

        if(direction==="down"&&dy!==-1){
            dx=0;dy=1;
        }

        if(direction==="left"&&dx!==1){
            dx=-1;dy=0;
        }

        if(direction==="right"&&dx!==-1){
            dx=1;dy=0;
        }
    };

    window.onkeydown=(e)=>{

        const map={
            ArrowUp:"up",
            ArrowDown:"down",
            ArrowLeft:"left",
            ArrowRight:"right"
        };

        if(map[e.key]){
            e.preventDefault();
            window.snakeDir(map[e.key]);
        }
    };

    draw();

    timer=setInterval(tick,110);

    cleanupGame=()=>{
        clearInterval(timer);
        window.onkeydown=null;
        delete window.snakeDir;
    };
}

============================================================ */

function gamePong(box){

    box.innerHTML=`

        <div class="game-box">

            <h2>🏓 Pong</h2>
            <p>Move your mouse over the canvas.</p>

            <canvas id="pongCanvas"
                width="600"
                height="350"></canvas>

        </div>
    `;

    const canvas=document.getElementById("pongCanvas");
    const ctx=canvas.getContext("2d");

    let playerY=140;
    let aiY=140;

    let ball={
        x:300,y:175,
        vx:5,vy:3
    };

    let running=true;
    let raf;

    canvas.onmousemove=e=>{

        const rect=canvas.getBoundingClientRect();

        playerY=
            (e.clientY-rect.top)*
            (canvas.height/rect.height)-40;
    };

    function loop(){

        if(!running)return;

        ball.x+=ball.vx;
        ball.y+=ball.vy;

        if(ball.y<0||ball.y>350)
            ball.vy*=-1;

        aiY+=(ball.y-aiY-40)*.08;

        if(
            ball.x<30 &&
            ball.y>playerY &&
            ball.y<playerY+80
        ){
            ball.vx=Math.abs(ball.vx);
        }

        if(
            ball.x>570 &&
            ball.y>aiY &&
            ball.y<aiY+80
        ){
            ball.vx=-Math.abs(ball.vx);
        }

        if(ball.x<0){

            running=false;

            finishGame(
                "Pong Defeat",
                "The AI scored.",
                0,
                false,
                "🏓"
            );

            return;
        }

        if(ball.x>600){

            running=false;

            finishGame(
                "Pong Victory!",
                "You scored against the AI.",
                100,
                true,
                "🏆"
            );

            return;
        }

        ctx.fillStyle="#111827";
        ctx.fillRect(0,0,600,350);

        ctx.fillStyle="#60a5fa";
        ctx.fillRect(15,playerY,15,80);

        ctx.fillStyle="#f97316";
        ctx.fillRect(570,aiY,15,80);

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(ball.x,ball.y,9,0,Math.PI*2);
        ctx.fill();

        raf=requestAnimationFrame(loop);
    }

    loop();

    cleanupGame=()=>{
        running=false;
        cancelAnimationFrame(raf);
        canvas.onmousemove=null;
    };
}

/* ============================================================
   GAME 12 — BREAKOUT
============================================================ */

function gameBreakout(box){

    box.innerHTML=`

        <div class="game-box">
            <h2>🧱 Breakout</h2>
            <p>Move the paddle with your mouse.</p>
            <canvas id="breakCanvas"
                width="600"
                height="400"></canvas>
        </div>
    `;

    const canvas=document.getElementById("breakCanvas");
    const ctx=canvas.getContext("2d");

    let paddle=250;
    let x=300,y=340;
    let vx=4,vy=-4;
    let bricks=[];

    for(let r=0;r<5;r++){
        for(let c=0;c<10;c++){
            bricks.push({
                x:20+c*56,
                y:30+r*25,
                alive:true
            });
        }
    }

    let running=true;
    let raf;

    canvas.onmousemove=e=>{

        const rect=canvas.getBoundingClientRect();

        paddle=
            (e.clientX-rect.left)*
            (canvas.width/rect.width)-50;
    };

    function loop(){

        if(!running)return;

        x+=vx;
        y+=vy;

        if(x<5||x>595)vx*=-1;
        if(y<5)vy*=-1;

        if(
            y>350 &&
            y<380 &&
            x>paddle &&
            x<paddle+100
        ){
            vy=-Math.abs(vy);
        }

        for(const b of bricks){

            if(
                b.alive &&
                x>b.x &&
                x<b.x+50 &&
                y>b.y &&
                y<b.y+18
            ){
                b.alive=false;
                vy*=-1;
                break;
            }
        }

        if(y>400){

            running=false;

            finishGame(
                "Breakout Over",
                "The ball missed the paddle.",
                0,
                false,
                "❌"
            );

            return;
        }

        if(bricks.every(b=>!b.alive)){

            running=false;

            finishGame(
                "Stage Cleared!",
                "All bricks destroyed.",
                150,
                true,
                "🧱"
            );

            return;
        }

        ctx.fillStyle="#111827";
        ctx.fillRect(0,0,600,400);

        bricks.forEach(b=>{

            if(b.alive){

                ctx.fillStyle="#facc15";
                ctx.fillRect(b.x,b.y,50,18);
            }
        });

        ctx.fillStyle="#60a5fa";
        ctx.fillRect(paddle,375,100,10);

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(x,y,7,0,Math.PI*2);
        ctx.fill();

        raf=requestAnimationFrame(loop);
    }

    loop();

    cleanupGame=()=>{
        running=false;
        cancelAnimationFrame(raf);
        canvas.onmousemove=null;
    };
}

/* ============================================================
   GAME 13 — FLAPPY
============================================================ */

function gameFlappy(box){

    box.innerHTML=`

        <div class="game-box">

            <h2>🐦 Flappy Bird</h2>

            <canvas id="flappyCanvas"
                width="420"
                height="600"></canvas>

            <button class="btn primary"
                style="margin-top:15px"
                onclick="window.flap()">
                🪽 FLAP
            </button>

        </div>
    `;

    const canvas=document.getElementById("flappyCanvas");
    const ctx=canvas.getContext("2d");

    let bird={x:90,y:280,vy:0};
    let pipes=[];
    let frame=0;
    let score=0;
    let running=true;
    let raf;

    function flap(){
        bird.vy=-7;
    }

    window.flap=flap;

    window.onkeydown=e=>{
        if(e.code==="Space"){
            e.preventDefault();
            flap();
        }
    };

    function loop(){

        if(!running)return;

        frame++;

        bird.vy+=.35;
        bird.y+=bird.vy;

        if(frame%100===0){

            const gap=170;
            const top=80+Math.random()*230;

            pipes.push({
                x:420,
                top,
                bottom:top+gap,
                passed:false
            });
        }

        pipes.forEach(p=>{
            p.x-=3;
        });

        pipes=pipes.filter(p=>p.x>-70);

        for(const p of pipes){

            if(
                bird.x+16>p.x &&
                bird.x-16<p.x+55 &&
                (bird.y-16<p.top ||
                 bird.y+16>p.bottom)
            ){
                gameOver();
                return;
            }

            if(!p.passed&&p.x+55<bird.x){

                p.passed=true;
                score++;
            }
        }

        if(bird.y<0||bird.y>600){
            gameOver();
            return;
        }

        ctx.fillStyle="#7dd3fc";
        ctx.fillRect(0,0,420,600);

        ctx.fillStyle="#4ade80";

        pipes.forEach(p=>{
            ctx.fillRect(p.x,0,55,p.top);
            ctx.fillRect(p.x,p.bottom,55,600-p.bottom);
        });

        ctx.fillStyle="#facc15";
        ctx.beginPath();
        ctx.arc(bird.x,bird.y,16,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#111827";
        ctx.font="24px Arial";
        ctx.fillText(`Score: ${score}`,15,30);

        raf=requestAnimationFrame(loop);
    }

    function gameOver(){

        running=false;

        finishGame(
            "Flappy Over!",
            `You passed ${score} pipes.`,
            score*15,
            score>=3,
            "🐦"
        );
    }

    loop();

    cleanupGame=()=>{
        running=false;
        cancelAnimationFrame(raf);
        window.onkeydown=null;
        delete window.flap;
    };
}

   GAME 14 — SPACE SHOOTER
============================================================ */

function gameSpace(box){

    box.innerHTML=`

        <div class="game-box">

            <h2>🚀 Space Shooter</h2>

            <canvas id="spaceCanvas"
                width="600"
                height="450"></canvas>

            <p>Move with ← → and shoot with Space.</p>

        </div>
    `;

    const canvas=document.getElementById("spaceCanvas");
    const ctx=canvas.getContext("2d");

    let ship={x:280,y:390};
    let bullets=[];
    let enemies=[];
    let score=0;
    let keys={};
    let running=true;
    let raf;

    window.onkeydown=e=>{
        keys[e.key]=true;

        if(e.code==="Space"){
            e.preventDefault();

            bullets.push({
                x:ship.x+20,
                y:ship.y
            });
        }
    };

    window.onkeyup=e=>{
        keys[e.key]=false;
    };

    function loop(){

        if(!running)return;

        if(keys.ArrowLeft)
            ship.x-=6;

        if(keys.ArrowRight)
            ship.x+=6;

        ship.x=Math.max(0,Math.min(560,ship.x));

        bullets.forEach(b=>b.y-=8);

        bullets=bullets.filter(b=>b.y>0);

        if(Math.random()<.025){

            enemies.push({
                x:Math.random()*560,
                y:-30
            });
        }

        enemies.forEach(e=>e.y+=2);

        for(const bullet of bullets){

            for(const enemy of enemies){

                if(
                    bullet.x>enemy.x &&
                    bullet.x<enemy.x+40 &&
                    bullet.y>enemy.y &&
                    bullet.y<enemy.y+30
                ){
                    enemy.dead=true;
                    bullet.dead=true;
                    score++;
                }
            }
        }

        enemies=enemies.filter(e=>!e.dead&&e.y<450);
        bullets=bullets.filter(b=>!b.dead);

        if(enemies.some(e=>
            e.y>360&&
            Math.abs(e.x-ship.x)<45
        )){

            running=false;

            finishGame(
                "Ship Destroyed!",
                `You destroyed ${score} enemies.`,
                score*10,
                score>=5,
                "🚀"
            );

            return;
        }

        ctx.fillStyle="#050816";
        ctx.fillRect(0,0,600,450);

        ctx.fillStyle="#fff";

        for(let i=0;i<50;i++){
            const sx=(i*97)%600;
            const sy=(i*53)%450;
            ctx.fillRect(sx,sy,2,2);
        }

        ctx.fillStyle="#60a5fa";
        ctx.fillRect(ship.x,ship.y,40,25);

        ctx.fillStyle="#facc15";

        bullets.forEach(b=>
            ctx.fillRect(b.x,b.y,4,12)
        );

        ctx.fillStyle="#ef4444";

        enemies.forEach(e=>
            ctx.fillRect(e.x,e.y,40,30)
        );

        ctx.fillStyle="white";
        ctx.font="20px Arial";
        ctx.fillText(`Score: ${score}`,15,25);

        raf=requestAnimationFrame(loop);
    }

    loop();

    cleanupGame=()=>{
        running=false;
        cancelAnimationFrame(raf);
        window.onkeydown=null;
        window.onkeyup=null;
    };
}

/* ============================================================
   GAME 20 — SIMON
============================================================ */

function gameSimon(box){

    const colors=[
        ["red","#ef4444"],
        ["blue","#3b82f6"],
        ["green","#22c55e"],
        ["yellow","#eab308"]
    ];

    let sequence=[];
    let playerIndex=0;
    let round=0;
    let accepting=false;

    box.innerHTML=`

        <div class="game-box">

            <h2>🎵 Simon Says</h2>

            <p id="simonStatus">Watch the sequence.</p>

            <div style="
                display:grid;
                grid-template-columns:repeat(2,120px);
                gap:12px;
                justify-content:center">

                ${colors.map((c,i)=>`

                    <button id="simon${i}"
                        onclick="window.simonClick(${i})"
                        style="
                        width:120px;
                        height:120px;
                        border:0;
                        border-radius:20px;
                        background:${c[1]}">
                    </button>

                `).join("")}

            </div>
        </div>
    `;

    function addRound(){

        playerIndex=0;
        accepting=false;

        sequence.push(
            Math.floor(Math.random()*4)
        );

        showSequence(0);
    }

    function flash(i){

        const el=document.getElementById(`simon${i}`);

        el.style.filter="brightness(2)";

        setTimeout(()=>{
            el.style.filter="";
        },250);
    }

    function showSequence(i){

        if(i>=sequence.length){

            accepting=true;

            document.getElementById("simonStatus")
                .textContent="Your turn!";

            return;
        }

        flash(sequence[i]);

        setTimeout(
            ()=>showSequence(i+1),
            500
        );
    }

    window.simonClick=(i)=>{

        if(!accepting)return;

        flash(i);

        if(i!==sequence[playerIndex]){

            finishGame(
                "Simon Over!",
                `You reached round ${round}.`,
                round*25,
                false,
                "🎵"
            );

            return;
        }

        playerIndex++;

        if(playerIndex===sequence.length){

            round++;

            if(round>=6){

                finishGame(
                    "Simon Master!",
                    "You completed six rounds.",
                    180,
                    true,
                    "🎵"
                );

                return;
            }

            accepting=false;

            setTimeout(addRound,600);
        }
    };

    addRound();

    cleanupGame=()=>{
        delete window.simonClick;
    };
}

/* ============================================================
   GAME 22 — CIPHER
============================================================ */

function gameCipher(box){

    const code=
        Array.from({length:4},
        ()=>Math.floor(Math.random()*10)).join("");

    let attempts=0;

    box.innerHTML=`

        <div class="game-box">

            <h2>🔐 Cipher Breaker</h2>

            <p>Guess the 4-digit code.</p>

            <input id="cipherInput"
                class="game-input"
                maxlength="4"
                inputmode="numeric"
                placeholder="0000">

            <button class="btn primary"
                onclick="window.cipherGuess()">
                Unlock
            </button>

            <div id="cipherHistory"
                style="margin-top:15px"></div>

        </div>
    `;

    window.cipherGuess=()=>{

        const input=document
            .getElementById("cipherInput")
            .value;

        if(!/^\d{4}$/.test(input))return;

        attempts++;

        let exact=0;

        for(let i=0;i<4;i++){

            if(input[i]===code[i])exact++;
        }

        const row=document.createElement("div");

        row.style.padding="8px";
        row.style.margin="5px";
        row.style.borderRadius="8px";
        row.style.background="var(--panel2)";

        row.textContent=
            `${input} — ${exact}/4 exact`;

        document
            .getElementById("cipherHistory")
            .appendChild(row);

        if(exact===4){

            finishGame(
                "Cipher Cracked!",
                `Solved in ${attempts} attempts.`,
                Math.max(30,150-attempts*10),
                true,
                "🔐"
            );
        }
    };

    cleanupGame=()=>{
        delete window.cipherGuess;
    };
}

                    onclick="window.checkSudoku()">

            </div>
        `;
    }

    window.checkSudoku=()=>{

        const inputs=
            [...document.querySelectorAll("[data-sudoku]")];

        let correct=true;

        inputs.forEach((input,i)=>{

            const value=
                Number(input.value||0);

            if(value!==solution[i]){

        if(correct){

            );

        delete window.checkSudoku;
