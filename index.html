<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Games Arena</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
:root {
    --bg: #0b1020;
    --bg2: #11182d;
    --card: #151e35;
    --card2: #1b2642;
    --text: #f5f7ff;
    --muted: #9ca8c4;
    --border: #293653;
    --accent: #7c5cff;
    --accent2: #5b8cff;
    --success: #31d07c;
    --danger: #ff5d73;
    --warning: #ffc857;
    --shadow: 0 15px 40px rgba(0,0,0,.25);
}

body.light {
    --bg: #f3f5fb;
    --bg2: #ffffff;
    --card: #ffffff;
    --card2: #f0f3fa;
    --text: #151a2d;
    --muted: #68718a;
    --border: #dce2ef;
    --shadow: 0 12px 30px rgba(31,41,55,.10);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

#app {
    min-height: 100vh;
}

.hidden {
    display: none !important;
}

/* LOGIN */

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(circle at 20% 20%, rgba(124,92,255,.22), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(91,140,255,.18), transparent 35%),
        var(--bg);
}

.login-box {
    width: 100%;
    max-width: 430px;
    padding: 35px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    text-align: center;
}

.logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    font-size: 40px;
}

.login-box h1 {
    margin: 0;
    font-size: 30px;
}

.login-box p {
    color: var(--muted);
}

.login-input {
    width: 100%;
    margin-top: 12px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    outline: none;
}

.login-input:focus {
    border-color: var(--accent);
}

.login-btn {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-weight: 800;
}

.login-hint {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
}

/* APP */

.app-shell {
    min-height: 100vh;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 22px;
    background: rgba(11,16,32,.88);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
}

body.light .topbar {
    background: rgba(255,255,255,.88);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 900;
}

.brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,var(--accent),var(--accent2));
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-btn,
.profile-mini {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 11px;
    padding: 8px 11px;
}

.profile-mini {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
}

.main {
    width: 100%;
    max-width: 1250px;
    margin: auto;
    padding: 28px 20px 60px;
}

/* HOME */

.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
    padding: 28px;
    border-radius: 25px;
    background:
        linear-gradient(135deg, rgba(124,92,255,.20), rgba(91,140,255,.08)),
        var(--card);
    border: 1px solid var(--border);
}

.hero h1 {
    margin: 0 0 7px;
    font-size: 34px;
}

.hero p {
    margin: 0;
    color: var(--muted);
}

.stats {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.stat {
    padding: 9px 13px;
    border-radius: 12px;
    background: var(--card2);
    border: 1px solid var(--border);
    font-size: 13px;
}

/* GAMES */

.games-page {
    width: 100%;
}

.games-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 30px;
}

.games-header h1 {
    margin: 0;
    font-size: 34px;
}

.games-header p {
    margin: 6px 0 0;
    color: var(--muted);
}

.small-profile-btn {
    border: 1px solid var(--border);
    padding: 9px 14px;
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    font-weight: 700;
}

.game-section {
    margin-bottom: 38px;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
}

.section-title > span {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 23px;
}

.section-title h2 {
    margin: 0;
    font-size: 22px;
}

.section-title p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 13px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 14px;
}

.game-card {
    width: 100%;
    min-height: 110px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    padding: 17px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
    color: var(--text);
    transition: .2s;
}

.game-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: var(--shadow);
}

.game-icon {
    width: 55px;
    min-width: 55px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    background: var(--bg2);
    font-size: 27px;
}

.game-card-info {
    flex: 1;
}

.game-card-info h3 {
    margin: 0 0 5px;
    font-size: 16px;
}

.game-card-info p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
}

.play-arrow {
    font-size: 22px;
    opacity: .45;
}

.online-card {
    border-color: rgba(49,208,124,.35);
}

.online-status {
    display: block;
    margin-top: 7px;
    font-size: 9px;
    font-weight: 800;
    color: var(--success);
}

/* GAME SCREEN */

.game-container {
    max-width: 900px;
    margin: auto;
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.game-header h1 {
    margin: 0;
}

.back-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 12px;
}

.game-panel {
    padding: 25px;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

.center {
    text-align: center;
}

.big-word {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 10px;
    margin: 25px 0;
}

.hint {
    color: var(--muted);
}

.big-number {
    font-size: 65px;
    font-weight: 900;
}

.game-input {
    width: 100%;
    max-width: 500px;
    padding: 14px;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    outline: none;
}

.primary-btn,
.secondary-btn,
.danger-btn {
    border: none;
    padding: 11px 16px;
    border-radius: 12px;
    font-weight: 800;
}

.primary-btn {
    background: var(--accent);
    color: white;
}

.secondary-btn {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
}

.danger-btn {
    background: var(--danger);
    color: white;
}

.button-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 18px;
}

/* LETTER BUTTONS */

.letter-grid {
    display: grid;
    grid-template-columns: repeat(9,1fr);
    gap: 7px;
    max-width: 650px;
    margin: 20px auto;
}

.letter-btn {
    padding: 10px 4px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--card2);
    color: var(--text);
}

.letter-btn.used {
    opacity: .35;
}

/* TRIVIA */

.question {
    font-size: 23px;
    font-weight: 800;
    margin: 20px 0;
}

.answer-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
}

.answer-btn {
    padding: 15px;
    text-align: left;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
}

.answer-btn:hover {
    border-color: var(--accent);
}

/* CHESS */

.chess-board {
    width: min(80vw, 560px);
    aspect-ratio: 1;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(8,1fr);
    border: 5px solid var(--border);
}

.chess-square {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(23px,6vw,48px);
    border: none;
    padding: 0;
}

.chess-square.light-square {
    background: #f0d9b5;
}

.chess-square.dark-square {
    background: #b58863;
}

.chess-square.selected {
    outline: 4px solid #ffe45e;
    outline-offset: -4px;
}

/* ONLINE */

.room-box {
    max-width: 650px;
    margin: auto;
    text-align: center;
}

.room-id {
    margin: 15px auto;
    padding: 15px;
    border-radius: 13px;
    background: var(--bg2);
    border: 1px dashed var(--border);
    font-weight: 800;
    word-break: break-all;
}

/* CARDS */

.info-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 13px;
}

.info-card {
    padding: 20px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--card);
}

.info-card h3 {
    margin-top: 0;
}

/* PROFILE */

.profile-card {
    max-width: 600px;
    margin: auto;
    text-align: center;
}

.avatar-big {
    width: 95px;
    height: 95px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    border-radius: 30px;
    background: var(--card2);
    font-size: 52px;
    border: 1px solid var(--border);
}

/* SHOP */

.shop-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 14px;
}

.shop-item {
    padding: 20px;
    text-align: center;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--border);
}

.shop-avatar {
    font-size: 45px;
    margin: 10px;
}

/* ACHIEVEMENTS */

.achievement {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 17px;
    margin-bottom: 10px;
    border-radius: 15px;
    background: var(--card);
    border: 1px solid var(--border);
}

.achievement.locked {
    opacity: .4;
}

.achievement-icon {
    font-size: 32px;
}

/* TOAST */

#toastContainer {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 9999;
}

.toast {
    margin-top: 8px;
    padding: 13px 17px;
    border-radius: 13px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

/* RESPONSIVE */

@media(max-width:900px) {
    .game-grid,
    .shop-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .info-grid {
        grid-template-columns: 1fr;
    }
}

@media(max-width:600px) {
    .topbar {
        padding: 10px 12px;
    }

    .brand span:last-child {
        display: none;
    }

    .main {
        padding: 18px 12px 40px;
    }

    .hero,
    .games-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .game-grid,
    .shop-grid,
    .answer-grid {
        grid-template-columns: 1fr;
    }

    .letter-grid {
        grid-template-columns: repeat(7,1fr);
    }

    .big-word {
        font-size: 29px;
        letter-spacing: 5px;
    }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="toastContainer"></div>

<script>
/* =========================================================
   WORD GAMES ARENA
   ========================================================= */

const LOGIN_ID = "Ahmed";
const LOGIN_PASSWORD = "123456";

const STORAGE_KEY = "WGA_AHMED_PROFILE";

let profile = null;
let currentGame = "home";
let selectedAvatar = "😀";

let gameSession = 0;
const activeTimers = new Set();

let hangmanState = null;
let scrambleState = null;
let rushState = null;
let triviaState = null;
let masterState = null;
let duelState = null;
let chessState = null;

let peer = null;
let onlineConnection = null;
let onlineRole = null;
let onlineMode = null;
let onlineState = null;


/* =========================================================
   TIMER PROTECTION
   This prevents old game timers from changing the page.
   ========================================================= */

function stopAllTimers() {
    activeTimers.forEach(id => {
        clearTimeout(id);
        clearInterval(id);
    });

    activeTimers.clear();
}

function newSession() {
    gameSession++;
    stopAllTimers();
    return gameSession;
}

function safeTimeout(callback, delay, session = gameSession) {
    const id = setTimeout(() => {
        activeTimers.delete(id);

        if (session !== gameSession) {
            return;
        }

        callback();
    }, delay);

    activeTimers.add(id);
    return id;
}

function safeInterval(callback, delay, session = gameSession) {
    const id = setInterval(() => {

        if (session !== gameSession) {
            clearInterval(id);
            activeTimers.delete(id);
            return;
        }

        callback();

    }, delay);

    activeTimers.add(id);
    return id;
}


/* =========================================================
   PROFILE
   ========================================================= */

function defaultProfile() {
    return {
        username: LOGIN_ID,
        xp: 0,
        coins: 100,
        level: 1,
        wins: 0,
        losses: 0,
        games: 0,
        streak: 0,
        bestStreak: 0,
        avatar: "😀",
        unlockedAvatars: ["😀"],
        achievements: [],
        dailyClaimed: "",
        theme: "dark",
        sound: true
    };
}

function loadProfile() {

    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
        profile = defaultProfile();
        saveProfile();
        return;
    }

    try {
        profile = JSON.parse(raw);

        if (!profile.unlockedAvatars) {
            profile.unlockedAvatars = ["😀"];
        }

        if (!profile.achievements) {
            profile.achievements = [];
        }

    } catch {
        profile = defaultProfile();
        saveProfile();
    }
}

function saveProfile() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
}

function xpNeeded() {
    return profile.level * 100;
}

function addReward(xp, coins) {

    profile.xp += xp;
    profile.coins += coins;

    while (profile.xp >= xpNeeded()) {
        profile.xp -= xpNeeded();
        profile.level++;
        profile.coins += 50;
        toast("🎉 Level Up! You reached Level " + profile.level);
    }

    profile.bestStreak = Math.max(profile.bestStreak, profile.streak);

    saveProfile();
    checkAchievements();
}

function recordWin() {
    profile.wins++;
    profile.games++;
    profile.streak++;
    addReward(30, 20);
}

function recordLoss() {
    profile.losses++;
    profile.games++;
    profile.streak = 0;
    addReward(10, 5);
}


/* =========================================================
   LOGIN
   ========================================================= */

function showLogin() {

    stopAllTimers();

    document.getElementById("app").innerHTML = `
        <div class="login-screen">

            <div class="login-box">

                <div class="logo">🎮</div>

                <h1>Word Games Arena</h1>

                <p>Welcome back, Ahmed!</p>

                <input
                    id="loginId"
                    class="login-input"
                    placeholder="ID"
                    autocomplete="username"
                >

                <input
                    id="loginPassword"
                    class="login-input"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <button class="login-btn" onclick="login()">
                    🚀 Enter Arena
                </button>

                <div class="login-hint">
                    ID: Ahmed &nbsp; • &nbsp; Password: 123456
                </div>

            </div>

        </div>
    `;
}

function login() {

    const id = document.getElementById("loginId").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (
        id.toLowerCase() !== LOGIN_ID.toLowerCase() ||
        password !== LOGIN_PASSWORD
    ) {
        toast("❌ Incorrect ID or password.");
        return;
    }

    loadProfile();

    profile.username = LOGIN_ID;

    saveProfile();

    enterApp();
}

function logout() {

    stopAllTimers();

    if (peer) {
        try {
            peer.destroy();
        } catch {}
    }

    peer = null;
    onlineConnection = null;

    showLogin();
}


/* =========================================================
   MAIN APP
   ========================================================= */

function enterApp() {

    document.getElementById("app").innerHTML = `
        <div class="app-shell">

            <header class="topbar">

                <div class="brand">
                    <div class="brand-icon">🎮</div>
                    <span>Word Games Arena</span>
                </div>

                <div class="top-actions">

                    <button
                        class="icon-btn"
                        onclick="toggleTheme()"
                        title="Theme"
                    >
                        🌙
                    </button>

                    <button
                        class="icon-btn"
                        onclick="toggleSound()"
                        title="Sound"
                    >
                        🔊
                    </button>

                    <button
                        class="profile-mini"
                        onclick="renderProfile()"
                    >
                        ${profile.avatar}
                        <span>${escapeHTML(profile.username)}</span>
                    </button>

                </div>

            </header>

            <main id="main" class="main"></main>

        </div>
    `;

    applyTheme();
    renderGames();
}


/* =========================================================
   NAVIGATION
   ========================================================= */

function goHome() {
    renderGames();
}

function renderGames() {

    newSession();
    currentGame = "home";

    document.getElementById("main").innerHTML = `

        <div class="games-page">

            <div class="games-header">

                <div>
                    <h1>🎮 Games</h1>
                    <p>Choose a game and start playing!</p>
                </div>

                <button
                    class="small-profile-btn"
                    onclick="renderProfile()"
                >
                    👤 Profile
                </button>

            </div>


            <!-- OFFLINE -->

            <section class="game-section">

                <div class="section-title">

                    <span>🎮</span>

                    <div>
                        <h2>Offline Games</h2>
                        <p>Play anytime — no internet required</p>
                    </div>

                </div>


                <div class="game-grid">

                    ${gameCard(
                        "🔤",
                        "Hangman",
                        "Guess the hidden word",
                        "hangman"
                    )}

                    ${gameCard(
                        "⚡",
                        "Letter Rush",
                        "Type words before time runs out",
                        "letterRush"
                    )}

                    ${gameCard(
                        "🧠",
                        "Trivia Blitz",
                        "Test your general knowledge",
                        "trivia"
                    )}

                    ${gameCard(
                        "♟️",
                        "Chess",
                        "Play chess on the same device",
                        "chess"
                    )}

                    ${gameCard(
                        "🧩",
                        "Word Master",
                        "Find the secret 5-letter word",
                        "master"
                    )}

                    ${gameCard(
                        "🔀",
                        "Word Scramble",
                        "Unscramble the letters",
                        "scramble"
                    )}

                </div>

            </section>


            <!-- LOCAL MULTIPLAYER -->

            <section class="game-section">

                <div class="section-title">

                    <span>👥</span>

                    <div>
                        <h2>Multiplayer Games</h2>
                        <p>Play with someone beside you</p>
                    </div>

                </div>

                <div class="game-grid">

                    ${gameCard(
                        "⚔️",
                        "Local Duel",
                        "Battle a friend on the same device",
                        "duel"
                    )}

                </div>

            </section>


            <!-- ONLINE -->

            <section class="game-section">

                <div class="section-title">

                    <span>🌐</span>

                    <div>
                        <h2>Online Games</h2>
                        <p>Challenge your friends online</p>
                    </div>

                </div>

                <div class="game-grid">

                    <button
                        class="game-card online-card"
                        onclick="renderOnlineLobby('chess')"
                    >

                        <div class="game-icon">♟️</div>

                        <div class="game-card-info">

                            <h3>Online Chess</h3>

                            <p>
                                Play chess with a friend online
                            </p>

                            <span class="online-status">
                                ● ONLINE
                            </span>

function startGame(type) {

    newSession();

    currentGame = type;

    if (type === "hangman") renderHangman();
    else if (type === "letterRush") renderLetterRush();
    else if (type === "trivia") renderTrivia();
    else if (type === "chess") renderChess();
    else if (type === "master") renderMaster();
    else if (type === "scramble") renderScramble();
    else if (type === "duel") renderDuel();
}

const hangmanWords = [
    ["PYTHON","Programming language"],
    ["COMPUTER","Electronic machine"],
    ["GITHUB","Code hosting platform"],
    ["SCHOOL","Place of learning"],
    ["PLANET","Object orbiting a star"],
    ["JAVASCRIPT","Web programming language"],
    ["KEYBOARD","Used for typing"],
    ["INTERNET","Global computer network"],
    ["PROGRAM","Set of instructions"],
    ["PUZZLE","Something you solve"],
    ["CHESS","Strategy board game"],
    ["MOBILE","Portable device"],
    ["BROWSER","Used to visit websites"],
    ["ROBOT","Programmable machine"]
];

function renderHangman() {

    const session = gameSession;

    const item =
        hangmanWords[
            Math.floor(Math.random() * hangmanWords.length)
        ];

    hangmanState = {
        word: item[0],
        hint: item[1],
        guessed: [],
        wrong: 0,
        maxWrong: 6,
        finished: false
    };

    drawHangman();

    void session;
}

function drawHangman() {

    const s = hangmanState;

    const display = s.word
        .split("")
        .map(letter =>
            s.guessed.includes(letter) ? letter : "_"
        )
        .join(" ");

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-header">

                <h1>🔤 Hangman</h1>

                <button class="back-btn" onclick="renderGames()">
                    ← Games
                </button>

            </div>

            <div class="game-panel center">

                <p class="hint">
                    Hint: ${escapeHTML(s.hint)}
                </p>

                <div class="big-word">
                    ${display}
                </div>

                <p>
                    ❤️ Lives:
                    ${"❤️".repeat(s.maxWrong - s.wrong)}
                    ${"🖤".repeat(s.wrong)}
                </p>

                <div class="letter-grid">

                    ${alphabet.split("").map(letter => `
                        <button
                            class="letter-btn ${s.guessed.includes(letter) ? "used" : ""}"
                            onclick="guessHangman('${letter}')"
                            ${s.guessed.includes(letter) ? "disabled" : ""}
                        >
                            ${letter}
                        </button>
                    `).join("")}

                </div>

                <div class="button-row">

                    <button
                        class="secondary-btn"
                        onclick="startGame('hangman')"
                    >
                        🔄 New Word
                    </button>

                </div>

            </div>

        </div>
    `;
}

function guessHangman(letter) {

    const s = hangmanState;

    if (s.finished || s.guessed.includes(letter)) return;

    s.guessed.push(letter);

    if (!s.word.includes(letter)) {
        s.wrong++;
    }

    const won = s.word
        .split("")
        .every(letter => s.guessed.includes(letter));

    if (won) {

        s.finished = true;

        recordWin();

        toast("🎉 You solved it!");

        drawHangman();

        safeTimeout(() => {
            startGame("hangman");
        }, 1800);

        return;
    }

    if (s.wrong >= s.maxWrong) {

        s.finished = true;

        recordLoss();

        toast("❌ Word was " + s.word);

        drawHangman();

        return;
    }

    drawHangman();
}

function shuffleWord(word) {

    return word
        .split("")
        .sort(() => Math.random() - .5)
        .join("");
}

function renderScramble() {

    const word =
        scrambleWords[
            Math.floor(Math.random() * scrambleWords.length)
        ];

    scrambleState = {
        word,
        scrambled: shuffleWord(word),
        score: 0,
        time: 30,
        finished: false
    };

    drawScramble();

    const session = gameSession;

    safeInterval(() => {

        if (scrambleState.finished) return;

        scrambleState.time--;

        drawScramble();

        if (scrambleState.time <= 0) {

            scrambleState.finished = true;

            recordLoss();

            toast("⏰ Time's up!");

        }

    }, 1000, session);
}

    const s = scrambleState;

    document.getElementById("main").innerHTML = `

function submitScramble() {

                justify-content:center;
                gap:5px;

                    if (letter === s.word[index]) {
                        cls = "background:#31d07c;color:white;";
                    } else if (s.word.includes(letter)) {
                        cls = "background:#ffc857;color:#111;";
                    } else {

                    }

                    return `
                        <div style="
                            width:45px;

                            display:flex;
                            align-items:center;
                            justify-content:center;
                            border-radius:8px;

                            ${cls}
                        ">
                            ${letter}
                        </div>
                    `;

                }).join("")}
            </div>
        `;

    }).join("");

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-header">

                <h1>🧩 Word Master</h1>

                <button class="back-btn" onclick="renderGames()">
                    ← Games
                </button>

            </div>

            <div class="game-panel center">

                <p>
                    Find the secret 5-letter word.
                </p>

                ${rows}

                <p>
                    Attempts left:
                    <b>${s.attempts}</b>
                </p>

                <input
                    id="masterInput"
                    class="game-input"
                    maxlength="5"

                    autocomplete="off"
                    onkeydown="if(event.key==='Enter')submitMaster()"
                    ${s.finished ? "disabled" : ""}
                >

                <div class="button-row">

                    <button
                        class="primary-btn"
                        onclick="submitMaster()"
                    >
                        Guess
                    </button>

                    <button
                        class="secondary-btn"
                        onclick="startGame('master')"
                    >
                        New Word
                    </button>

                </div>

            </div>

        </div>
    `;

    const input = document.getElementById("masterInput");

    if (input && !s.finished) {
        input.focus();
    }
}

function submitMaster() {

    const s = masterState;

    if (s.finished) return;

    const input = document.getElementById("masterInput");

    const guess = input.value.trim().toUpperCase();

    if (!/^[A-Z]{5}$/.test(guess)) {
        toast("⚠️ Enter exactly 5 letters.");
        return;
    }

    if (s.guesses.includes(guess)) {
        toast("⚠️ You already tried that.");
        return;
    }

    s.guesses.push(guess);
    s.attempts--;

    if (guess === s.word) {

        s.finished = true;

        recordWin();

        drawMaster();

        toast("🎉 You found the word!");

        return;
    }

    if (s.attempts <= 0) {

        s.finished = true;

        recordLoss();

        drawMaster();

        toast("❌ Word was " + s.word);

        return;

const chessPieces = {
    r:"♜",
    n:"♞",
    b:"♝",
    q:"♛",
    k:"♚",
    p:"♟",
    R:"♖",
    N:"♘",
    B:"♗",
    Q:"♕",
    K:"♔",
    P:"♙"
};

function initialChessBoard() {

    return [
        ["r","n","b","q","k","b","n","r"],
        ["p","p","p","p","p","p","p","p"],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["P","P","P","P","P","P","P","P"],
        ["R","N","B","Q","K","B","N","R"]
    ];
}

function renderChess() {

    chessState = {
        board: initialChessBoard(),
        turn: "w",
        selected: null,
        winner: null
    };

    drawChess();
}

function drawChess() {

    const s = chessState;

    const boardHTML = s.board.map((row,r) =>
        row.map((piece,c) => {

            const selected =
                s.selected &&
                s.selected.r === r &&
                s.selected.c === c;

            const squareColor =
                (r+c)%2===0
                ? "light-square"
                : "dark-square";

            return `
                <button
                    class="chess-square ${squareColor} ${selected ? "selected":""}"
                    onclick="clickChess(${r},${c})"
                >
                    ${chessPieces[piece] || ""}
                </button>
            `;

        }).join("")
    ).join("");

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-header">

                <h1>♟️ Chess</h1>

                <button class="back-btn" onclick="renderGames()">
                    ← Games
                </button>

            </div>

            <div class="game-panel center">

                <p>
                    ${
                        s.winner
                        ? "Winner: " + s.winner
                        : "Turn: " + (s.turn === "w" ? "White" : "Black")
                    }
                </p>

                <div class="chess-board">
                    ${boardHTML}
                </div>

                <button
                    class="secondary-btn"
                    onclick="startGame('chess')"
                >
                    🔄 New Chess Game
                </button>

            </div>

        </div>
    `;
}

function pieceColor(piece) {

    if (!piece) return null;

    return piece === piece.toUpperCase()
        ? "w"
        : "b";
}

function clickChess(r,c) {

    const s = chessState;

    if (s.winner) return;

    const piece = s.board[r][c];

    if (!s.selected) {

        if (pieceColor(piece) === s.turn) {

            s.selected = {r,c};

            drawChess();
        }

        return;
    }

    const from = s.selected;

    if (
        isChessMoveLegal(
            s.board,
            from.r,
            from.c,
            r,
            c,
            s.turn
        )
    ) {

        const movingPiece =
            s.board[from.r][from.c];

        const captured =
            s.board[r][c];

        s.board[r][c] = movingPiece;
        s.board[from.r][from.c] = "";

        s.selected = null;

        if (captured && captured.toLowerCase() === "k") {

            s.winner =
                s.turn === "w"
                ? "White"
                : "Black";

            recordWin();

        } else {

            s.turn =
                s.turn === "w"
                ? "b"
                : "w";
        }

        drawChess();

    } else {

        if (pieceColor(piece) === s.turn) {
            s.selected = {r,c};
            drawChess();
        } else {
            toast("❌ Illegal move");
        }
    }
}

function isChessMoveLegal(board,fr,fc,tr,tc,color) {

    const piece = board[fr][fc];

    if (!piece) return false;

    if (pieceColor(piece) !== color) {
        return false;
    }

    const target = board[tr][tc];

    if (target && pieceColor(target) === color) {
        return false;
    }

    const dr = tr-fr;
    const dc = tc-fc;

    const adr = Math.abs(dr);
    const adc = Math.abs(dc);

    const type = piece.toLowerCase();

    if (type === "p") {

        const direction =
            color === "w" ? -1 : 1;

        const startRow =
            color === "w" ? 6 : 1;

        if (
            dc === 0 &&
            dr === direction &&
            !target
        ) return true;

        if (
            dc === 0 &&
            fr === startRow &&
            dr === direction*2 &&
            !target &&
            !board[fr+direction][fc]
        ) return true;

        if (
            adr === 1 &&
            dc !== 0 &&
            dr === direction &&
            target
        ) return true;

        return false;
    }

    if (type === "n") {
        return (
            (adr === 2 && adc === 1) ||
            (adr === 1 && adc === 2)
        );
    }

    if (type === "k") {
        return adr <= 1 && adc <= 1;
    }

    if (type === "r") {
        if (dr !== 0 && dc !== 0) return false;

        return clearPath(
            board,
            fr,fc,tr,tc
        );
    }

    if (type === "b") {
        if (adr !== adc) return false;

        return clearPath(
            board,
            fr,fc,tr,tc
        );
    }

    if (type === "q") {

        const straight =
            dr === 0 || dc === 0;

        const diagonal =
            adr === adc;

        if (!straight && !diagonal) {
            return false;
        }

        return clearPath(
            board,
            fr,fc,tr,tc
        );
    }

    return false;
}

function clearPath(board,fr,fc,tr,tc) {

    const dr = Math.sign(tr-fr);
    const dc = Math.sign(tc-fc);

    let r = fr+dr;
    let c = fc+dc;

    while (r !== tr || c !== tc) {

        if (board[r][c]) {
            return false;
        }

        r += dr;
        c += dc;
    }

    return true;
}

function createOnlineRoom(mode) {

    if (typeof Peer === "undefined") {
        toast("❌ Online library failed to load.");
        return;
    }

    newSession();

    onlineRole = "host";
    onlineMode = mode;

    document.getElementById("main").innerHTML = `
        <div class="game-container">
            <div class="game-panel room-box center">
                <h1>🔄 Creating Room...</h1>
                <p class="hint">
                    Please wait...
                </p>
            </div>
        </div>
    `;

    peer = new Peer();

    peer.on("open", id => {

        const link =
            location.origin +
            location.pathname +
            "#room=" +
            encodeURIComponent(id) +
            "&game=" +
            encodeURIComponent(mode);

        document.getElementById("main").innerHTML = `

            <div class="game-container">

                <div class="game-panel room-box center">

                    <div style="font-size:55px">🌐</div>

                    <h1>Room Created</h1>

                            class="primary-btn"
                            onclick="copyText('${escapeAttribute(link)}')"
                        >
                            📋 Copy Link
                        </button>

                        <button
                            class="secondary-btn"
                            onclick="shareRoom('${escapeAttribute(link)}')"
                        >
                            📤 Share
                        </button>

                    </div>

                    <p class="hint">
                        Waiting for your friend...
                    </p>

                </div>

            </div>
        `;

    });

    peer.on("connection", connection => {

        onlineConnection = connection;

        setupOnlineConnection(connection);

    });

    peer.on("error", err => {

        toast("❌ " + err.type);

    });
}

function joinOnlineRoom(mode) {

    if (typeof Peer === "undefined") {
        toast("❌ Online library failed to load.");
        return;
    }

    const input =
        document.getElementById("roomInput");

    const roomId =
        input.value.trim();

    if (!roomId) {
        toast("⚠️ Enter a room ID.");
        return;
    }

    newSession();

    onlineRole = "guest";
    onlineMode = mode;

    peer = new Peer();

    peer.on("open", () => {

        onlineConnection =
            peer.connect(roomId);

        setupOnlineConnection(
            onlineConnection
        );

    });

    peer.on("error", err => {
        toast("❌ " + err.type);
    });
}

function setupOnlineConnection(connection) {

    connection.on("open", () => {

        toast("🟢 Connected!");

        connection.send({
            type: "hello",
            mode: onlineMode,
            role: onlineRole
        });

        if (onlineRole === "host") {

            safeTimeout(() => {

                if (onlineMode === "chess") {
                    startOnlineChessHost();
                } else {
                    startOnlineWordHost();
                }

            }, 500);

        }

    });

    connection.on("data", data => {

        handleOnlineData(data);

    });

    connection.on("close", () => {

        toast("🔴 Friend disconnected.");

    });

    connection.on("error", () => {

        toast("❌ Connection error.");

    });
}

const onlineWords = [
    "APPLE",
    "HOUSE",
    "MOUSE",
    "WATER",
    "PLANT",
    "LIGHT",
    "WORLD",
    "EARTH",
    "CLOUD",
    "PHONE",
    "CHAIR",
    "BRAIN",
    "SPACE",
    "TRAIN",
    "TIGER",
    "HORSE",
    "GREEN",
    "SMILE",
    "MUSIC",
    "STONE"
];

function startOnlineWordHost() {

    onlineState = {
        mode:"word",
        word: randomItem(onlineWords),
        hostScore: 0,
        guestScore: 0,
        time: 30,
        round: 1,
        finished:false
    };

    drawOnlineWord();

    sendOnlineWordState();

    const session = gameSession;

    safeInterval(() => {

        if (!onlineState || onlineState.finished) return;

        onlineState.time--;

        sendOnlineWordState();

        drawOnlineWord();

        if (onlineState.time <= 0) {

            onlineState.time = 30;
            onlineState.round++;
            onlineState.word = randomItem(onlineWords);

            sendOnlineWordState();

        }

    },1000,session);
}

function sendOnlineWordState() {

    if (!onlineConnection || !onlineState) return;

    onlineConnection.send({
        type:"wordState",
        state:onlineState
    });
}

function drawOnlineWord() {

    if (!onlineState) return;

    const myScore =
        onlineRole === "host"
        ? onlineState.hostScore
        : onlineState.guestScore;

    const opponentScore =
        onlineRole === "host"
        ? onlineState.guestScore
        : onlineState.hostScore;

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-header">

                <h1>🌐 Online Word Battle</h1>

                <button class="back-btn" onclick="renderGames()">
                    ← Exit
                </button>

            </div>

            <div class="game-panel center">

                <div class="stats">

                    <div class="stat">
                        🧑 You:
                        <b>${myScore}</b>
                    </div>

                    <div class="stat">
                        👤 Friend:
                        <b>${opponentScore}</b>
                    </div>

                    <div class="stat">
                        ⏱️
                        <b>${onlineState.time}s</b>
                    </div>

                </div>

                <p>
                    Round ${onlineState.round}
                </p>

                <div class="big-word">
                    ${onlineState.word}
                </div>

                <input
                    id="onlineWordInput"
                    class="game-input"
                    placeholder="Type the word"
                    autocomplete="off"
                    onkeydown="if(event.key==='Enter')submitOnlineWord()"
                >

                <div class="button-row">

                    <button
                        class="primary-btn"
                        onclick="submitOnlineWord()"
                    >
                        ⚡ Submit
                    </button>

                </div>

                <p class="hint">
                    First player to reach 5 points wins.
                </p>

            </div>

        </div>
    `;

    const input =
        document.getElementById("onlineWordInput");

    if (input) input.focus();
}

function submitOnlineWord() {

    if (!onlineState) return;

    const input =
        document.getElementById("onlineWordInput");

    const answer =
        input.value.trim().toUpperCase();

    if (!answer) return;

    if (onlineRole === "host") {

        processHostWordAnswer(answer);

    } else {

        if (!onlineConnection) return;

        onlineConnection.send({
            type:"wordGuess",
            answer
        });

        input.value = "";

    }
}

function processHostWordAnswer(answer) {

    if (!onlineState || onlineState.finished) return;

    if (answer !== onlineState.word) {

        toast("❌ Wrong!");

        return;
    }

    if (onlineRole === "host") {

        onlineState.hostScore++;

    } else {

        onlineState.guestScore++;

    }

    toast("✅ Correct!");

    if (
        onlineState.hostScore >= 5 ||
        onlineState.guestScore >= 5
    ) {

        onlineState.finished = true;

        const hostWon =
            onlineState.hostScore >= 5;

        if (onlineRole === "host") {

            if (hostWon) {
                recordWin();
            } else {
                recordLoss();
            }

        }

        sendOnlineWordState();

        drawOnlineWordResult();

        return;
    }

    onlineState.time = 30;
    onlineState.round++;
    onlineState.word = randomItem(onlineWords);

    sendOnlineWordState();

    drawOnlineWord();
}

function drawOnlineWordResult() {

    const hostWon =
        onlineState.hostScore >= 5;

    const iWon =
        (onlineRole === "host" && hostWon) ||
        (onlineRole === "guest" && !hostWon);

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-panel center">

                <div style="font-size:60px">
                    ${iWon ? "🏆" : "😅"}
                </div>

                <h1>
                    ${iWon ? "You Win!" : "You Lost!"}
                </h1>

                <p>
                    You:
                    ${
                        onlineRole === "host"
                        ? onlineState.hostScore
                        : onlineState.guestScore
                    }
                    &nbsp; — &nbsp;
                    Friend:
                    ${
                        onlineRole === "host"
                        ? onlineState.guestScore
                        : onlineState.hostScore
                    }
                </p>

                <button
                    class="secondary-btn"
                    onclick="renderGames()"
                >
                    ← Games
                </button>

            </div>

        </div>
    `;
}

function startOnlineChessHost() {

    onlineState = {
        mode:"chess",
        board:initialChessBoard(),
        turn:"w",
        winner:null
    };

    drawOnlineChess();

    if (onlineConnection) {

        onlineConnection.send({
            type:"chessState",
            state:onlineState
        });

    }
}

function drawOnlineChess() {

    if (!onlineState) return;

    const myColor =
        onlineRole === "host"
        ? "w"
        : "b";

    const boardHTML =
        onlineState.board.map((row,r) =>
            row.map((piece,c) => {

                const selected =
                    onlineState.selected &&
                    onlineState.selected.r === r &&
                    onlineState.selected.c === c;

                const color =
                    (r+c)%2===0
                    ? "light-square"
                    : "dark-square";

                return `
                    <button
                        class="chess-square ${color} ${selected ? "selected":""}"
                        onclick="clickOnlineChess(${r},${c})"
                    >
                        ${chessPieces[piece] || ""}
                    </button>
                `;

            }).join("")
        ).join("");

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-header">

                <h1>🌐 Online Chess</h1>

                <button class="back-btn" onclick="renderGames()">
                    ← Exit
                </button>

            </div>

            <div class="game-panel center">

                <p>
                    You are:
                    <b>
                        ${myColor === "w" ? "White" : "Black"}
                    </b>
                </p>

                <p>
                    Turn:
                    <b>
                        ${onlineState.turn === "w"
                            ? "White"
                            : "Black"}
                    </b>
                </p>

                <div class="chess-board">
                    ${boardHTML}
                </div>

                ${
                    onlineState.winner
                    ? `<h2>🏆 ${onlineState.winner === myColor ? "You Win!" : "You Lose!"}</h2>`
                    : ""
                }

            </div>

        </div>
    `;
}

function clickOnlineChess(r,c) {

    if (!onlineState || onlineState.winner) return;

    const myColor =
        onlineRole === "host"
        ? "w"
        : "b";

    if (onlineState.turn !== myColor) {

        toast("⏳ Wait for your turn.");

        return;
    }

    if (!onlineState.selected) {

        const piece =
            onlineState.board[r][c];

        if (pieceColor(piece) === myColor) {

            onlineState.selected = {r,c};

            drawOnlineChess();

        }

        return;
    }

    const from =
        onlineState.selected;

    if (
        isChessMoveLegal(
            onlineState.board,
            from.r,
            from.c,
            r,
            c,
            myColor
        )
    ) {

        const captured =
            onlineState.board[r][c];

        const moving =
            onlineState.board[from.r][from.c];

        onlineState.board[r][c] = moving;
        onlineState.board[from.r][from.c] = "";

        onlineState.selected = null;

        if (
            captured &&
            captured.toLowerCase() === "k"
        ) {

            onlineState.winner = myColor;

        } else {

            onlineState.turn =
                myColor === "w"
                ? "b"
                : "w";
        }

        if (onlineConnection) {

            onlineConnection.send({
                type:"chessState",
                state:onlineState
            });

        }

        drawOnlineChess();

    } else {

        const clicked =
            onlineState.board[r][c];

        if (pieceColor(clicked) === myColor) {

            onlineState.selected = {r,c};

            drawOnlineChess();

        } else {

            toast("❌ Illegal move.");

        }
    }
}


/* =========================================================
   ONLINE DATA
   ========================================================= */

function handleOnlineData(data) {

    if (!data) return;

    if (data.type === "hello") {

        if (
            onlineRole === "host" &&
            data.mode === onlineMode
        ) {

            if (onlineMode === "chess") {
                startOnlineChessHost();
            } else {
                startOnlineWordHost();
            }

        }

        return;
    }


    if (data.type === "wordState") {

        onlineState = data.state;

        if (onlineState.finished) {

            drawOnlineWordResult();

        } else {

            drawOnlineWord();

        }

        return;
    }


    if (data.type === "wordGuess") {

        if (
            onlineRole === "host" &&
            onlineMode === "word"
        ) {

            const answer =
                String(data.answer || "")
                    .toUpperCase();

            const word =
                onlineState.word;

            if (answer === word) {

                onlineState.guestScore++;

                if (
                    onlineState.guestScore >= 5
                ) {

                    onlineState.finished = true;

                    sendOnlineWordState();

                    drawOnlineWordResult();

                    return;
                }

                onlineState.round++;
                onlineState.time = 30;
                onlineState.word =
                    randomItem(onlineWords);

                sendOnlineWordState();

                drawOnlineWord();

            } else {

                if (onlineConnection) {

                    onlineConnection.send({
                        type:"wrongGuess"
                    });

                }

            }

        }

        return;
    }


    if (data.type === "wrongGuess") {

        toast("❌ Wrong answer!");

        return;
    }


    if (data.type === "chessState") {

        onlineState = data.state;

        drawOnlineChess();

        return;
    }
}

function renderDaily() {

    newSession();

    const claimed =
        profile.dailyClaimed === todayKey();

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-header">

                <h1>📅 Daily Challenges</h1>

                <button class="back-btn" onclick="renderGames()">
                    ← Games
                </button>

            </div>

            <div class="game-panel center">

                <div style="font-size:60px">🎯</div>

                <h2>Today's Challenge</h2>

                <p>
                    Play any game today and claim your daily reward.
                </p>

                <div class="info-grid">

                    <div class="info-card">
                        <h3>⭐ Reward</h3>
                        <p>+50 XP</p>
                    </div>

                    <div class="info-card">
                        <h3>🪙 Reward</h3>
                        <p>+50 Coins</p>
                    </div>

                    <div class="info-card">
                        <h3>🔥 Streak</h3>
                        <p>Keep your daily streak alive!</p>
                    </div>

                </div>

                <div class="button-row">

                    <button
                        class="primary-btn"
                        onclick="claimDaily()"
                        ${claimed ? "disabled" : ""}
                    >
                        ${claimed
                            ? "✅ Claimed Today"
                            : "🎁 Claim Reward"}
                    </button>

                </div>

            </div>

        </div>
    `;
}

function claimDaily() {

    if (profile.dailyClaimed === todayKey()) {
        toast("Already claimed today.");
        return;
    }

    profile.dailyClaimed = todayKey();

    profile.streak++;

    addReward(50,50);

    saveProfile();

    toast("🎁 Daily reward claimed!");

    renderDaily();
}


/* =========================================================
   SHOP
   ========================================================= */

const shopItems = [
    {avatar:"😎", name:"Cool Face", price:100},
    {avatar:"🤖", name:"Robot", price:150},
    {avatar:"🦊", name:"Fox", price:200},
    {avatar:"🐼", name:"Panda", price:250},
    {avatar:"🦁", name:"Lion", price:300},
    {avatar:"👑", name:"King", price:500}
];

function renderShop() {

    newSession();

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-header">

                <h1>🛒 Shop</h1>

                <button class="back-btn" onclick="renderGames()">
                    ← Games
                </button>

            </div>

            <div class="stats" style="margin-bottom:18px">
                <div class="stat">
                    🪙 Coins:
                    <b>${profile.coins}</b>
                </div>
            </div>

            <div class="shop-grid">

                ${shopItems.map((item,index) => {

                    const unlocked =
                        profile.unlockedAvatars.includes(
                            item.avatar
                        );

                    return `

                        <div class="shop-item">

                            <div class="shop-avatar">
                                ${item.avatar}
                            </div>

                            <h3>
                                ${item.name}
                            </h3>

                            <p>
                                ${
                                    unlocked
                                    ? "Unlocked"
                                    : "🪙 " + item.price
                                }
                            </p>

                            <button
                                class="${
                                    unlocked
                                    ? "secondary-btn"
                                    : "primary-btn"
                                }"
                                onclick="buyAvatar(${index})"
                                ${unlocked ? "disabled" : ""}
                            >
                                ${
                                    unlocked
                                    ? "✅ Owned"
                                    : "Buy"
                                }
                            </button>

                        </div>
                    `;

                }).join("")}

            </div>

        </div>
    `;
}

function buyAvatar(index) {

    const item = shopItems[index];

    if (profile.unlockedAvatars.includes(item.avatar)) {
        return;
    }

    if (profile.coins < item.price) {

        toast("❌ Not enough coins.");

        return;
    }

    profile.coins -= item.price;

    profile.unlockedAvatars.push(item.avatar);

    saveProfile();

    toast("🎉 Avatar unlocked!");

    renderShop();
}


/* =========================================================
   ACHIEVEMENTS
   ========================================================= */

const achievementList = [
    {
        id:"first",
        icon:"🎮",
        title:"First Game",
        description:"Play your first game."
    },
    {
        id:"winner",
        icon:"🏆",
        title:"Winner",
        description:"Win a game."
    },
    {
        id:"level5",
        icon:"⭐",
        title:"Rising Star",
        description:"Reach Level 5."
    },
    {
        id:"coins500",
        icon:"🪙",
        title:"Coin Collector",
        description:"Have 500 coins."
    },
    {
        id:"streak5",
        icon:"🔥",
        title:"On Fire",
        description:"Reach a 5 game streak."
    }
];

function checkAchievements() {

    const unlocked = profile.achievements;

    const checks = {
        first: profile.games >= 1,
        winner: profile.wins >= 1,
        level5: profile.level >= 5,
        coins500: profile.coins >= 500,
        streak5: profile.bestStreak >= 5
    };

    Object.keys(checks).forEach(id => {

        if (
            checks[id] &&
            !unlocked.includes(id)
        ) {

            unlocked.push(id);

            profile.coins += 25;

            toast("🏆 Achievement unlocked!");

        }

    });

    saveProfile();
}

function renderAchievements() {

    newSession();

    checkAchievements();

    document.getElementById("main").innerHTML = `

        <div class="game-container">

            <div class="game-header">

                <h1>🏆 Achievements</h1>

                <button class="back-btn" onclick="renderGames()">
                    ← Games
                </button>

            </div>

            ${achievementList.map(item => {

                const unlocked =
                    profile.achievements.includes(item.id);

                return `

                    <div class="achievement ${
                        unlocked ? "" : "locked"
                    }">

                        <div class="achievement-icon">
                            ${item.icon}
                        </div>

                        <div>

                            <h3 style="margin:0">
                                ${item.title}

                            </p>

                        </div>

                            ${unlocked ? "✅" : "🔒"}
                        </div>

                    </div>
                `;

            }).join("")}

        </div>
    `;
}

function changeAvatar(avatar) {

    if (!profile.unlockedAvatars.includes(avatar)) {
        return;
    }

    profile.avatar = avatar;

    saveProfile();

    toast("✅ Avatar changed.");

    renderProfile();
}


/* =========================================================
   THEME + SOUND
   ========================================================= */

function toggleTheme() {

    profile.theme =
        profile.theme === "dark"
        ? "light"
        : "dark";

    applyTheme();

    saveProfile();
}

function applyTheme() {

    document.body.classList.toggle(
        "light",
        profile.theme === "light"
    );
}

function toggleSound() {

    profile.sound = !profile.sound;

    saveProfile();

    toast(
        profile.sound
        ? "🔊 Sound enabled"
        : "🔇 Sound disabled"
    );
}


/* =========================================================
   RESET
   ========================================================= */

function resetProgress() {

    const yes =
        confirm(
            "Are you sure you want to reset all game progress?"
        );

    if (!yes) return;

    localStorage.removeItem(STORAGE_KEY);

    profile = defaultProfile();

    saveProfile();

    toast("Progress reset.");

    renderGames();
}


/* =========================================================
   UTILITIES
   ========================================================= */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];
}

function escapeHTML(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttribute(value) {

    return String(value)
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");
}

function toast(message) {

    const container =
        document.getElementById("toastContainer");

    if (!container) return;

    const item =
        document.createElement("div");

    item.className = "toast";

    item.textContent = message;

    container.appendChild(item);

    setTimeout(() => {

        item.remove();

    },2500);
}

function copyText(text) {

    navigator.clipboard.writeText(text)
        .then(() => {
            toast("📋 Room link copied!");
        })
        .catch(() => {
            toast("Copy failed. Copy the link manually.");
        });
}

function shareRoom(link) {

    if (navigator.share) {

        navigator.share({
            title:"Word Games Arena",
            text:"Join my game!",
            url:link
        });

    } else {

        copyText(link);

    }
}


/* =========================================================
   URL ROOM AUTO JOIN
   ========================================================= */

function getRoomFromURL() {

    const hash =
        location.hash.substring(1);

    const params =
        new URLSearchParams(hash);

    return params.get("room");
}

function getGameFromURL() {

    const hash =
        location.hash.substring(1);

    const params =
        new URLSearchParams(hash);

    return params.get("game");
}

function autoJoinRoom() {

    const room =
        getRoomFromURL();

    const game =
        getGameFromURL();

    if (!room || !game) return;

    safeTimeout(() => {

        renderOnlineLobby(game);

        const input =
            document.getElementById("roomInput");

        if (input) {

            input.value =
                room;

            safeTimeout(() => {

                joinOnlineRoom(game);

            },300);

        }

    },500);
}

   STARTUP
   ========================================================= */

document.addEventListener("keydown", event => {

    if (
        event.key === "Escape" &&
        currentGame !== "home"
    ) {

        renderGames();

    }

});

loadProfile();

/*
   If already logged in before, show login first anyway.
   The user must enter the requested credentials.
*/
showLogin();
