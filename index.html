<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Games Arena</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070b16;
    --panel:#101729;
    --panel2:#151e34;
    --text:#f5f7ff;
    --muted:#9ca9c7;
    --primary:#00d4ff;
    --secondary:#7c3aed;
    --green:#22c55e;
    --red:#ef4444;
    --yellow:#facc15;
    --border:rgba(255,255,255,.09);
    --shadow:0 20px 50px rgba(0,0,0,.35);
}

body.light{
    --bg:#eef3ff;
    --panel:#ffffff;
    --panel2:#f4f7ff;
    --text:#101828;
    --muted:#667085;
    --border:rgba(16,24,40,.1);
    --shadow:0 15px 40px rgba(15,23,42,.12);
}

body{
    min-height:100vh;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:
        radial-gradient(circle at top left,rgba(0,212,255,.13),transparent 35%),
        radial-gradient(circle at bottom right,rgba(124,58,237,.13),transparent 35%),
        var(--bg);
    color:var(--text);
    transition:.25s;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-card{
    width:min(450px,100%);
    background:rgba(16,23,41,.9);
    border:1px solid var(--border);
    border-radius:28px;
    padding:35px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(15px);
}

body.light .login-card{
    background:rgba(255,255,255,.92);
}

.logo{
    text-align:center;
    font-size:55px;
    margin-bottom:8px;
}

.login-title{
    text-align:center;
    font-size:32px;
    font-weight:900;
}

.login-subtitle{
    text-align:center;
    color:var(--muted);
    margin:8px 0 25px;
}

.avatar-picker{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
    margin:15px 0 20px;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:15px;
    border:2px solid transparent;
    background:var(--panel2);
    font-size:25px;
}

.avatar.selected{
    border-color:var(--primary);
    box-shadow:0 0 18px rgba(0,212,255,.3);
}

.input{
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:13px;
    outline:none;
    margin-bottom:12px;
}

.input:focus{
    border-color:var(--primary);
}

.primary-btn,
.play-btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    color:white;
    font-weight:800;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    transition:.2s;
}

.primary-btn:hover,
.play-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.back-btn{
    width:100%;
    padding:13px;
    border-radius:13px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    font-weight:700;
}

.login-info{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:15px;
}

/* APP */

.app{
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:13px 20px;
    border-bottom:1px solid var(--border);
    background:rgba(7,11,22,.82);
    backdrop-filter:blur(18px);
}

body.light .topbar{
    background:rgba(255,255,255,.85);
}

.brand{
    font-weight:900;
    font-size:20px;
}

.mini-profile{
    display:flex;
    align-items:center;
    gap:9px;
    cursor:pointer;
}

.mini-avatar{
    width:40px;
    height:40px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:var(--panel2);
    font-size:21px;
}

.mini-name{
    font-weight:800;
}

.content{
    width:min(1200px,100%);
    margin:auto;
    padding:25px 18px 60px;
}

.hero{
    text-align:center;
    padding:25px 10px 30px;
}

.hero h1{
    font-size:clamp(35px,7vw,65px);
    font-weight:1000;
}

.gradient-text{
    background:linear-gradient(90deg,var(--primary),#a78bfa);
    background-clip:text;
    color:transparent;
}

.hero p{
    color:var(--muted);
    margin-top:8px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:25px;
}

.stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:17px;
    text-align:center;
}

.stat-icon{
    font-size:25px;
}

.stat-label{
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    margin-top:4px;
}

.stat-value{
    font-size:24px;
    font-weight:900;
    margin-top:5px;
}

.game-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.game-card{
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:22px;
    padding:22px;
    transition:.2s;
}

.game-card:hover{
    transform:translateY(-4px);
    border-color:rgba(0,212,255,.35);
}

.game-icon{
    font-size:40px;
}

.game-card h3{
    margin-top:12px;
}

.game-card p{
    color:var(--muted);
    min-height:42px;
    margin-top:6px;
    font-size:14px;
}

.game-card button{
    margin-top:15px;
    width:100%;
    padding:11px;
    border-radius:11px;
    border:0;
    background:var(--panel2);
    color:var(--text);
    font-weight:800;
}

.section-title{
    margin:30px 0 15px;
}

/* GAME */

.game-shell{
    max-width:850px;
    margin:auto;
}

.game-title{
    font-size:34px;
    font-weight:950;
    text-align:center;
    margin-bottom:20px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
}

.badge{
    background:var(--panel2);
    border:1px solid var(--border);
    padding:8px 12px;
    border-radius:100px;
    font-size:13px;
    font-weight:800;
}

.hint-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    text-align:center;
    margin-bottom:15px;
}

.scramble-word{
    text-align:center;
    font-size:clamp(28px,7vw,52px);
    font-weight:1000;
    letter-spacing:7px;
    margin:25px 0;
}

.answer-row{
    display:flex;
    gap:10px;
}

.answer-row .input{
    margin:0;
}

.answer-row .play-btn{
    width:180px;
}

.letters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:22px;
}

.letter-btn{
    width:44px;
    height:44px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel2);
    color:var(--text);
    font-weight:900;
}

.letter-btn:disabled{
    opacity:.35;
}

.word-display{
    text-align:center;
    font-size:clamp(30px,7vw,55px);
    letter-spacing:12px;
    font-weight:900;
    margin:25px 0;
}

.question{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    text-align:center;
    font-size:22px;
    font-weight:800;
    margin-bottom:15px;
}

.answers{
    display:grid;
    gap:10px;
}

.answer{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    text-align:left;
    font-weight:700;
}

.answer:hover:not(:disabled){
    border-color:var(--primary);
}

.answer.correct{
    border-color:var(--green);
    background:rgba(34,197,94,.15);
}

.answer.wrong{
    border-color:var(--red);
    background:rgba(239,68,68,.15);
}

/* MASTER */

.master-grid{
    display:grid;
    grid-template-columns:repeat(5,58px);
    justify-content:center;
    gap:7px;
    margin:25px auto;
}

.tile{
    width:58px;
    height:58px;
    display:grid;
    place-items:center;
    border:2px solid var(--border);
    border-radius:8px;
    background:var(--panel);
    font-size:25px;
    font-weight:1000;
}

.tile.correct{
    background:#16a34a;
    border-color:#16a34a;
    color:white;
}

.tile.present{
    background:#ca8a04;
    border-color:#ca8a04;
    color:white;
}

.tile.absent{
    background:#374151;
    border-color:#374151;
    color:white;
}

/* CHESS */

.chess-wrap{
    max-width:650px;
    margin:auto;
}

.chess-status{
    text-align:center;
    font-size:20px;
    font-weight:900;
    margin-bottom:15px;
}

.chess-board{
    width:min(600px,95vw);
    aspect-ratio:1;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    border:5px solid #333;
    border-radius:8px;
    overflow:hidden;
}

.square{
    display:grid;
    place-items:center;
    font-size:clamp(25px,7vw,55px);
    cursor:pointer;
    user-select:none;
    position:relative;
}

.light-square{
    background:#f0d9b5;
}

.dark-square{
    background:#b58863;
}

.selected-square{
    box-shadow:inset 0 0 0 5px #00d4ff;
}

.legal-square::after{
    content:"";
    width:20%;
    height:20%;
    background:rgba(0,212,255,.65);
    border-radius:50%;
    position:absolute;
}

.capture-square{
    box-shadow:inset 0 0 0 5px rgba(239,68,68,.8);
}

.chess-controls{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.chess-controls button{
    flex:1;
    padding:12px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--panel);
    color:var(--text);
    font-weight:800;
}

/* ONLINE */

.online-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    text-align:center;
    margin-bottom:15px;
}

.online-code{
    font-size:28px;
    font-weight:1000;
    padding:18px;
    margin:15px 0;
    background:var(--panel2);
    border-radius:14px;
    word-break:break-all;
}

.share-link{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:10px;
}

.connection{
    background:var(--panel);
    border:1px solid var(--border);
    padding:13px;
    border-radius:13px;
    text-align:center;
    color:var(--muted);
    margin-top:15px;
}

.online-dot{
    width:9px;
    height:9px;
    display:inline-block;
    border-radius:50%;
    background:#f59e0b;
    margin-right:5px;
}

.online-dot.connected{
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
}

/* SHOP */

.shop-grid,
.achievement-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.shop-item,
.achievement{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    text-align:center;
}

.shop-icon,
.achievement-icon{
    font-size:55px;
}

.shop-item button{
    width:100%;
    margin-top:12px;
    padding:11px;
    border-radius:10px;
    border:0;
    background:var(--primary);
    color:#001018;
    font-weight:900;
}

.shop-item button:disabled{
    opacity:.5;
}

.achievement.locked{
    opacity:.45;
}

/* PROFILE */

.profile-card{
    max-width:800px;
    margin:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:25px;
    padding:25px;
}

.profile-head{
    display:flex;
    align-items:center;
    gap:20px;
}

.big-avatar{
    width:90px;
    height:90px;
    display:grid;
    place-items:center;
    border-radius:25px;
    background:var(--panel2);
    font-size:55px;
}

.rank{
    color:var(--primary);
    font-weight:900;
    margin-top:5px;
}

.xp-bar{
    height:13px;
    border-radius:20px;
    background:var(--panel2);
    overflow:hidden;
    margin:20px 0;
}

.xp-fill{
    height:100%;
    background:linear-gradient(90deg,var(--primary),var(--secondary));
}

.profile-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

/* TOAST */

.toast-container{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:100;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.toast{
    background:#111827;
    color:white;
    border:1px solid rgba(255,255,255,.15);
    padding:13px 16px;
    border-radius:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    animation:toastIn .2s ease;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:850px){
    .game-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .shop-grid,
    .achievement-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .topbar{
        padding:10px 12px;
    }

    .mini-name{
        display:none;
    }

    .game-grid,
    .shop-grid,
    .achievement-grid,
    .profile-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .login-card{
        padding:25px 18px;
    }

    .answer-row{
        flex-direction:column;
    }

    .answer-row .play-btn{
        width:100%;
    }

    .master-grid{
        grid-template-columns:repeat(5,48px);
    }

    .tile{
        width:48px;
        height:48px;
    }
}
</style>
</head>

/* =========================================================
   GAME SESSION / TIMER SAFETY
   This fixes the old problem where a previous game
   could suddenly appear after switching games.
========================================================= */

let gameSession=0;
const timers=new Set();

function newSession(){

    gameSession++;

    stopAllTimers();

    cleanupPeer();

    return gameSession;
}

function safeTimer(callback,delay,session){

    const id=setTimeout(()=>{

        timers.delete(id);

        if(session!==gameSession){
            return;
        }

        callback();

    },delay);

    timers.add(id);

    return id;
}

function safeInterval(callback,delay,session){

    const id=setInterval(()=>{

        if(session!==gameSession){

            clearInterval(id);
            timers.delete(id);

            return;
        }

        callback();

    },delay);

    timers.add(id);

    return id;
}

function stopAllTimers(){

    timers.forEach(id=>{

        clearTimeout(id);
        clearInterval(id);

    });

    timers.clear();
}

function defaultProfile(){

    return {
        username:"Ahmed",
        pin:"123456",
        avatar:selectedAvatar,

        xp:0,
        level:1,
        coins:300,

        wins:0,
        losses:0,
        totalGames:0,

        streak:0,
        bestStreak:0,

        correctAnswers:0,

        hangmanBest:0,
        scrambleBest:0,
        rushBest:0,
        triviaBest:0,
        masterBest:0,

        dailyDate:"",
        dailyCompleted:false,

        unlockedAvatars:avatars.slice(0,3),

        achievements:[]
    };
}

function save(){

    if(!profile)return;

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(profile)
    );

}

function xpForNextLevel(){

    return profile.level*500;
}

function reward(xp,coins){

    profile.xp+=xp;
    profile.coins+=coins;

    while(profile.xp>=xpForNextLevel()){

        profile.xp-=xpForNextLevel();
        profile.level++;

        toast(`⭐ LEVEL ${profile.level}!`);

    }

    if(profile.streak>profile.bestStreak){
        profile.bestStreak=profile.streak;
    }

    save();
    checkAchievements();
}

function getRank(){

    if(profile.level>=20)return"🏆 Grand Master";
    if(profile.level>=10)return"💎 Diamond";
    if(profile.level>=7)return"🔥 Expert";
    if(profile.level>=5)return"⭐ Pro";
    if(profile.level>=3)return"🎯 Skilled";

    return"🌱 Beginner";
}

function setupAvatars(){

    const picker=document.getElementById("avatarPicker");

    picker.innerHTML=avatars.map((avatar,index)=>`

        <button
        class="avatar ${index===0?"selected":""}"
        onclick="selectAvatar('${avatar}',this)">
        ${avatar}
        </button>

    `).join("");

}

function selectAvatar(avatar,element){

    selectedAvatar=avatar;

    document
        .querySelectorAll(".avatar")
        .forEach(x=>x.classList.remove("selected"));

    element.classList.add("selected");

}

function login(){

    const username=
        document
        .getElementById("usernameInput")
        .value
        .trim();

    const pin=
        document
        .getElementById("pinInput")
        .value
        .trim();

    if(username!=="Ahmed" || pin!=="123456"){

        toast("❌ Incorrect login. Use Ahmed / 123456.");

        return;
    }

    const savedRaw=
        localStorage.getItem(STORAGE_KEY);

    if(savedRaw){

        try{

            profile=JSON.parse(savedRaw);

            profile.username="Ahmed";
            profile.pin="123456";

            if(!profile.avatar){
                profile.avatar=selectedAvatar;
            }

            save();

        }catch(e){

            profile=defaultProfile();

            save();

        }

    }else{

        profile=defaultProfile();

        save();

    }

    selectedAvatar=profile.avatar;

    enterApp();

}

function enterApp(){

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    updateMiniProfile();

    renderHome();

}

function logout(){

    newSession();

    profile=null;

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    document
        .getElementById("usernameInput")
        .value="";

    document
        .getElementById("pinInput")
        .value="";

}

/* =========================================================
   HANGMAN
========================================================= */

let hangman={};

function renderHangman(){

    const item=
        words[
            Math.floor(Math.random()*words.length)
        ];

    hangman={
        word:item.word,
        hint:item.hint,
        guessed:[],
        mistakes:0,
        max:6,
        session:gameSession
    };

    drawHangman();

}

function drawHangman(){

    if(hangman.session!==gameSession)return;

    const display=
        hangman.word
        .split("")
        .map(letter=>
            hangman.guessed.includes(letter)
            ?letter
            :"_"
        )
        .join(" ");

    const won=
        !display.includes("_");

    if(won){

        profile.wins++;
        profile.totalGames++;
        profile.streak++;

        profile.hangmanBest=
            Math.max(
                profile.hangmanBest,
                100-hangman.mistakes*10
            );

        reward(60,30);

        achievement("first_win");

        toast("🏆 Hangman solved!");

        const s=gameSession;

        safeTimer(()=>{
            renderHangman();
        },1200,s);

        return;
    }

    if(hangman.mistakes>=hangman.max){

        profile.losses++;
        profile.totalGames++;
        profile.streak=0;

        save();

        gameShell("🪢 Hangman",`

            <div class="hint-box">
                💀 The word was
                <b>${hangman.word}</b>
            </div>

            <button
            class="primary-btn"
            onclick="renderHangman()">
                🔄 PLAY AGAIN
            </button>

        `);

        return;
    }

    const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    gameShell("🪢 Hangman",`

        <div class="game-info">

            <span class="badge">
                ❌ Mistakes:
                ${hangman.mistakes}/${hangman.max}
            </span>

        </div>

        <div class="hint-box">
            💡 ${hangman.hint}
        </div>

        <div class="word-display">
            ${display}
        </div>

        <div class="letters">

            ${alphabet.split("").map(letter=>`

                <button
                class="letter-btn"
                onclick="guessHangman('${letter}')"
                ${hangman.guessed.includes(letter)?"disabled":""}>
                    ${letter}
                </button>

            `).join("")}

        </div>

    `);

}

function guessHangman(letter){

    if(hangman.session!==gameSession)return;

    if(hangman.guessed.includes(letter))return;

    hangman.guessed.push(letter);

    if(!hangman.word.includes(letter)){

        hangman.mistakes++;

        sound(180,80);

    }else{

        sound(700,70);

    }

    drawHangman();

}


/* =========================================================
   SCRAMBLE
========================================================= */

let scramble={};

function shuffle(text){

    return text
        .split("")
        .sort(()=>Math.random()-.5)
        .join("");
}

function renderScramble(){

    clearScrambleState();

    const word=
        scrambleWords[
            Math.floor(Math.random()*scrambleWords.length)
        ];

    scramble={
        word,
        time:30,
        score:0,
        session:gameSession,
        timer:null
    };

    drawScramble();

    const s=gameSession;

    scramble.timer=
        safeInterval(()=>{

            if(scramble.session!==gameSession)return;

            scramble.time--;

            if(scramble.time<=0){

                clearScrambleState();

                profile.losses++;
                profile.totalGames++;
                profile.streak=0;

                save();

                gameShell("🔀 Scramble",`

                    <div class="hint-box">
                        ⏰ Time's up!
                        The word was
                        <b>${scramble.word}</b>
                    </div>

                    <button
                    class="primary-btn"
                    onclick="renderScramble()">
                        🔄 PLAY AGAIN
                    </button>

                `);

                return;
            }

            drawScramble();

        },1000,s);

}

function clearScrambleState(){

    if(scramble.timer){

        clearInterval(scramble.timer);
        timers.delete(scramble.timer);

        scramble.timer=null;
    }

}

function drawScramble(){

    if(scramble.session!==gameSession)return;

    gameShell("🔀 Word Scramble",`

let master={};

function renderMaster(){

    master={
        word:
            masterWords[
                Math.floor(Math.random()*masterWords.length)
            ],
        guesses:[],
        max:6,
        session:gameSession
    };

    drawMaster();

}

function drawMaster(){

    if(master.session!==gameSession)return;

    const rows=[];

    for(let r=0;r<master.max;r++){

        const guess=
            master.guesses[r]||"";

        let row="";

        for(let i=0;i<5;i++){

            const letter=
                guess[i]||"";

            let cls="";

            if(letter){

                if(master.word[i]===letter){

                    cls="correct";

                }else if(master.word.includes(letter)){

                    cls="present";

                }else{

                    cls="absent";

                }

            }

            row+=`

                <div class="tile ${cls}">
                    ${letter}
                </div>

            `;

        }

        rows.push(row);

    }

    gameShell("🟩 Word Master",`

        <div class="game-info">

            <span class="badge">
                Attempts:
                ${master.guesses.length}/${master.max}
            </span>

        </div>

        <div class="master-grid">
            ${rows.join("")}
        </div>

        <div class="answer-row">

            <input
            id="masterInput"
            class="input"
            maxlength="5"
            placeholder="5-letter word"
            onkeydown="if(event.key==='Enter')submitMaster()">

            <button
            class="play-btn"
            onclick="submitMaster()">
                ENTER
            </button>

        </div>

        <p style="
            text-align:center;
            color:var(--muted);
            margin-top:15px">
            🟩 Correct &nbsp;
            🟨 Wrong position &nbsp;
            ⬛ Not included
        </p>

    `);

    const input=document.getElementById("masterInput");

    if(input)input.focus();

}

function submitMaster(){

    if(master.session!==gameSession)return;

    const input=document.getElementById("masterInput");

    if(!input)return;

    const guess=
        input.value.trim().toUpperCase();

    if(!/^[A-Z]{5}$/.test(guess)){

        toast("⚠️ Enter exactly 5 letters.");

        return;
    }

    master.guesses.push(guess);

    if(guess===master.word){

        profile.wins++;
        profile.totalGames++;
        profile.streak++;

        const score=
            Math.max(
                100,
                600-master.guesses.length*80
            );

        profile.masterBest=
            Math.max(
                profile.masterBest,
                score
            );

        reward(80,40);

        achievement("master");

        toast(`🟩 PERFECT! +${score}`);

        const s=gameSession;

        safeTimer(()=>{
            renderMaster();
        },1300,s);

        return;
    }

    if(master.guesses.length>=master.max){

        profile.losses++;
        profile.totalGames++;
        profile.streak=0;

        save();

        toast(`The word was ${master.word}`);

        const s=gameSession;

        safeTimer(()=>{
            renderMaster();
        },1300,s);

        return;
    }

    drawMaster();

}

/* =========================================================
   CHESS
========================================================= */

const chessPieces={

    w:{
        k:"♔",
        q:"♕",
        r:"♖",
        b:"♗",
        n:"♘",
        p:"♙"
    },

    b:{
        k:"♚",
        q:"♛",
        r:"♜",
        b:"♝",
        n:"♞",
        p:"♟"
    }

};

let chess={};

function initialChessBoard(){

    return [

        [
            {c:"b",t:"r"},
            {c:"b",t:"n"},
            {c:"b",t:"b"},
            {c:"b",t:"q"},
            {c:"b",t:"k"},
            {c:"b",t:"b"},
            {c:"b",t:"n"},
            {c:"b",t:"r"}
        ],

        [
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"}
        ],

        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],

        [
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"}
        ],

        [
            {c:"w",t:"r"},
            {c:"w",t:"n"},
            {c:"w",t:"b"},
            {c:"w",t:"q"},
            {c:"w",t:"k"},
            {c:"w",t:"b"},
            {c:"w",t:"n"},
            {c:"w",t:"r"}
        ]

    ];

}

function renderChess(){

    chess={
        board:initialChessBoard(),
        turn:"w",
        selected:null,
        over:false,
        session:gameSession
    };

    drawChess();

}

function drawChess(){

    if(chess.session!==gameSession)return;

    let html="";

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const piece=
                chess.board[r][c];

            const selected=
                chess.selected &&
                chess.selected.r===r &&
                chess.selected.c===c;

            const legal=
                chess.selected &&
                isChessLegal(
                    chess.selected.r,
                    chess.selected.c,
                    r,
                    c
                );

            const cls=[

                (r+c)%2===0
                ?"light-square"
                :"dark-square",

                selected
                ?"selected-square"
                :"",

                legal
                ?"legal-square"
                :"",

                piece &&
                chess.selected &&
                legal &&
                piece.c!==
                chess.board[
                    chess.selected.r
                ][
                    chess.selected.c
                ]?.c
                ?"capture-square"
                :""

            ].join(" ");

            html+=`

                <div
                class="square ${cls}"
                onclick="clickChessSquare(${r},${c})">

                    ${
                        piece
                        ?chessPieces[piece.c][piece.t]
                        :""
                    }

                </div>

            `;

        }

    }

    gameShell("♟️ Chess Arena",`

        <div class="chess-wrap">

            <div class="chess-status">
                ${chess.turn==="w"
                ?"⚪ White"
                :"⚫ Black"}
                turn
            </div>

            <div class="chess-board">
                ${html}
            </div>

            <div class="chess-controls">

                <button onclick="renderChess()">
                    🔄 New Game
                </button>

            </div>

        </div>

    `);

}

function clickChessSquare(r,c){

    if(chess.over)return;

    const piece=
        chess.board[r][c];

    if(!chess.selected){

        if(
            piece &&
            piece.c===chess.turn
        ){

            chess.selected={r,c};

            drawChess();

        }

        return;
    }

    const sr=chess.selected.r;
    const sc=chess.selected.c;

    if(sr===r&&sc===c){

        chess.selected=null;

        drawChess();

        return;
    }

    if(
        piece &&
        piece.c===chess.turn
    ){

        chess.selected={r,c};

        drawChess();

        return;
    }

    if(isChessLegal(sr,sc,r,c)){

        moveChess(sr,sc,r,c);

    }

}

function insideBoard(r,c){

    return(
        r>=0&&
        r<8&&
        c>=0&&
        c<8
    );

}

function clearPath(sr,sc,tr,tc){

    const dr=Math.sign(tr-sr);
    const dc=Math.sign(tc-sc);

    let r=sr+dr;
    let c=sc+dc;

    while(r!==tr||c!==tc){

        if(chess.board[r][c])return false;

        r+=dr;
        c+=dc;

    }

    return true;

}

function isChessLegal(sr,sc,tr,tc){

    if(
        !insideBoard(sr,sc)||
        !insideBoard(tr,tc)
    )return false;

    const piece=
        chess.board[sr][sc];

    if(!piece)return false;

    if(piece.c!==chess.turn)return false;

    const target=
        chess.board[tr][tc];

    if(
        target &&
        target.c===piece.c
    )return false;

    const dr=tr-sr;
    const dc=tc-sc;

    const adr=Math.abs(dr);
    const adc=Math.abs(dc);

    if(piece.t==="p"){

        const direction=
            piece.c==="w"?-1:1;

        const start=
            piece.c==="w"?6:1;

        if(
            dc===0 &&
            dr===direction &&
            !target
        )return true;

        if(
            dc===0 &&
            sr===start &&
            dr===direction*2 &&
            !target &&
            !chess.board[sr+direction][sc]
        )return true;

        if(
            adc===1 &&
            dr===direction &&
            target &&
            target.c!==piece.c
        )return true;

        return false;
    }

    if(piece.t==="n"){

        return(
            adr===2&&adc===1||
            adr===1&&adc===2
        );

    }

    if(piece.t==="k"){

        return adr<=1&&adc<=1;

    }

    if(piece.t==="r"){

        if(dr!==0&&dc!==0)return false;

        return clearPath(
            sr,sc,tr,tc
        );

    }

    if(piece.t==="b"){

        if(adr!==adc)return false;

        return clearPath(
            sr,sc,tr,tc
        );

    }

    if(piece.t==="q"){

        if(
            dr!==0&&
            dc!==0&&
            adr!==adc
        )return false;

        return clearPath(
            sr,sc,tr,tc
        );

    }

    return false;

}

function moveChess(sr,sc,tr,tc){

    const piece=
        chess.board[sr][sc];

    const captured=
        chess.board[tr][tc];

    chess.board[tr][tc]=piece;
    chess.board[sr][sc]=null;

    if(
        piece.t==="p" &&
        (tr===0||tr===7)
    ){

        piece.t="q";

        toast("👑 Pawn promoted!");

    }

    chess.turn=
        chess.turn==="w"
        ?"b"
        :"w";

    chess.selected=null;

    sound(
        captured?350:550,
        70
    );

    drawChess();

}

function createOnlineRoom(mode){

    online.mode=mode;
    online.role="host";
    online.session=gameSession;

        document.getElementById("onlineStatus");

    if(status){

        status.innerHTML=`

        `;

    }

    peer=new Peer();

    peer.on("open",id=>{

        if(online.session!==gameSession)return;

        online.roomId=id;

        const roomURL=
            location.href.split("#")[0]+
            "#room="+
            encodeURIComponent(id)+
            "&game="+
            encodeURIComponent(mode);

        const box=
            document.querySelector(".online-box");

        if(box){

            box.innerHTML=`

                    color:var(--muted);

                </div>

                class="share-link"
                readonly

                    display:flex;
                    gap:10px;

                    class="primary-btn"

                    class="back-btn"
                    onclick="shareRoomLink()">

                    </button>

        if(online.session!==gameSession)return;

        );

function copyRoomLink(){

    const input=
        document.getElementById("shareURL");

    if(!input)return;

    navigator.clipboard
    ?.writeText(input.value)
    .then(()=>{

        toast("🔗 Room link copied!");

    })
    .catch(()=>{

        input.select();

        document.execCommand("copy");

        toast("🔗 Room link copied!");

    });

}

function shareRoomLink(){

    const input=
        document.getElementById("shareURL");

    if(!input)return;

    if(navigator.share){

        navigator.share({

            title:"Word Games Arena",
            text:"Join my online game!",

function joinOnlineRoom(mode){

        document.getElementById("roomInput");

    if(!input)return;

    const roomId=
        input.value.trim();

    if(!roomId){

        toast("⚠️ Enter a room ID.");

    }

    newSession();

    online.mode=mode;
    online.role="guest";
    online.roomId=roomId;
    online.session=gameSession;

    setOnlineStatus(
        "Connecting to room...",
        false
    );

    peer=new Peer();

    peer.on("open",()=>{

        if(online.session!==gameSession)return;

        connection=
            peer.connect(
                roomId,
                {reliable:true}
            );

        setupConnection(
            connection,
            false
        );

    });

    peer.on("error",err=>{

        console.error(err);

        setOnlineStatus(
            "❌ Could not connect: "+err.type,
            false
        );

    });

}


/* =========================================================
   CONNECTION
========================================================= */

function setupConnection(
    conn,
    isHost
){

    connection=conn;

    conn.on("open",()=>{

        if(online.session!==gameSession)return;

        online.connected=true;

        setOnlineStatus(
            "🟢 Connected to opponent!",
            true
        );

        sendOnline({

            type:"hello",
            username:profile.username,
            avatar:profile.avatar,
            mode:online.mode

        });

        if(isHost){

            const s=gameSession;

            safeTimer(()=>{

                if(
                    online.mode==="chess"
                ){

                    startOnlineChessHost();

                }else{

                    startOnlineWordHost();

                }

            },700,s);

        }

    });

    conn.on("data",data=>{

        if(
            online.session!==gameSession
        )return;

        handleOnlineData(data);

    });

    conn.on("close",()=>{

        online.connected=false;

        setOnlineStatus(
            "🔴 Opponent disconnected.",
            false
        );

        toast(
            "⚠️ Opponent disconnected."
        );

    });

    conn.on("error",err=>{

        console.error(err);

        setOnlineStatus(
            "❌ Connection error.",
            false
        );

    });

}

function sendOnline(data){

    if(
        connection &&
        connection.open
    ){

        connection.send(data);

    }

}

function setOnlineStatus(
    text,
    connected
){

    const status=
        document.getElementById("onlineStatus");

    if(!status)return;

    status.innerHTML=`

        <span class="online-dot ${
            connected?"connected":""
        }"></span>

        ${escapeHTML(text)}

    `;

}

function startOnlineChessHost(){

    online.chess={

        board:initialChessBoard(),
        turn:"w",
        hostColor:"w",
        guestColor:"b",
        myColor:"w",
        selected:null,
        over:false

    };

    sendOnline({

        type:"onlineChessStart",
        board:online.chess.board,
        turn:"w",
        yourColor:"b"

    });

}

function startOnlineChessGuest(data){

        board:data.board,
        turn:data.turn,
        myColor:"b",
        selected:null,
        over:false

}

function drawOnlineChess(){

    const ch=online.chess;

    if(!ch)return;

    let html="";

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const piece=
                ch.board[r][c];

            const selected=
                ch.selected &&
                ch.selected.r===r &&
                ch.selected.c===c;

            const legal=
                ch.selected &&
                isOnlineChessLegal(
                    ch.selected.r,
                    ch.selected.c,
                    r,
                    c
                );

            html+=`

                <div
                class="square ${
                    (r+c)%2===0
                    ?"light-square"
                    :"dark-square"
                } ${
                    selected
                    ?"selected-square"
                    :""
                } ${
                    legal
                    ?"legal-square"
                    :""
                }"
                onclick="
                    clickOnlineChessSquare(${r},${c})
                ">

                    ${
                        piece
                        ?chessPieces[piece.c][piece.t]
                        :""
                    }

                </div>

            `;

        }

    }

    const myColor=
        online.role==="host"
        ?"w"
        :"b";

    gameShell("🌐 Online Chess",`

        <div class="connection">

            <span class="online-dot connected"></span>
            LIVE ONLINE CHESS

        </div>

        <div class="chess-wrap">

            <div class="chess-status">

                ${
                    ch.turn==="w"
                    ?"⚪ White"
                    :"⚫ Black"
                }
                turn

                <br>

                <span style="
                    color:var(--muted);
                    font-size:13px">

                    You are
                    ${
                        myColor==="w"
                        ?"White ⚪"
                        :"Black ⚫"
                    }

                </span>

            </div>

            <div class="chess-board">
                ${html}
            </div>

            <div class="chess-controls">

                <button
                onclick="sendRematchRequest()">
                    🔄 Rematch
                </button>

            </div>

        </div>

    `);

}

function isOnlineChessLegal(
    sr,sc,tr,tc
){

    const board=
        online.chess.board;

    if(
        !insideBoard(sr,sc)||
        !insideBoard(tr,tc)
    )return false;

    const piece=
        board[sr][sc];

    if(!piece)return false;

    const myColor=
        online.role==="host"
        ?"w"
        :"b";

    if(piece.c!==myColor)return false;

    const target=
        board[tr][tc];

    if(
        target &&
        target.c===piece.c
    )return false;

    const dr=tr-sr;
    const dc=tc-sc;

    const adr=Math.abs(dr);
    const adc=Math.abs(dc);

    if(piece.t==="p"){

        const direction=
            piece.c==="w"?-1:1;

        const start=
            piece.c==="w"?6:1;

        if(
            dc===0 &&
            dr===direction &&
            !target
        )return true;

        if(
            dc===0 &&
            sr===start &&
            dr===direction*2 &&
            !target &&
            !board[sr+direction][sc]
        )return true;

        if(
            adc===1 &&
            dr===direction &&
            target &&
            target.c!==piece.c
        )return true;

        return false;
    }

    if(piece.t==="n"){

        return(
            adr===2&&adc===1||
            adr===1&&adc===2
        );

    }

    if(piece.t==="k"){

        return adr<=1&&adc<=1;

    }

    function path(){

        const stepR=
            Math.sign(dr);

        const stepC=
            Math.sign(dc);

        let r=sr+stepR;
        let c=sc+stepC;

        while(
            r!==tr||
            c!==tc
        ){

            if(board[r][c])return false;

            r+=stepR;
            c+=stepC;

        }

        return true;

    }

    if(piece.t==="r"){

        if(dr!==0&&dc!==0)return false;

        return path();

    }

    if(piece.t==="b"){

        if(adr!==adc)return false;

        return path();

    }

    if(piece.t==="q"){

        if(
            dr!==0&&
            dc!==0&&
            adr!==adc
        )return false;

        return path();

    }

    return false;

}

function clickOnlineChessSquare(r,c){

    const ch=online.chess;

    if(!ch||ch.over)return;

    const myColor=
        online.role==="host"
        ?"w"
        :"b";

    if(ch.turn!==myColor){

        toast("⏳ Wait for your opponent.");

        return;
    }

    const piece=
        ch.board[r][c];

    if(!ch.selected){

        if(
            piece &&
            piece.c===myColor
        ){

            ch.selected={r,c};

            drawOnlineChess();

        }

        return;
    }

    const sr=ch.selected.r;
    const sc=ch.selected.c;

    if(
        piece &&
        piece.c===myColor
    ){

        ch.selected={r,c};

        drawOnlineChess();

        return;
    }

    if(
        isOnlineChessLegal(
            sr,sc,r,c
        )
    ){

        const movedPiece=
            ch.board[sr][sc];

        const newBoard=
            cloneBoard(ch.board);

        newBoard[r][c]=
            newBoard[sr][sc];

        newBoard[sr][sc]=null;

        if(
            movedPiece.t==="p" &&
            (r===0||r===7)
        ){

            newBoard[r][c].t="q";

        }

        const nextTurn=
            ch.turn==="w"
            ?"b"
            :"w";

        ch.board=newBoard;
        ch.turn=nextTurn;
        ch.selected=null;

        sendOnline({

            type:"onlineChessMove",
            board:newBoard,
            turn:nextTurn

        });

        drawOnlineChess();

    }

}

function handleOnlineChessMove(data){

    if(!online.chess)return;

    online.chess.board=
        data.board;

    online.chess.turn=
        data.turn;

    online.chess.selected=null;

    drawOnlineChess();

}


/* =========================================================
   ONLINE WORD BATTLE
========================================================= */

function startOnlineWordHost(){

    online.gameStarted=true;

    const word=
        scrambleWords[
            Math.floor(
                Math.random()*
                scrambleWords.length
            )
        ];

    online.word={

        word,
        hostScore:0,
        guestScore:0,
        round:1,
        time:30,
        hostTimer:null

    };

    sendOnline({

        type:"onlineWordStart",
        word,
        round:1,
        time:30

    });

    drawOnlineWord();

    startOnlineWordTimer();

}

function startOnlineWordGuest(data){

    online.gameStarted=true;

    online.word={

        word:data.word,
        hostScore:0,
        guestScore:0,
        round:data.round,
        time:data.time

    };

    drawOnlineWord();

    startOnlineWordTimer();

}

function drawOnlineWord(){

    const w=online.word;

    if(!w)return;

    const myScore=
        online.role==="host"
        ?w.hostScore
        :w.guestScore;

    const enemyScore=
        online.role==="host"
        ?w.guestScore
        :w.hostScore;

    gameShell("⚔️ Online Word Battle",`

        <div class="online-box">

            <div class="connection">

                <span class="online-dot connected"></span>
                LIVE ONLINE BATTLE

            </div>

            <div class="game-info">

                <span class="badge">
                    ⏱️ ${w.time}s
                </span>

                <span class="badge">
                    👤 You: ${myScore}
                </span>

                <span class="badge">
                    ⚔️ Opponent: ${enemyScore}
                </span>

                <span class="badge">
                    Round ${w.round}
                </span>

            </div>

        </div>

        <div class="scramble-word">
            ${shuffle(w.word)}
        </div>

        <div class="answer-row">

            <input
            id="onlineWordInput"
            class="input"
            placeholder="Solve the word..."
            onkeydown="
                if(event.key==='Enter')
                submitOnlineWord()
            ">

            <button
            class="play-btn"
            onclick="submitOnlineWord()">

                ⚔️ ATTACK

            </button>

        </div>

        <p style="
            text-align:center;
            color:var(--muted);
            margin-top:15px">

            First player to reach 5 points wins.

        </p>

    `);

    const input=
        document.getElementById(
            "onlineWordInput"
        );

    if(input)input.focus();

}

function submitOnlineWord(){

    if(!online.word)return;

    const input=
        document.getElementById(
            "onlineWordInput"
        );

    if(!input)return;

    const answer=
        input.value.trim().toUpperCase();

    if(answer!==online.word.word){

        toast("❌ Wrong!");

        input.value="";

        return;
    }

    sendOnline({

        type:"onlineWordCorrect",
        player:online.role

    });

    input.value="";

    toast("⚡ Correct!");

}

function startOnlineWordTimer(){

    const session=gameSession;

    safeInterval(()=>{

        if(!online.word)return;

        online.word.time--;

        if(online.word.time<=0){

            /*
              Only the host controls the next round.
            */

            if(online.role==="host"){

                nextOnlineWordRound();

            }

            return;

        }

        drawOnlineWord();

    },1000,session);

}

function nextOnlineWordRound(){

    if(!online.word)return;

    const next=
        scrambleWords[
            Math.floor(
                Math.random()*
                scrambleWords.length
            )
        ];

    online.word.word=next;
    online.word.round++;
    online.word.time=30;

    sendOnline({

        type:"onlineWordNext",
        word:next,
        round:online.word.round,
        time:30

    });

    drawOnlineWord();

}

function handleOnlineWordCorrect(player){

    if(!online.word)return;

    if(player==="host"){

        online.word.hostScore++;

    }else{

        online.word.guestScore++;

    }

    const score=
        online.role==="host"
        ?online.word.hostScore
        :online.word.guestScore;

    if(score>=5){

        sendOnline({

            type:"onlineWordWinner",
            winner:player

        });

        finishOnlineWord(player);

        return;

    }

    /*
      Host chooses next word so both clients stay synchronized.
    */

    if(online.role==="host"){

        nextOnlineWordRound();

    }

}

function finishOnlineWord(winner){

    stopAllTimers();

    const myRole=
        online.role;

    let message=
        "🏁 Battle finished!";

    if(winner){

        if(winner===myRole){

            message="🏆 YOU WIN!";

            profile.wins++;

            profile.totalGames++;
            profile.streak++;

            reward(100,50);

            achievement("online");

        }else{

            message="💥 YOU LOST!";

            profile.losses++;

            profile.totalGames++;
            profile.streak=0;

            save();

        }

    }

    gameShell("⚔️ Online Battle Complete",`

        <div style="
            text-align:center;
            padding:40px">

            <div style="font-size:70px">
                ${winner===myRole?"🏆":"⚔️"}
            </div>

            <h2 style="font-size:32px">
                ${message}
            </h2>

            <p style="
                color:var(--muted);
                margin-top:10px">

                Final score:
                ${online.word?.hostScore||0}
                -
                ${online.word?.guestScore||0}

            </p>

            <button
            class="primary-btn"
            style="
                max-width:280px;
                margin-top:25px"
            onclick="renderHome()">

                🏠 RETURN TO ARENA

            </button>

        </div>

    `);

}


/* =========================================================
   ONLINE MESSAGE ROUTER
========================================================= */

function handleOnlineData(data){

    if(!data||!data.type)return;

    if(data.type==="hello"){

        toast(
            `👋 ${data.username} joined!`
        );

        return;
    }

    if(data.type==="onlineChessStart"){

        startOnlineChessGuest(data);

        return;
    }

    if(data.type==="onlineChessMove"){

        handleOnlineChessMove(data);

        return;
    }

    if(data.type==="onlineWordStart"){

        startOnlineWordGuest(data);

        return;
    }

    if(data.type==="onlineWordCorrect"){

        handleOnlineWordCorrect(
            data.player
        );

        return;
    }

    if(data.type==="onlineWordNext"){

        if(!online.word)return;

        online.word.word=
            data.word;

        online.word.round=
            data.round;

        online.word.time=
            data.time;

        drawOnlineWord();

        return;
    }

    if(data.type==="onlineWordWinner"){

        finishOnlineWord(
            data.winner
        );

        return;
    }

    if(data.type==="rematch"){

        if(online.mode==="chess"){

            online.chess={

                board:initialChessBoard(),
                turn:"w",
                selected:null,
                over:false

            };

            if(
                online.role==="host"
            ){

                sendOnline({

                    type:"onlineChessStart",
                    board:
                        online.chess.board,
                    turn:"w",
                    yourColor:"b"

                });

            }

            drawOnlineChess();

        }else{

            if(
                online.role==="host"
            ){

                startOnlineWordHost();

            }

        }

    }

}

function sendRematchRequest(){

    if(
        !connection||
        !connection.open
    ){

        toast("❌ Not connected.");

        return;
    }

    sendOnline({
        type:"rematch"
    });

    if(online.mode==="chess"){

        online.chess={

            board:initialChessBoard(),
            turn:"w",
            selected:null,
            over:false

        };

        if(
            online.role==="host"
        ){

            sendOnline({

                type:"onlineChessStart",
                board:
                    online.chess.board,
                turn:"w",
                yourColor:"b"

            });

        }

        drawOnlineChess();

    }else{

        if(
            online.role==="host"
        ){

            startOnlineWordHost();

        }else{

            toast(
                "🔄 Rematch requested."
            );

        }

    }

}

function playDaily(){

    const today=
        new Date()
        .toISOString()
        .slice(0,10);

    const index=
        [...today].reduce(
            (sum,char)=>
                sum+
                char.charCodeAt(0),
            0
        )%words.length;

    const challenge=
        words[index];

    const answer=
        prompt(
            `🎯 DAILY CHALLENGE\n\n`+
            `Hint: ${challenge.hint}\n\n`+
            `Enter the word:`
        );

    if(!answer)return;

    if(
        answer.trim().toUpperCase()===
        challenge.word
    ){

        profile.dailyDate=today;
        profile.dailyCompleted=true;

        profile.wins++;
        profile.totalGames++;
        profile.streak++;

        reward(150,100);

        achievement("daily");

        toast(
            "🌟 Daily Challenge Complete!"
        );

    }else{

        profile.dailyDate=today;
        profile.dailyCompleted=false;

        profile.losses++;
        profile.totalGames++;
        profile.streak=0;

        save();

        toast(
            `❌ Answer was ${challenge.word}`
        );

    }

    renderDaily();

}

                            margin-top:5px">

                            ${
                                owned
                                ?"Unlocked"
                                :item.price+" coins"
                            }

                        </p>

                        <button
                        onclick="
                            buyAvatar(
                                '${item.id}',
                                ${item.price}
                            )
                        "
                        ${equipped?"disabled":""}>

                            ${
                                equipped
                                ?"✅ EQUIPPED"
                                :owned
                                ?"EQUIP"
                                :"BUY"
                            }

                        </button>

                    </div>

                `;

            }).join("")}

        </div>

    `);

}

function buyAvatar(
    avatar,
    price
){

    if(
        profile.unlockedAvatars
        .includes(avatar)
    ){

        profile.avatar=avatar;

        save();

        updateMiniProfile();

        toast("👤 Avatar equipped!");

        renderShop();

        return;
    }

    if(profile.coins<price){

        toast("🪙 Not enough coins.");

        return;
    }

    profile.coins-=price;

    profile.unlockedAvatars
        .push(avatar);

    profile.avatar=avatar;

    save();

    updateMiniProfile();

    toast(
        `🎉 ${avatar} unlocked!`
    );

    renderShop();

}

========================================================= */

function toggleTheme(){

    document.body

        .toggle("light");

    localStorage.setItem(
        "WGA_THEME",
        document.body
        .classList
        .contains("light")

function loadTheme(){

        )==="light"
    ){

    }

}


/* =========================================================
   SOUND
========================================================= */

let audioContext=null;

function sound(
    freq=500,
    duration=80
){

    if(!soundEnabled)return;

    try{

        if(!audioContext){

            audioContext=
                new(
                    window.AudioContext||
                    window.webkitAudioContext
                )();

        }

        const oscillator=
            audioContext
            .createOscillator();

        const gain=
            audioContext
            .createGain();

        oscillator.frequency.value=
            freq;

        oscillator.type="sine";

        gain.gain.setValueAtTime(
            .05,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime+
            duration/1000
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime+
            duration/1000
        );

    }catch(e){}

}

function toggleSound(){

    soundEnabled=!soundEnabled;

    toast(
        soundEnabled
        ?"🔊 Sound ON"
        :"🔇 Sound OFF"
    );

}


/* =========================================================
   RESET
========================================================= */

function resetProgress(){

    if(
        !confirm(
            "Are you sure you want to delete all game progress?"
        )
    )return;

    stopAllTimers();

    cleanupPeer();

    localStorage.removeItem(
        STORAGE_KEY
    );

    location.reload();

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    const container=
        document.getElementById(
            "toastContainer"
        );

    if(!container)return;

    const element=
        document.createElement("div");

    element.className="toast";

    element.textContent=message;

    container.appendChild(element);

    setTimeout(()=>{

        element.remove();

    },2500);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   CLONE CHESS BOARD
========================================================= */

function cloneBoard(board){

    return board.map(row=>
        row.map(piece=>
            piece
            ?{
                c:piece.c,
                t:piece.t
            }
            :null
        )
    );

}


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(!profile)return;

        const active=
            document.activeElement;

        if(
            active &&
            (
                active.tagName==="INPUT"||
                active.tagName==="TEXTAREA"
            )
        ){

            return;

        }

        if(event.key==="Escape"){

            renderHome();

        }

        if(event.key==="1"){

            startGame("hangman");

        }

        if(event.key==="2"){

            startGame("scramble");

        }

        if(event.key==="3"){

            startGame("rush");

        }

        if(event.key==="4"){

            startGame("master");

        }

        if(event.key==="5"){

            startGame("trivia");

        }

        if(event.key==="6"){

            startGame("chess");

        }

    }
);

/* =========================================================

========================================================= */

const originalEnterApp=
    enterApp;

enterApp=function(){

    originalEnterApp();

    const room=
        getRoomFromURL();

    const game=
        getGameFromURL();

    if(
        room &&
        game==="chess"
    ){

        const s=gameSession;

        safeTimer(()=>{

            renderOnlineLobby("chess");

            safeTimer(()=>{

                showJoinRoom(
                    "chess",
                    room
                );

            },100,s);

        },200,s);

    }

    if(
        room &&
        game==="word"
    ){

        const s=gameSession;

        safeTimer(()=>{

            renderOnlineLobby("word");

            safeTimer(()=>{

                showJoinRoom(
                    "word",
                    room
                );

            },100,s);

        },200,s);

    }

};
